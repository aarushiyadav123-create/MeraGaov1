    villages: [
      { hi: "भिवानी शहर", en: "Bhiwani City" },
      { hi: "लोहारू", en: "Loharu" },
      { hi: "सिवानी", en: "Siwani" },
      { hi: "बाढड़ा", en: "Badhra" }
    ]
  },

    villages: [

    villages: [

      { hi: "समालखा", en: "Samalkha" },

      { hi: "इन्द्रगढ़", en: "Indragarh" }
    ]
  }
};

class VillageApp {
  constructor() {
    this.loadCustomVillagesFromStorage();

    this.state = {
      lang: 'hi',
      view: 'home',
      selectedDistrict: localStorage.getItem('selectedDistrict') || 'charkhi-dadri',
      searchVillage: localStorage.getItem('searchVillage') || 'कलानौर',
      services: [],
      gallery: [],
      market: [],
      announcements: [],
      greetings: [],
      chaupalMessages: [],
      historyGallery: [],
      allowedChatUsers: {}, 
      subAdmins: [],
      userAvatarUrl: localStorage.getItem('userCustomAvatar') || 'https://cdn-icons-png.flaticon.com/512/3135/3135715.png',
      isAdminLoggedIn: false,
      isSubAdminLoggedIn: false,
      currentUserPhone: localStorage.getItem('currentUserPhone') || ''
    };

    this.tempImage = '';
    this.tempMedia = ''; 
    this.tempMediaType = 'image'; 
    this.unreadMessageCount = 0;

    this.initListeners();
    this.initFirebaseData();
    this.render();
    this.handleStartupSplashAndWelcome();
  }

  // 🌟 स्प्लैश स्क्रीन और फर्स्ट टाइम वेलकम ग्रीटिंग लॉजिक
  handleStartupSplashAndWelcome() {
    // 1. स्प्लैश स्क्रीन को 1.5 सेकंड बाद फेट-आउट करके हटाना
    setTimeout(() => {
      const splash = document.getElementById('splashScreen');
      if (splash) {
        splash.style.opacity = '0';
        setTimeout(() => splash.remove(), 500);
      }
    }, 1500);

    // 2. चेक करना कि यूजर ने पहली बार ऐप खोली है या नहीं
    const hasSeenWelcome = localStorage.getItem('hasSeenWelcomeMeraGaov');
    if (!hasSeenWelcome) {
      setTimeout(() => {
        this.showWelcomeGreetingModal();
      }, 1600);
    }
  }

  showWelcomeGreetingModal() {
    const container = document.getElementById('welcomeModalContainer');
    if (!container) return;

    container.innerHTML = `
      <div class="welcome-overlay">
        <div class="welcome-modal">
          <div class="welcome-title">राम-राम भाईयों! 🙏</div>
          <div class="welcome-text">
            हरियाणा के हमारे इस डिजिटल गाँव (MeraGaov) में आपका स्वागत है। यह ऐप आपके और पूरे गाँव के लिए बनाई गई है, जिससे आप हर जरूरी खबर और सेवा से जुड़े रह सकें।
          </div>
          <button class="welcome-btn" onclick="app.closeWelcomeModal()">शुरू करें</button>
        </div>
      </div>
    `;
  }

  closeWelcomeModal() {
    localStorage.setItem('hasSeenWelcomeMeraGaov', 'true');
    const container = document.getElementById('welcomeModalContainer');
    if (container) container.innerHTML = '';
  }

  loadCustomVillagesFromStorage() {
    try {
      let savedVillages = JSON.parse(localStorage.getItem('customDistrictVillages'));
      if (savedVillages) {
        for (let dKey in savedVillages) {
          if (HARYANA_DISTRICTS_AND_VILLAGES[dKey]) {
            savedVillages[dKey].forEach(newV => {
              let exists = HARYANA_DISTRICTS_AND_VILLAGES[dKey].villages.some(v => v.hi === newV.hi);
              if (!exists) {
                HARYANA_DISTRICTS_AND_VILLAGES[dKey].villages.push(newV);
              }
            });
          }
        }
      }
    } catch(e) { console.error(e); }
  }

  addNewVillageToDistrict() {
    const inputEl = document.getElementById('newVillageNameInput');
    const villageName = inputEl ? inputEl.value.trim() : '';

    if (!villageName) {
      alert("कृपया नए गाँव का नाम दर्ज करें!");
      return;
    }

    const currentDist = this.state.selectedDistrict;
    const exists = HARYANA_DISTRICTS_AND_VILLAGES[currentDist].villages.some(v => v.hi === villageName);
    
    if (exists) {
      alert("यह गाँव सूची में पहले से मौजूद है!");
      return;
    }

    const newVillageObj = { hi: villageName, en: villageName };
    HARYANA_DISTRICTS_AND_VILLAGES[currentDist].villages.push(newVillageObj);

    let savedVillages = JSON.parse(localStorage.getItem('customDistrictVillages')) || {};
    if (!savedVillages[currentDist]) savedVillages[currentDist] = [];
    savedVillages[currentDist].push(newVillageObj);
    localStorage.setItem('customDistrictVillages', JSON.stringify(savedVillages));

    this.state.searchVillage = villageName;
    alert(`गाँव '${villageName}' सफलतापूर्वक जोड़ दिया गया है!`);
    this.render();
  }

  initListeners() {
    const menuToggle = document.getElementById('menuToggleBtn');
    if(menuToggle) {
      menuToggle.onclick = (e) => {
        e.stopPropagation();
        const menu = document.getElementById('dropdownMenu');
        menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
      };
    }
    window.onclick = () => { 
      const menu = document.getElementById('dropdownMenu');
      if(menu) menu.style.display = 'none'; 
    };
    
    const langBtn = document.getElementById('langToggleBtn');
    if(langBtn) {
      langBtn.onclick = () => {
        this.state.lang = this.state.lang === 'hi' ? 'en' : 'hi';
        langBtn.innerText = this.state.lang === 'hi' ? '🌐 English' : '🌐 हिंदी';
        this.render();
      };
    }
  }

  initFirebaseData() {
    setTimeout(() => {
      if (window.firebaseDb) {
        const { db, ref, onValue } = window.firebaseDb;
        onValue(ref(db, 'services'), snap => {
          const val = snap.val();
          this.state.services = val ? Object.keys(val).map(k => ({id: k, ...val[k]})).reverse() : [];
          this.updateTicker();
          if(this.state.view === 'list' || this.state.view === 'admin') this.render();
        });
        onValue(ref(db, 'announcements'), snap => {
          const val = snap.val();
          this.state.announcements = val ? Object.keys(val).map(k => ({id: k, ...val[k]})).reverse() : [];
          if(this.state.view === 'announcements' || this.state.view === 'admin') this.render();
        });
        onValue(ref(db, 'market'), snap => {
          const val = snap.val();
          this.state.market = val ? Object.keys(val).map(k => ({id: k, ...val[k]})).reverse() : [];
          if(this.state.view === 'market' || this.state.view === 'admin') this.render();
        });
        onValue(ref(db, 'greetings'), snap => {
          const val = snap.val();
          this.state.greetings = val ? Object.keys(val).map(k => ({id: k, ...val[k]})).reverse() : [];
          if(this.state.view === 'greetings' || this.state.view === 'admin') this.render();
        });
        onValue(ref(db, 'historyGallery'), snap => {
          const val = snap.val();
          this.state.historyGallery = val ? Object.keys(val).map(k => ({id: k, ...val[k]})).reverse() : [];
          if(this.state.view === 'historyGallery' || this.state.view === 'admin') this.render();
        });
        onValue(ref(db, 'chaupalMessages'), snap => {
          const val = snap.val();
          const newMsgs = val ? Object.keys(val).map(k => ({id: k, ...val[k]})).reverse() : [];
          if (this.state.view !== 'chaupal' && newMsgs.length > this.state.chaupalMessages.length && this.state.chaupalMessages.length > 0) {
            this.unreadMessageCount += (newMsgs.length - this.state.chaupalMessages.length);
          }
          this.state.chaupalMessages = newMsgs;
          if(this.state.view === 'chaupal' || this.state.view === 'home') this.render();
        });
        onValue(ref(db, 'allowedChatUsers'), snap => {
          const val = snap.val();
          this.state.allowedChatUsers = val || {};
          if(this.state.view === 'chaupal' || this.state.view === 'admin') this.render();
        });
        onValue(ref(db, 'subAdmins'), snap => {
          const val = snap.val();
          this.state.subAdmins = val ? Object.keys(val).map(k => ({id: k, pwd: val[k]})) : [];
        });
      }
    }, 1000);
  }

  updateTicker() {
    const tickerEl = document.getElementById('dynamicTickerText');
    if(!tickerEl) return;
    let approvedShops = this.state.services.filter(s => s.status === 'approved' && s.districtId === this.state.selectedDistrict && s.villageHi === this.state.searchVillage);
    let baseText = "🌾 सरसों: ₹5,400/क्विंटल | 🌾 गेहूँ: ₹2,425/क्विंटल | 🌤️ मौसम: सामान्य";
    if(approvedShops.length > 0) {
      let shopTickerItems = approvedShops.map(s => `🛒 नई दुकान: ${s.name} (${s.category || 'Service'}) - ${s.phone}`).join(' | ');
      tickerEl.innerHTML = `${shopTickerItems} | ${baseText}`;
    } else {
      tickerEl.innerHTML = baseText;

  changeUserAvatar(input) {
    const file = input.files[0];
    if(file) {
      const reader = new FileReader();
      reader.onloadend = () => {
        this.state.userAvatarUrl = reader.result;
        localStorage.setItem('userCustomAvatar', reader.result);
        const avatarEl = document.getElementById('headerUserAvatar');
        if(avatarEl) avatarEl.src = reader.result;
        alert("प्रोफाइल फोटो बदल दी गई है!");
      };
      reader.readAsDataURL(file);
    }
  }

  requestAdminAccess() {
    let pwd = prompt("एडमिन पासवर्ड दर्ज करें:");
    if(pwd === '1234') {
      this.state.isAdminLoggedIn = true;
      this.state.isSubAdminLoggedIn = false;
      this.changeView('admin');
    } else { alert("गलत पासवर्ड!"); }
  }

  requestSubAdminAccess() {
    let pwd = prompt("सब-एडमिन पासवर्ड दर्ज करें:");
    let matchedSub = this.state.subAdmins.find(s => s.pwd === pwd);
    if(matchedSub || pwd === '1234') {
      this.state.isAdminLoggedIn = (pwd === '1234');
      this.state.isSubAdminLoggedIn = true;
      this.changeView('admin');
    } else { alert("गलत पासवर्ड!"); }
  }

  changeView(viewName) {
    this.state.view = viewName;
    if(viewName === 'chaupal') {
      this.unreadMessageCount = 0;
    }
    this.render();
  }

  saveData(path, data, msg) {
    if (window.firebaseDb) {
      const { db, ref, push } = window.firebaseDb;
      push(ref(db, path), { 
        ...data, 
        districtId: this.state.selectedDistrict, 
        villageHi: this.state.searchVillage, 
        status: 'pending', 
        timestamp: Date.now() 
      })
      .then(() => { 
        alert(msg); 
        this.changeView('home'); 
      })
      .catch(err => alert("Error: " + err.message));
    }
  }

  approveItem(path, id) {
    if (window.firebaseDb) {
      const { db, ref, update } = window.firebaseDb;
      update(ref(db, `${path}/${id}`), { status: 'approved' }).then(() => {
        alert("सफलतापूर्वक अप्रूव हो गया!");
        this.updateTicker();
        this.render();
      });
    }
  }

  deleteItem(path, id) {
    if(confirm("डिलीट करना चाहते हैं?")) {
      if (window.firebaseDb) {
        const { db, ref, remove } = window.firebaseDb;
        remove(ref(db, `${path}/${id}`)).then(() => {
          this.updateTicker();
          this.render();
        });
      }
    }
  }

  handleImage(input) {
    const file = input.files[0];
    if(file) {
      const reader = new FileReader();
      reader.onloadend = () => { 
        this.tempImage = reader.result; 
        alert("✅ फोटो चुन ली गई है!");
      };
      reader.readAsDataURL(file);
    }
  }

  handleHistoryGalleryMedia(input) {
    const file = input.files[0];
    if(file) {
      this.tempMediaType = file.type.startsWith('video') ? 'video' : 'image';
      const reader = new FileReader();
      reader.onloadend = () => { 
        this.tempMedia = reader.result; 
        alert(`✅ ${this.tempMediaType === 'video' ? 'वीडियो' : 'फोटो'} चुन ली गई है!`);
      };
      reader.readAsDataURL(file);
    }
  }

    const name = document.getElementById('sName')?.value.trim();
    const phone = document.getElementById('sPhone')?.value.trim();
    const cat = document.getElementById('sCat')?.value;
    if(!name || !phone) return alert("कृपया दुकान का नाम और मोबाइल नंबर भरें!");
    this.saveData('services', { name, phone, category: cat, imageUrl: this.tempImage || '' }, "दुकान अप्रूवल के लिए भेज दी गई है!");
    this.tempImage = '';
  }

  submitAnnouncement() {
    const name = document.getElementById('annName')?.value.trim();
    const phone = document.getElementById('annPhone')?.value.trim();
    const title = document.getElementById('annTitle')?.value.trim();
    if(!name || !phone || !title) return alert("कृपया नाम, मोबाइल नंबर और मुनादी का विवरण भरें!");
    this.saveData('announcements', { name, phone, title, imageUrl: this.tempImage || '' }, "मुनादी अप्रूवल के लिए भेज दी गई है!");
    this.tempImage = '';
  }

  submitGreeting() {
    const name = document.getElementById('gName')?.value.trim();
    const phone = document.getElementById('gPhone')?.value.trim();
    const message = document.getElementById('gMsg')?.value.trim();
    if(!name || !phone || !message) return alert("कृपया नाम, मोबाइल नंबर और संदेश विवरण भरें!");
    this.saveData('greetings', { name, phone, message, imageUrl: this.tempImage || '' }, "बैनर/बधाई संदेश अप्रूवल के लिए भेज दिया गया है!");
    this.tempImage = '';

    const phone = document.getElementById('mPhone')?.value.trim();
    const title = document.getElementById('mTitle')?.value.trim();
    const itemType = document.getElementById('mItemType')?.value;
    if(!name || !phone || !title) return alert("कृपया नाम, मोबाइल नंबर और विवरण भरें!");
    this.saveData('market', { name, phone, title, itemType, imageUrl: this.tempImage || '' }, "पोस्ट अप्रूवल के लिए भेज दी गई है!");

  submitHistoryGallery() {
    const name = document.getElementById('hgName')?.value.trim();
    const title = document.getElementById('hgTitle')?.value.trim();
    const category = document.getElementById('hgCategory')?.value;
    if(!name || !title || !this.tempMedia) return alert("कृपया नाम, विवरण और फोटो/वीडियो ज़रूर चुनें!");
    
    this.saveData('historyGallery', {

      mediaType: this.tempMediaType 
    }, "इतिहास/गैलरी पोस्ट अप्रूवल के लिए भेज दी गई है!");
    this.tempMedia = '';
  }

  verifyUserForChat() {
    const phoneInput = document.getElementById('verifyPhoneInput')?.value.trim();
    const passInput = document.getElementById('verifyPassInput')?.value.trim();
    if(!phoneInput || !passInput) return alert("कृपया अपना मोबाइल नंबर और पासवर्ड दोनों दर्ज करें!");

    let isMasterAdmin = (this.state.isAdminLoggedIn || this.state.isSubAdminLoggedIn);
    let registeredPass = this.state.allowedChatUsers[phoneInput];

    if(isMasterAdmin || (registeredPass && registeredPass === passInput)) {
      this.state.currentUserPhone = phoneInput;
      localStorage.setItem('currentUserPhone', phoneInput);
      alert("सत्यापन सफल! चैट रूम में आपका स्वागत है।");
      this.render();
    } else {
      alert("❌ गलत मोबाइल नंबर या पासवर्ड!");
    }
  }

  submitChaupalMsg() {
    const senderName = document.getElementById('cName')?.value.trim();
    const msgText = document.getElementById('cText')?.value.trim();

    if(!senderName || !msgText) return alert("कृपया अपना नाम और संदेश लिखें!");

    let fullMsg = `${msgText} (सम्पर्क: ${this.state.currentUserPhone})`;

    if (window.firebaseDb) {
      const { db, ref, push } = window.firebaseDb;
      push(ref(db, 'chaupalMessages'), {
        name: senderName,
        phone: this.state.currentUserPhone,
        message: fullMsg,
        districtId: this.state.selectedDistrict,
        villageHi: this.state.searchVillage,
        timestamp: Date.now()
      }).then(() => {
        document.getElementById('cName').value = '';
        document.getElementById('cText').value = '';
        this.render();
      });
    }
  }

  addAllowedMemberWithPassword() {
    const phone = document.getElementById('newMemberPhone')?.value.trim();
    const pwd = document.getElementById('newMemberPass')?.value.trim();

    if(!phone || !pwd) return alert("कृपया सदस्य का मोबाइल नंबर और उसका पासवर्ड दोनों भरें!");

    if (window.firebaseDb) {
      const { db, ref, set } = window.firebaseDb;
      set(ref(db, `allowedChatUsers/${phone}`), pwd).then(() => {
        document.getElementById('newMemberPhone').value = '';
        document.getElementById('newMemberPass').value = '';
        alert("सफलतापूर्वक नया सदस्य और उसका पासवर्ड सेट कर दिया गया है!");
      });
    }
  }

  removeAllowedMember(phone) {
    if(confirm(`क्या आप इस नंबर (${phone}) को चैट रूम से हटाना चाहते हैं?`)) {
      if (window.firebaseDb) {
        const { db, ref, remove } = window.firebaseDb;
        remove(ref(db, `allowedChatUsers/${phone}`)).then(() => {
          alert("सदस्य हटा दिया गया है!");

      }
    }
  }

                <option value="ट्रैक्टर (Tractor)">ट्रैक्टर (Tractor)</option>
                <option value="बाइक (Bike)">बाइक (Bike)</option>
                <option value="अन्य वाहन/पशु">अन्य वाहन या पशु</option>
              </select>
            </div>
            <textarea class="form-control" id="mTitle" placeholder="विवरण लिखें..." style="margin-bottom:8px; height:60px;"></textarea>
            <input type="file" accept="image/*" class="form-control" onchange="app.handleImage(this)" style="margin-bottom:8px;" />
            <button class="btn-submit" onclick="app.submitMarket()">📤 पोस्ट भेजें</button>
          </div>
          ${items || `<div class="empty-state">इस श्रेणी में अभी कोई पोस्ट उपलब्ध नहीं है।</div>`}
        </div>
      `;
    }
    else if (this.state.view === 'historyGallery') {
      let items = this.state.historyGallery.filter(hg => hg.status === 'approved' && hg.districtId === this.state.selectedDistrict && hg.villageHi === this.state.searchVillage).map(hg => `
        <div class="service-item" style="border-left: 4px solid #0891b2;">
          <span class="service-tag">${hg.category}</span>
          <div class="service-name">${hg.title}</div>
          <p style="font-size: 11px; color: #047857; margin-bottom: 6px;"><b>प्रस्तुतकर्ता:</b> ${hg.name}</p>
          ${hg.mediaType === 'video' ? `<video src="${hg.mediaUrl}" controls class="service-video"></video>` : `<img src="${hg.mediaUrl}" class="service-img"/>`}
          ${(this.state.isAdminLoggedIn || this.state.isSubAdminLoggedIn)?`<button class="delete-btn" onclick="app.deleteItem('historyGallery', '${hg.id}')">🗑️ Delete</button>`:''}
        </div>
      `).join('');
      
      html = `
        <button class="back-btn" onclick="app.changeView('home')">← होम</button>
        <div class="card">
          <div class="card-title">🏛️ गाँव का इतिहास और गैलरी (${displayVillageName})</div>
          <div class="live-upload-box">
            <input class="form-control" id="hgName" placeholder="आपका नाम..." style="margin-bottom:8px;" />
            <div class="form-group">
              <label>📂 सेक्शन चुनें:</label>
              <select class="form-control" id="hgCategory" style="margin-bottom:8px;">
                <option value="गाँव का इतिहास (History)">गाँव का इतिहास (History)</option>
                <option value="गाँव की गैलरी (Photo/Video Gallery)">गाँव की गैलरी (Photo/Video)</option>
              </select>
            </div>
            <textarea class="form-control" id="hgTitle" placeholder="इतिहास या फोटो/वीडियो का विवरण..." style="margin-bottom:8px; height:60px;"></textarea>
            <div class="form-group">
              <label>📷 फोटो या वीडियो चुनें:</label>
              <input type="file" accept="image/*,video/*" class="form-control" onchange="app.handleHistoryGalleryMedia(this)" style="margin-bottom:8px;" />
            </div>
            <button class="btn-submit" onclick="app.submitHistoryGallery()">📤 पोस्ट अपलोड करें</button>
          </div>
          ${items || `<div class="empty-state">इस गाँव के लिए अभी कोई स्वीकृत इतिहास या गैलरी मीडिया उपलब्ध नहीं है।</div>`}
        </div>
      `;
    }
    else if (this.state.view === 'chaupal') {
      let isUserVerified = (this.state.isAdminLoggedIn || this.state.isSubAdminLoggedIn) || (this.state.currentUserPhone && this.state.allowedChatUsers[this.state.currentUserPhone]);

      let chaupalList = '';
      if(isUserVerified) {
        chaupalList = this.state.chaupalMessages
          .filter(c => c.districtId === this.state.selectedDistrict && c.villageHi === this.state.searchVillage)
          .map(c => `
            <div style="background: white; border: 1px solid #e2e8f0; border-radius: 10px; padding: 10px; margin-bottom: 8px;">
              <div style="font-size: 12px; font-weight: bold; color: #047857;">${c.name}</div>
              <div style="font-size: 13px; color: #0f172a; margin-top: 3px;">${c.message}</div>
              ${(this.state.isAdminLoggedIn || this.state.isSubAdminLoggedIn) ? `<button class="delete-btn" onclick="app.deleteItem('chaupalMessages', '${c.id}')">🗑️ डिलीट संदेश</button>` : ''}
            </div>
          `).join('');
      }

      let chatContentArea = '';
      if(!isUserVerified) {
        chatContentArea = `
          <div style="background: #fef2f2; border: 1px solid #f87171; border-radius: 12px; padding: 16px; text-align: center;">
            <p style="color: #991b1b; font-size: 13px; font-weight: bold; margin-bottom: 10px;">
              🔒 यह Admin Chat Room सुरक्षित है। कृपया अपना रजिस्टर्ड मोबाइल नंबर और पासवर्ड दर्ज करें।
            </p>
            <input class="form-control" id="verifyPhoneInput" placeholder="मोबाइल नंबर दर्ज करें..." style="margin-bottom:8px;" />
            <input type="password" class="form-control" id="verifyPassInput" placeholder="पासवर्ड दर्ज करें..." style="margin-bottom:8px;" />
            <button class="btn-submit" style="background: #dc2626;" onclick="app.verifyUserForChat()">🔐 चैट में प्रवेश करें</button>
          </div>
        `;
      } else {
        chatContentArea = `
          <div style="background: #f0fdf4; border: 1px solid #10b981; border-radius: 12px; padding: 12px; margin-bottom: 12px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
              <div style="font-size: 12px; font-weight: bold; color: #064e3b;">✍️ संदेश भेजें:</div>
              <button style="background:#dc2626; color:white; border:none; padding:3px 8px; border-radius:6px; font-size:10px; cursor:pointer;" onclick="app.state.currentUserPhone=''; localStorage.removeItem('currentUserPhone'); app.render();">लॉग आउट</button>
            </div>
            <input class="form-control" id="cName" placeholder="आपका नाम..." style="margin-bottom:8px;" />
            <textarea class="form-control" id="cText" placeholder="अपना संदेश यहाँ लिखें..." style="margin-bottom:8px; height:60px;"></textarea>
            <button class="btn-submit" onclick="app.submitChaupalMsg()">💬 संदेश भेजें</button>
          </div>
          <div style="margin-top: 10px;">
            ${chaupalList || `<div class="empty-state">चैट रूम में अभी कोई संदेश नहीं है।</div>`}
          </div>
        `;
      }

      let adminMemberAddSection = (this.state.isAdminLoggedIn || this.state.isSubAdminLoggedIn) ? `
        <div style="background: #eff6ff; border: 1px solid #2563eb; border-radius: 12px; padding: 12px; margin-bottom: 15px;">
          <div style="font-size: 12px; font-weight: bold; color: #1e40af; margin-bottom: 6px;">⚙️ नया सदस्य और पासवर्ड जोड़ें</div>
          <input class="form-control" id="newMemberPhone" placeholder="सदस्य का मोबाइल नंबर..." style="margin-bottom:8px;" />
          <input class="form-control" id="newMemberPass" placeholder="पासवर्ड सेट करें..." style="margin-bottom:8px;" />
          <button style="background: #2563eb; color: white; border: none; width:100%; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer;" onclick="app.addAllowedMemberWithPassword()">सेव करें</button>
          
          <div style="margin-top:10px; font-size:11px; color:#1e40af; font-weight:bold;">जुड़े हुए सदस्य:</div>
          <div style="max-height: 100px; overflow-y:auto; margin-top:5px;">
            ${Object.keys(this.state.allowedChatUsers).map(ph => `
              <div style="display:flex; justify-content:space-between; align-items:center; background:white; padding:4px 8px; margin-bottom:4px; border-radius:6px; font-size:12px;">
                <span>📱 ${ph}</span>
                <button onclick="app.removeAllowedMember('${ph}')" style="background:#dc2626; color:white; border:none; padding:2px 6px; border-radius:4px; font-size:10px; cursor:pointer;">हटाएं</button>
              </div>
            `).join('') || '<div style="font-size:11px; color:#666;">कोई सदस्य नहीं जोड़ा गया।</div>'}
          </div>
        </div>
      ` : '';

      html = `
        <button class="back-btn" onclick="app.changeView('home')">← होम</button>
        <div class="card">
          <div class="card-title">💬 Admin Chat Room</div>
          ${adminMemberAddSection}
          ${chatContentArea}
        </div>
      `;
    }
    else if (this.state.view === 'policy') {
      html = `
        <button class="back-btn" onclick="app.changeView('home')">← होम</button>
        <div class="card">
          <div class="card-title">📜 Privacy Policy</div>
          <p style="font-size:13px; color:#334155;">आपकी डेटा सुरक्षा हमारी प्राथमिकता है।</p>
        </div>
      `;
    }
    else if (this.state.view === 'about') {
      html = `
        <button class="back-btn" onclick="app.changeView('home')">← होम</button>
        <div class="card">
          <div class="card-title">ℹ️ About Us</div>
          <p style="font-size:13px; color:#334155; line-height: 1.6;">
            गाँव को डिजिटल रूप से सशक्त बनाना।<br>
            <b>संचालक / निर्माता:</b> Kusum w/o Rajesh Yadav
          </p>
        </div>
      `;
    }
    else if (this.state.view === 'admin') {
      if(!this.state.isAdminLoggedIn && !this.state.isSubAdminLoggedIn) return this.changeView('home');

      let renderPend = (arr, path, labelName) => arr.filter(x => x.status === 'pending' && x.districtId === this.state.selectedDistrict && x.villageHi === this.state.searchVillage).map(x => `
        <div class="media-card" style="border: 2px solid #2563eb;">
          <span class="service-tag">${labelName}</span>
          <div class="service-name">${x.title || x.message || x.name || ''}</div>
          ${x.name ? `<p style="font-size:11px; color:#555;">द्वारा: ${x.name} | फोन: ${x.phone || 'N/A'}</p>` : ''}
        
          ${x.imageUrl ? `<img src="${x.imageUrl}" class="service-img"/>` : ''}
          ${x.mediaUrl ? (x.mediaType === 'video' ? `<video src="${x.mediaUrl}" controls class="service-video"></video>` : `<img src="${x.mediaUrl}" class="service-img"/>`) : ''}
          <button class="approve-btn" onclick="app.approveItem('${path}', '${x.id}')">✅ Approve</button>
          <button class="delete-btn" onclick="app.deleteItem('${path}', '${x.id}')">❌ Reject</button>
        </div>
      `).join('');

      let pServ = renderPend(this.state.services, 'services', 'Shop/Service');
      let pAnn = renderPend(this.state.announcements, 'announcements', 'Announcement');
      let pGreet = renderPend(this.state.greetings, 'greetings', 'Greeting/Banner');
      let pMkt = renderPend(this.state.market, 'market', 'Market');
      let pHg = renderPend(this.state.historyGallery, 'historyGallery', 'History & Gallery');

      html = `
        <button class="back-btn" onclick="app.changeView('home')">← होम</button>
        <div class="card"><div class="card-title">📥 Admin Approval Panel (${displayVillageName})</div></div>
        ${pServ || ''} ${pAnn || ''} ${pGreet || ''} ${pMkt || ''} ${pHg || ''}
        ${(!pServ && !pAnn && !pGreet && !pMkt && !pHg) ? '<div class="empty-state">कोई पेंडिंग अनुरोध नहीं है।</div>' : ''}
      `;
    }

    content.innerHTML = html;
  }
}

const app = new VillageApp();
</script>
</body>
</html>
