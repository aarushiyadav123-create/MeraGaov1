@import url('https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600;700&display=swap');

.dropdown-item { padding: 12px 16px; font-size: 13px; font-weight: bold; color: #0f172a; border-bottom: 1px solid #f1f5f9; cursor: pointer; display: flex; align-items: center; gap: 8px; }

    villages: [
      { hi: "भिवानी शहर", en: "Bhiwani City" },
      { hi: "लोहारू", en: "Loharu" },
      { hi: "सिवानी", en: "Siwani" },
      { hi: "बाढड़ा", en: "Badhra" }
    ]
  },
  "hisar": {

    villages: [
      { hi: "हिसार शहर", en: "Hisar City" },

  "panipat": {

    villages: [

      { hi: "इन्द्रगढ़", en: "Indragarh" }
    ]
  }
};

class VillageApp {
  constructor() {
    this.loadCustomVillagesFromStorage();

    this.state = {
      lang: 'hi',
      view: 'home',
      selectedDistrict: localStorage.getItem('selectedDistrict') || 'charkhi-dadri',
      searchVillage: localStorage.getItem('searchVillage') || 'कलानौर',
      services: [],
      gallery: [],
      market: [],
      announcements: [],
      greetings: [],
      chaupalMessages: [],
      historyGallery: [],
      allowedChatUsers: {}, 
      subAdmins: [],
      userAvatarUrl: localStorage.getItem('userCustomAvatar') || 'https://cdn-icons-png.flaticon.com/512/3135/3135715.png',
      isAdminLoggedIn: false,
      isSubAdminLoggedIn: false,
      currentUserPhone: localStorage.getItem('currentUserPhone') || '',
      isDistrictBoxOpen: false
    };

    this.tempImage = '';
    this.tempMedia = ''; 
    this.tempMediaType = 'image'; 
    this.generatedBannerDataUrl = '';
    this.bannerUserPhotoObj = null;
    this.unreadMessageCount = 0;

    this.initListeners();
    this.initFirebaseData();
    this.render();
    this.handleStartupSplashAndWelcome();
  }

  handleStartupSplashAndWelcome() {
    setTimeout(() => {
      const splash = document.getElementById('splashScreen');
      if (splash) {
        splash.style.opacity = '0';
        setTimeout(() => splash.remove(), 500);
      }
    }, 1500);

    const hasSeenWelcome = localStorage.getItem('hasSeenWelcomeMeraGaov');
    if (!hasSeenWelcome) {
      setTimeout(() => {
        this.showWelcomeGreetingModal();
      }, 1600);
    }
  }

  showWelcomeGreetingModal() {
    const container = document.getElementById('welcomeModalContainer');
    if (!container) return;

    container.innerHTML = `
      <div class="welcome-overlay">
        <div class="welcome-modal">
          <div class="welcome-title">राम-राम भाईयों! 🙏</div>
          <div class="welcome-text">
            हरियाणा के हमारे इस डिजिटल गाँव (MeraGaov) में आपका स्वागत है। यह ऐप आपके और पूरे गाँव के लिए बनाई गई है, जिससे आप हर जरूरी खबर और सेवा से जुड़े रह सकें।
          </div>
          <button class="welcome-btn" onclick="app.closeWelcomeModal()">शुरू करें</button>
        </div>
      </div>
    `;
  }

  closeWelcomeModal() {
    localStorage.setItem('hasSeenWelcomeMeraGaov', 'true');
    const container = document.getElementById('welcomeModalContainer');
    if (container) container.innerHTML = '';
  }

  loadCustomVillagesFromStorage() {
    try {
      let savedVillages = JSON.parse(localStorage.getItem('customDistrictVillages'));
      if (savedVillages) {
        for (let dKey in savedVillages) {
          if (HARYANA_DISTRICTS_AND_VILLAGES[dKey]) {
            savedVillages[dKey].forEach(newV => {
              let exists = HARYANA_DISTRICTS_AND_VILLAGES[dKey].villages.some(v => v.hi === newV.hi);
              if (!exists) {
                HARYANA_DISTRICTS_AND_VILLAGES[dKey].villages.push(newV);
              }
            });
          }
        }
      }
    } catch(e) { console.error(e); }
  }

  addNewVillageToDistrict() {
    const inputEl = document.getElementById('newVillageNameInput');
    const villageName = inputEl ? inputEl.value.trim() : '';

    if (!villageName) {
      alert("कृपया नए गाँव का नाम दर्ज करें!");
      return;
    }

    const currentDist = this.state.selectedDistrict;
    if (!HARYANA_DISTRICTS_AND_VILLAGES[currentDist]) return;

    const exists = HARYANA_DISTRICTS_AND_VILLAGES[currentDist].villages.some(v => v.hi === villageName || v.en === villageName);
    if (exists) {
      alert(`यह गाँव '${villageName}' पहले से ही मौजूद है!`);
      return;
    }

    const newVillageObj = { hi: villageName, en: villageName };
    HARYANA_DISTRICTS_AND_VILLAGES[currentDist].villages.push(newVillageObj);

    let savedVillages = JSON.parse(localStorage.getItem('customDistrictVillages')) || {};
    if (!savedVillages[currentDist]) savedVillages[currentDist] = [];
    savedVillages[currentDist].push(newVillageObj);
    localStorage.setItem('customDistrictVillages', JSON.stringify(savedVillages));

    this.state.searchVillage = villageName;
    if(inputEl) inputEl.value = '';
    alert(`सफलतापूर्वक '${villageName}' जोड़ दिया गया है!`);
    this.render();
  }

  initListeners() {
    const menuToggle = document.getElementById('menuToggleBtn');
    if(menuToggle) {
      menuToggle.onclick = (e) => {
        e.stopPropagation();
        const menu = document.getElementById('dropdownMenu');
        menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
      };
    }
    window.onclick = () => { 
      const menu = document.getElementById('dropdownMenu');
      if(menu) menu.style.display = 'none'; 
    };
    
    const langBtn = document.getElementById('langToggleBtn');
    if(langBtn) {
      langBtn.onclick = () => {
        this.state.lang = this.state.lang === 'hi' ? 'en' : 'hi';
        langBtn.innerText = this.state.lang === 'hi' ? '🌐 English' : '🌐 हिंदी';
        this.render();
      };
    }
  }

  initFirebaseData() {
    setTimeout(() => {
      if (window.firebaseDb) {
        const { db, ref, onValue } = window.firebaseDb;
        onValue(ref(db, 'services'), snap => {
          const val = snap.val();
          this.state.services = val ? Object.keys(val).map(k => ({id: k, ...val[k]})).reverse() : [];
          this.updateTicker();
          if(this.state.view === 'list' || this.state.view === 'admin') this.render();
        });
        onValue(ref(db, 'announcements'), snap => {
          const val = snap.val();
          this.state.announcements = val ? Object.keys(val).map(k => ({id: k, ...val[k]})).reverse() : [];
          if(this.state.view === 'announcements' || this.state.view === 'admin') this.render();
        });
        onValue(ref(db, 'market'), snap => {
          const val = snap.val();
          this.state.market = val ? Object.keys(val).map(k => ({id: k, ...val[k]})).reverse() : [];
          if(this.state.view === 'market' || this.state.view === 'admin') this.render();
        });
        onValue(ref(db, 'greetings'), snap => {
          const val = snap.val();
          this.state.greetings = val ? Object.keys(val).map(k => ({id: k, ...val[k]})).reverse() : [];
          if(this.state.view === 'greetings' || this.state.view === 'admin') this.render();
        });
        onValue(ref(db, 'historyGallery'), snap => {
          const val = snap.val();
          this.state.historyGallery = val ? Object.keys(val).map(k => ({id: k, ...val[k]})).reverse() : [];
          if(this.state.view === 'historyGallery' || this.state.view === 'admin') this.render();
        });
        onValue(ref(db, 'chaupalMessages'), snap => {
          const val = snap.val();
          const newMsgs = val ? Object.keys(val).map(k => ({id: k, ...val[k]})).reverse() : [];
          if (this.state.view !== 'chaupal' && newMsgs.length > this.state.chaupalMessages.length && this.state.chaupalMessages.length > 0) {
            this.unreadMessageCount += (newMsgs.length - this.state.chaupalMessages.length);
          }
          this.state.chaupalMessages = newMsgs;
          if(this.state.view === 'chaupal' || this.state.view === 'home') this.render();
        });
        onValue(ref(db, 'allowedChatUsers'), snap => {
          const val = snap.val();
          this.state.allowedChatUsers = val || {};
          if(this.state.view === 'chaupal' || this.state.view === 'admin') this.render();
        });
        onValue(ref(db, 'subAdmins'), snap => {
          const val = snap.val();
          this.state.subAdmins = val ? Object.keys(val).map(k => ({id: k, pwd: val[k]})) : [];
        });
      }
    }, 1000);
  }

  updateTicker() {
    const tickerEl = document.getElementById('dynamicTickerText');
    if(!tickerEl) return;
    let approvedShops = this.state.services.filter(s => s.status === 'approved' && s.districtId === this.state.selectedDistrict && s.villageHi === this.state.searchVillage);
    let baseText = "🌾 सरसों: ₹5,400/क्विंटल | 🌾 गेहूँ: ₹2,425/क्विंटल | 🌤️ मौसम: सामान्य";
    if(approvedShops.length > 0) {
      let shopTickerItems = approvedShops.map(s => `${s.name} (${s.category || 'Service'}) - ${s.phone}`).join(' | ');
      tickerEl.innerHTML = `${shopTickerItems} | ${baseText}`;
    } else {
      tickerEl.innerHTML = baseText;
    }
  }

  changeUserAvatar(input) {
    const file = input.files[0];
    if(file) {
      const reader = new FileReader();
      reader.onloadend = () => {
        this.state.userAvatarUrl = reader.result;
        localStorage.setItem('userCustomAvatar', reader.result);

  // 👇 एडमिन द्वारा पहले से जोड़े गए या चुने गए टेंपलेट/बने-बनाए बैनर के लिए लॉजिक
  generateGreetingBannerCanvas() {
    const name = document.getElementById('gName')?.value.trim();
    const phone = document.getElementById('gPhone')?.value.trim();
    const msg = document.getElementById('gMsg')?.value.trim();
    const templateSelect = document.getElementById('gTemplateSelect')?.value;

    if(!name || !msg) {
      alert("कृपया अपना नाम और बधाई संदेश जरूर भरें!");
      return;
    }

    const canvas = document.createElement('canvas');
    canvas.width = 800;
    canvas.height = 800;
    const ctx = canvas.getContext('2d');

    // यदि एडमिन ने कोई प्री-डिजाइन टेंपलेट चुना है
    if (templateSelect && templateSelect !== 'default') {
      let templateImg = new Image();
      templateImg.crossOrigin = "anonymous";
      templateImg.onload = () => {
        ctx.drawImage(templateImg, 0, 0, 800, 800);
        this.drawTextAndUserPhotoOnCanvas(ctx, name, phone, msg, canvas);
      };
      templateImg.onerror = () => {
        // अगर इमेज लोड न हो तो डिफ़ॉल्ट बैकग्राउंड बना लें
        this.drawDefaultBannerBackground(ctx, name, phone, msg, canvas);
      };
      templateImg.src = templateSelect;
    } else {
      this.drawDefaultBannerBackground(ctx, name, phone, msg, canvas);
    }
  }

  drawDefaultBannerBackground(ctx, name, phone, msg, canvas) {
    let bgGrad = ctx.createLinearGradient(0, 0, 800, 800);
    bgGrad.addColorStop(0, '#064e3b');
    bgGrad.addColorStop(0.5, '#047857');
    bgGrad.addColorStop(1, '#022c22');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, 800, 800);

    ctx.strokeStyle = '#fbbf24';
    ctx.lineWidth = 12;
    ctx.strokeRect(20, 20, 760, 760);

    ctx.fillStyle = '#fbbf24';
    ctx.font = 'bold 36px "Hind", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(`🌾 MeraGaov - ${this.state.searchVillage} 🌾`, 400, 80);

    ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
    ctx.fillRect(60, 115, 680, 210);
    ctx.strokeStyle = '#10b981';
    ctx.lineWidth = 2;
    ctx.strokeRect(60, 115, 680, 210);

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 30px "Hind", sans-serif';
    this.wrapText(ctx, msg, 400, 170, 620, 40);

    this.drawUserPhotoAndTextOverlay(ctx, name, phone, canvas);
  }

  drawTextAndUserPhotoOnCanvas(ctx, name, phone, msg, canvas) {
    // यदि टेंपलेट यूज़ हो रहा है तो ऊपर टेक्स्ट और नीचे फोटो/नाम सेट करें
    ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
    ctx.fillRect(50, 50, 700, 120);

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 28px "Hind", sans-serif';
    ctx.textAlign = 'center';
    this.wrapText(ctx, msg, 400, 95, 660, 35);

    this.drawUserPhotoAndTextOverlay(ctx, name, phone, canvas);
  }

  drawUserPhotoAndTextOverlay(ctx, name, phone, canvas) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(400, 470, 115, 0, Math.PI * 2, true);
    ctx.closePath();
    ctx.clip();
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(285, 355, 230, 230);

    if (this.bannerUserPhotoObj) {
      ctx.drawImage(this.bannerUserPhotoObj, 285, 355, 230, 230);
    } else {
      ctx.fillStyle = '#064e3b';
      ctx.font = 'bold 70px "Hind", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText("👤", 400, 495);
    }
    ctx.restore();

    ctx.beginPath();
    ctx.arc(400, 470, 115, 0, Math.PI * 2, true);
    ctx.lineWidth = 6;
    ctx.strokeStyle = '#fbbf24';
    ctx.stroke();

    ctx.fillStyle = '#fbbf24';
    ctx.font = 'bold 36px "Hind", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(name, 400, 635);

    if(phone) {
      ctx.fillStyle = '#a7f3d0';
      ctx.font = '26px "Hind", sans-serif';
      ctx.fillText(`संपर्क: ${phone}`, 400, 680);
    }

    ctx.fillStyle = '#ffffff';
    ctx.font = '18px "Hind", sans-serif';
    ctx.fillText("डिजिटल गाँव ऐप द्वारा स्वतः निर्मित बैनर", 400, 740);

    this.generatedBannerDataUrl = canvas.toDataURL('image/png');
    
    const previewBox = document.getElementById('bannerPreviewBox');
    if(previewBox) {
      previewBox.innerHTML = `
        <div style="margin-top:12px; text-align:center; background:#ffffff; padding:12px; border-radius:12px; border:2px solid #059669;">
          <b style="color:#047857; font-size:13px;">✨ आपका बैनर लाइव तैयार है! नीचे से डाउनलोड करें या एडमिन को भेजें:</b><br>
          <img src="${this.generatedBannerDataUrl}" style="width:100%; max-width:300px; border-radius:12px; border:2px solid #059669; margin-top:8px;" /><br>
          <a href="${this.generatedBannerDataUrl}" download="MeraGaov_Banner.png" style="display:inline-block; background:#2563eb; color:white; padding:8px 16px; border-radius:8px; text-decoration:none; font-weight:bold; font-size:13px; margin-top:8px;">📥 बैनर डाउनलोड करें</a>
        </div>
      `;
    }
    alert("🎉 बधाई बैनर सफलतापूर्वक बन गया है!");
  }

  wrapText(context, text, x, y, maxWidth, lineHeight) {
    let words = text.split(' ');
    let line = '';
    for(let n = 0; n < words.length; n++) {
      let testLine = line + words[n] + ' ';
      let metrics = context.measureText(testLine);
      let testWidth = metrics.width;
      if (testWidth > maxWidth && n > 0) {
        context.fillText(line, x, y);
        line = words[n] + ' ';
        y += lineHeight;
      } else {
        line = testLine;
      }
    }
    context.fillText(line, x, y);
  }

        <div class="service-item">
          <div class="service-name">${a.title}</div>
          <p style="font-size: 11px; color: #047857; margin-bottom: 6px;"><b>जारीकर्ता:</b> ${a.name} | <b>फोन:</b> ${a.phone}</p>
          ${a.imageUrl ? `<img src="${a.imageUrl}" class="service-img"/>` : ''}
          ${(this.state.isAdminLoggedIn || this.state.isSubAdminLoggedIn)?`<button class="delete-btn" onclick="app.deleteItem('announcements', '${a.id}')">🗑️ Delete</button>`:''}
        </div>
      `).join('');
      html = `
        <button class="back-btn" onclick="app.changeView('home')">← होम</button>
        <div class="card">
          <div class="card-title">📢 मुनादी व जरूरी खबरें (${displayVillageName})</div>
          <div class="live-upload-box">
            <input class="form-control" id="annName" placeholder="आपका नाम..." style="margin-bottom:8px;" />
            <input class="form-control" id="annPhone" placeholder="मोबाइल नंबर..." style="margin-bottom:8px;" />
            <textarea class="form-control" id="annTitle" placeholder="मुनादी का विवरण..." style="margin-bottom:8px; height:60px;"></textarea>
            <input type="file" accept="image/*" class="form-control" onchange="app.handleImage(this)" style="margin-bottom:8px;" />
            <button class="btn-submit" onclick="app.submitAnnouncement()">📤 मुनादी भेजें</button>
          </div>
          ${items || `<div class="empty-state">कोई मुनादी उपलब्ध नहीं है।</div>`}
        </div>
      `;
    }
    else if (this.state.view === 'greetings') {
      let items = this.state.greetings.filter(g => g.status === 'approved' && g.districtId === this.state.selectedDistrict && g.villageHi === this.state.searchVillage).map(g => `
        <div class="service-item" style="border-left: 4px solid #db2777;">
          <div class="service-name">${g.message}</div>
          <p style="font-size: 11px; color: #047857; margin-bottom: 6px;"><b>बधाईकर्ता:</b> ${g.name} | <b>फोन:</b> ${g.phone}</p>
          ${g.imageUrl ? `<img src="${g.imageUrl}" class="service-img"/>` : ''}
          ${(this.state.isAdminLoggedIn || this.state.isSubAdminLoggedIn)?`<button class="delete-btn" onclick="app.deleteItem('greetings', '${g.id}')">🗑️ Delete</button>`:''}
        </div>
      `).join('');
      
      html = `
        <button class="back-btn" onclick="app.changeView('home')">← होम</button>
        <div class="card">
          <div class="card-title">🎉 त्यौहार व बधाई संदेश (बने-बनाए बैनर व मेकर)</div>
          <div class="live-upload-box">
            <p style="font-size:12px; color:#064e3b; font-weight:bold; margin-bottom:10px;">✨ बने-बनाए बैनर फ्रेम चुनें या अपनी फोटो लगाकर नया बनाएं!</p>
            
            <div class="form-group" style="text-align:left;">
              <label>🖼️ बने-बनाए बैनर फ्रेम (Template) चुनें:</label>
              <select class="form-control" id="gTemplateSelect" style="margin-bottom:8px;">
                <option value="default">-- डिफ़ॉल्ट ग्रीन थीम फ्रेम --</option>
                <option value="https://images.unsplash.com/photo-1513151233558-d860c5398176?w=800">त्यौहार / दीपावली स्पेशल फ्रेम</option>
                <option value="https://images.unsplash.com/photo-1529156069898-49953e39b3ac?w=800">शुभकामना / उत्सव फ्रेम</option>
              </select>
            </div>

            <input class="form-control" id="gName" placeholder="आपका पूरा नाम..." style="margin-bottom:8px;" />
            <input class="form-control" id="gPhone" placeholder="मोबाइल नंबर..." style="margin-bottom:8px;" />
            <textarea class="form-control" id="gMsg" placeholder="बधाई संदेश (जैसे: आप सभी को होली/दीपावली की हार्दिक शुभकामनाएं)..." style="margin-bottom:8px; height:60px;"></textarea>
            
            <div class="form-group" style="text-align:left;">
              <label>📷 अपनी फोटो चुनें (फ्रेम पर लगाने के लिए):</label>
              <input type="file" accept="image/*" class="form-control" onchange="app.handleBannerUserPhoto(this)" style="margin-bottom:8px;" />
            </div>

            <button class="btn-submit" style="background:#2563eb;" onclick="app.generateGreetingBannerCanvas()">🎨 सुंदर बैनर बनाएं</button>
            
            <div id="bannerPreviewBox"></div>

            <button class="btn-submit" style="margin-top:14px;" onclick="app.submitGreeting()">📤 बैनर एडमिन को भेजें (Live)</button>
          </div>
          ${items || `<div class="empty-state">कोई बधाई संदेश/बैनर उपलब्ध नहीं है।</div>`}
        </div>
      `;
    }
    else if (this.state.view === 'market') {
      let items = this.state.market.filter(m => m.status === 'approved' && m.districtId === this.state.selectedDistrict && m.villageHi === this.state.searchVillage).map(m => `
        <div class="service-item" style="border-left: 4px solid #2563eb;">
          <span class="service-tag">${m.itemType || 'खरीद-बिक्री'}</span>
          <div class="service-name">${m.title}</div>
          <p style="font-size: 11px; color: #047857; margin-bottom: 6px;"><b>विक्रेता:</b> ${m.name} | <b>फोन:</b> ${m.phone}</p>
          ${m.imageUrl ? `<img src="${m.imageUrl}" class="service-img"/>` : ''}
          <a href="tel:${m.phone}" class="btn-call">📞 संपर्क करें: ${m.phone}</a>
          ${(this.state.isAdminLoggedIn || this.state.isSubAdminLoggedIn)?`<button class="delete-btn" onclick="app.deleteItem('market', '${m.id}')">🗑️ Delete</button>`:''}
        </div>
      `).join('');
      html = `
        <button class="back-btn" onclick="app.changeView('home')">← होम</button>
        <div class="card">
          <div class="card-title">🚜 खरीद-बिक्री बाज़ार (${displayVillageName})</div>
          <div class="live-upload-box">
            <input class="form-control" id="mName" placeholder="आपका नाम..." style="margin-bottom:8px;" />
            <input class="form-control" id="mPhone" placeholder="मोबाइल नंबर..." style="margin-bottom:8px;" />
            <div class="form-group">
              <label>📂 श्रेणी चुनें:</label>
              <select class="form-control" id="mItemType" style="margin-bottom:8px;">
                <option value="भैंस / गाय">भैंस / गाय</option>
                <option value="ट्रैक्टर">ट्रैक्टर</option>
                <option value="बाइक">बाइक</option>
                <option value="अन्य">अन्य</option>
              </select>
            </div>
            <textarea class="form-control" id="mTitle" placeholder="विवरण लिखें..." style="margin-bottom:8px; height:60px;"></textarea>
            <input type="file" accept="image/*" class="form-control" onchange="app.handleImage(this)" style="margin-bottom:8px;" />
            <button class="btn-submit" onclick="app.submitMarket()">📤 पोस्ट भेजें</button>
          </div>
          ${items || `<div class="empty-state">कोई पोस्ट उपलब्ध नहीं है।</div>`}
        </div>
      `;
    }
    else if (this.state.view === 'historyGallery') {
      let items = this.state.historyGallery.filter(hg => hg.status === 'approved' && hg.districtId === this.state.selectedDistrict && hg.villageHi === this.state.searchVillage).map(hg => `
        <div class="service-item" style="border-left: 4px solid #0891b2;">
          <span class="service-tag">${hg.category}</span>
          <div class="service-name">${hg.title}</div>
          <p style="font-size: 11px; color: #047857; margin-bottom: 6px;"><b>प्रस्तुतकर्ता:</b> ${hg.name}</p>
          ${hg.mediaType === 'video' ? `<video src="${hg.mediaUrl}" controls class="service-video"></video>` : `<img src="${hg.mediaUrl}" class="service-img"/>`}
          ${(this.state.isAdminLoggedIn || this.state.isSubAdminLoggedIn)?`<button class="delete-btn" onclick="app.deleteItem('historyGallery', '${hg.id}')">🗑️ Delete</button>`:''}
        </div>
      `).join('');
      
      html = `
        <button class="back-btn" onclick="app.changeView('home')">← होम</button>
        <div class="card">
          <div class="card-title">🏛️ गाँव का इतिहास और गैलरी (${displayVillageName})</div>
          <div class="live-upload-box">
            <input class="form-control" id="hgName" placeholder="आपका नाम..." style="margin-bottom:8px;" />
            <div class="form-group">
              <label>📂 सेक्शन चुनें:</label>
              <select class="form-control" id="hgCategory" style="margin-bottom:8px;">
                <option value="गाँव का इतिहास">गाँव का इतिहास</option>
                <option value="गाँव की गैलरी">गाँव की गैलरी (फोटो/वीडियो)</option>
              </select>
            </div>
            <textarea class="form-control" id="hgTitle" placeholder="विवरण..." style="margin-bottom:8px; height:60px;"></textarea>
            <div class="form-group">
              <label>📷 फोटो या वीडियो चुनें:</label>
              <input type="file" accept="image/*,video/*" class="form-control" onchange="app.handleHistoryGalleryMedia(this)" style="margin-bottom:8px;" />
            </div>
            <button class="btn-submit" onclick="app.submitHistoryGallery()">📤 पोस्ट अपलोड करें</button>
          </div>
          ${items || `<div class="empty-state">कोई मीडिया उपलब्ध नहीं है।</div>`}
        </div>
      `;
    }
    else if (this.state.view === 'chaupal') {
      let isUserVerified = (this.state.isAdminLoggedIn || this.state.isSubAdminLoggedIn) || (this.state.currentUserPhone && this.state.allowedChatUsers[this.state.currentUserPhone]);

      let chaupalList = '';
      if(isUserVerified) {
        chaupalList = this.state.chaupalMessages
          .filter(c => c.districtId === this.state.selectedDistrict && c.villageHi === this.state.searchVillage)
          .map(c => `
            <div style="background: white; border: 1px solid #e2e8f0; border-radius: 10px; padding: 10px; margin-bottom: 8px;">
              <div style="font-size: 12px; font-weight: bold; color: #047857;">${c.name}</div>
              <div style="font-size: 13px; color: #0f172a; margin-top: 3px;">${c.message}</div>
              ${(this.state.isAdminLoggedIn || this.state.isSubAdminLoggedIn) ? `<button class="delete-btn" onclick="app.deleteItem('chaupalMessages', '${c.id}')">🗑️ डिलीट संदेश</button>` : ''}
            </div>
          `).join('');
      }

      let chatContentArea = '';
      if(!isUserVerified) {
        chatContentArea = `
          <div style="background: #fef2f2; border: 1px solid #f87171; border-radius: 12px; padding: 16px; text-align: center;">
            <p style="color: #991b1b; font-size: 13px; font-weight: bold; margin-bottom: 10px;">
              🔒 यह Admin Chat Room सुरक्षित है। कृपया अपना रजिस्टर्ड मोबाइल नंबर और पासवर्ड दर्ज करें।
            </p>
            <input class="form-control" id="verifyPhoneInput" placeholder="मोबाइल नंबर..." style="margin-bottom:8px;" />
            <input type="password" class="form-control" id="verifyPassInput" placeholder="पासवर्ड..." style="margin-bottom:8px;" />
            <button class="btn-submit" style="background: #dc2626;" onclick="app.verifyUserForChat()">🔐 चैट में प्रवेश करें</button>
          </div>
        `;
      } else {
        chatContentArea = `
          <div style="background: #f0fdf4; border: 1px solid #10b981; border-radius: 12px; padding: 12px; margin-bottom: 12px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
              <div style="font-size: 12px; font-weight: bold; color: #064e3b;">✍️ संदेश भेजें:</div>
              <button style="background:#dc2626; color:white; border:none; padding:3px 8px; border-radius:6px; font-size:10px; cursor:pointer;" onclick="app.state.currentUserPhone=''; localStorage.removeItem('currentUserPhone'); app.render();">लॉग आउट</button>
            </div>
            <input class="form-control" id="cName" placeholder="आपका नाम..." style="margin-bottom:8px;" />
            <textarea class="form-control" id="cText" placeholder="अपना संदेश यहाँ लिखें..." style="margin-bottom:8px; height:60px;"></textarea>
            <button class="btn-submit" onclick="app.submitChaupalMsg()">💬 संदेश भेजें</button>
          </div>
          <div style="margin-top: 10px;">
            ${chaupalList || `<div class="empty-state">चैट रूम में अभी कोई संदेश नहीं है।</div>`}
          </div>
        `;
      }

      let adminMemberAddSection = (this.state.isAdminLoggedIn || this.state.isSubAdminLoggedIn) ? `
        <div style="background: #eff6ff; border: 1px solid #2563eb; border-radius: 12px; padding: 12px; margin-bottom: 15px;">
          <div style="font-size: 12px; font-weight: bold; color: #1e40af; margin-bottom: 6px;">⚙️ नया सदस्य और पासवर्ड जोड़ें</div>
          <input class="form-control" id="newMemberPhone" placeholder="मोबाइल नंबर..." style="margin-bottom:8px;" />
          <input class="form-control" id="newMemberPass" placeholder="पासवर्ड..." style="margin-bottom:8px;" />
          <button style="background: #2563eb; color: white; border: none; width:100%; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer;" onclick="app.addAllowedMemberWithPassword()">सेव करें</button>
        </div>
      ` : '';

      html = `
        <button class="back-btn" onclick="app.changeView('home')">← होम</button>
        <div class="card">
          <div class="card-title">💬 Admin Chat Room</div>
          ${adminMemberAddSection}
          ${chatContentArea}
        </div>
      `;
    }
    else if (this.state.view === 'policy') {
      html = `<button class="back-btn" onclick="app.changeView('home')">← होम</button><div class="card"><div class="card-title">📜 Privacy Policy</div><p style="font-size:13px; color:#334155;">डेटा सुरक्षा सुरक्षित है।</p></div>`;
    }
    else if (this.state.view === 'about') {
      html = `<button class="back-btn" onclick="app.changeView('home')">← होम</button><div class="card"><div class="card-title">ℹ️ About Us</div><p style="font-size:13px; color:#334155;">संचालक: Kusum w/o Rajesh Yadav</p></div>`;
    }
    else if (this.state.view === 'admin') {
      if(!this.state.isAdminLoggedIn && !this.state.isSubAdminLoggedIn) return this.changeView('home');

      let renderPend = (arr, path, labelName) => arr.filter(x => x.status === 'pending' && x.districtId === this.state.selectedDistrict && x.villageHi === this.state.searchVillage).map(x => `
        <div class="media-card" style="border: 2px solid #2563eb;">
          <span class="service-tag">${labelName}</span>
          <div class="service-name">${x.title || x.message || x.name || ''}</div>
          ${x.name ? `<p style="font-size:11px; color:#555;">द्वारा: ${x.name} | फोन: ${x.phone || 'N/A'}</p>` : ''}
          ${x.imageUrl ? `<img src="${x.imageUrl}" class="service-img"/>` : ''}
          <button class="approve-btn" onclick="app.approveItem('${path}', '${x.id}')">✅ Approve</button>
          <button class="delete-btn" onclick="app.deleteItem('${path}', '${x.id}')">❌ Reject</button>
        </div>
      `).join('');

      let pServ = renderPend(this.state.services, 'services', 'Shop');
      let pAnn = renderPend(this.state.announcements, 'announcements', 'Announcement');
      let pGreet = renderPend(this.state.greetings, 'greetings', 'Greeting/Banner');
      let pMkt = renderPend(this.state.market, 'market', 'Market');
      let pHg = renderPend(this.state.historyGallery, 'historyGallery', 'History');

      html = `
        <button class="back-btn" onclick="app.changeView('home')">← होम</button>
        <div class="card"><div class="card-title">📥 Admin Approval Panel</div></div>
        ${pServ || ''} ${pAnn || ''} ${pGreet || ''} ${pMkt || ''} ${pHg || ''}
        ${(!pServ && !pAnn && !pGreet && !pMkt && !pHg) ? '<div class="empty-state">कोई पेंडिंग अनुरोध नहीं है।</div>' : ''}
      `;
    }

    content.innerHTML = html;
  }
}

const app = new VillageApp();
</script>
</body>
</html>
