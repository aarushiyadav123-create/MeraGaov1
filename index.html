userDistrict:

villageLocked:
 localStorage.getItem("villageLocked")==="true",

villageUnlockRequested:
 localStorage.getItem("villageUnlockRequested")==="true",

services:[],
announcements:[],
greetings:[],
market:[],
historyGallery:[],
chaupalMessages:[],

allowedChatUsers:{},
subAdmins:[],
villagesConfig:{},
villageUnlockRequests:{},

 localStorage.getItem("userCustomAvatar")||avatarDefault,

loggedInSubAdminVillage:"",

loggedInSubAdminName:"",
loggedInSubAdminPhone:"",

/* =========================
   BASIC HELPERS
========================= */

esc(v){

return String(v??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


status(t){

let e=document.getElementById("firebaseStatus");

if(!e)return;

e.textContent=t;
e.style.display="block";

clearTimeout(this.st);

this.st=setTimeout(()=>{
 e.style.display="none";
},3500);

}


/*
 Normal user का active district
 या Admin का selected district
 */

getActiveDistrict(){

if(this.state.isAdminLoggedIn &&
 this.state.adminActiveDistrict){

 return this.state.adminActiveDistrict;

}

if(this.state.isSubAdminLoggedIn &&
 this.state.loggedInSubAdminDistrict){

 return this.state.loggedInSubAdminDistrict;

}

return this.state.selectedDistrict;

}


/*
 Normal user / admin active village
 */

getActiveVillage(){

if(this.state.isAdminLoggedIn &&
 this.state.adminActiveVillage){

 return this.state.adminActiveVillage;

}

if(this.state.isSubAdminLoggedIn &&
 this.state.loggedInSubAdminVillage){

 return this.state.loggedInSubAdminVillage;

}

return this.state.searchVillage;

}


/*
 Village object
 */

getVillageObject(districtId,villageName){

let d=D[districtId];

if(!d)return null;

return d.villages.find(v=>
 v[0]===villageName ||
 v[1]===villageName
)||null;

}


/*
 Current village
 */

villageObj(){

return this.getVillageObject(
 this.getActiveDistrict(),
 this.getActiveVillage()
);

}


/*
 Admin/Subadmin permission
 */

isAdminForVillage(v){

if(this.state.isAdminLoggedIn)return true;

if(this.state.isSubAdminLoggedIn){

return this.state.loggedInSubAdminVillage===v &&
 this.state.loggedInSubAdminDistrict===this.getActiveDistrict();

}

return false;

}

/* =========================
   CUSTOM VILLAGES
========================= */

loadCustomVillages(){

try{

let x=JSON.parse(
 localStorage.getItem("customDistrictVillages")||"{}"
);

Object.keys(x).forEach(k=>{

if(!D[k])return;

x[k].forEach(v=>{

if(!D[k].villages.some(a=>
 a[0]===v[0] ||
 a[1]===v[1]
)){

D[k].villages.push(v);

}

});

});

}catch(e){

console.error(e);

}

}


/*
 Firebase से नए गाँव merge
 */

mergeFirebaseVillages(data){

if(!data)return;

Object.keys(data).forEach(districtId=>{

let districtData=data[districtId];

if(!districtData)return;

/*
 अगर Firebase में नया district हो
 तो भी app उसे समझ सके
 */

if(!D[districtId]){

D[districtId]={
 nameHi:districtData.nameHi||districtId,
 nameEn:districtData.nameEn||districtId,
 villages:[]
};

}


/*
 villages object या array दोनों handle
 */

let villages=districtData.villages||{};

if(Array.isArray(villages)){

villages.forEach(v=>{

let pair=Array.isArray(v)
 ? v
 : [v.nameHi||v.name||"",v.nameEn||v.name||""];

if(!pair[0])return;

if(!D[districtId].villages.some(a=>
 a[0]===pair[0] ||
 a[1]===pair[1]
)){

D[districtId].villages.push(pair);

}

});

}else{

Object.keys(villages).forEach(id=>{

let v=villages[id];

let pair=[
 v.nameHi||v.name||id,
 v.nameEn||v.name||id
];

if(!D[districtId].villages.some(a=>
 a[0]===pair[0] ||
 a[1]===pair[1]
)){

D[districtId].villages.push(pair);

}

});

}

});

}

/* =========================

========================= */

setupFirebase(){

if(this.firebaseStarted||
 !window.firebaseDb)return;

this.firebaseStarted=true;

const{
 db,ref,onValue
}=window.firebaseDb;


const listen=(path,fn)=>{

try{

onValue(
 ref(db,path),
 s=>fn(s.val()),
 e=>{
  console.error(path,e);
  this.status("⚠️ Firebase data error");
 }
);

}catch(e){

console.error(e);

}

};


const load=(key,val)=>{

this.state[key]=val
 ?Object.keys(val)
  .map(k=>({
   id:k,
   ...val[k]
  }))
  .reverse()
 :[];

this.render();
this.updateTicker();

};


/* Services */

listen(
"services",
v=>load("services",v)
);


/* Announcements */

listen(
"announcements",
v=>load("announcements",v)
);


/* Market */

listen(
"market",
v=>load("market",v)
);

/* =========================
   LIVE TICKER
========================= */

updateTicker(){

let e=
document.getElementById(
"dynamicTickerText"
);

if(!e)return;


/*
 All Village में village-specific
 ticker नहीं दिखाना
 */

if(this.state.allVillageMode){

e.textContent=
"🌐 ALL VILLAGE MODE | 🏪 सभी गाँवों की दुकानें और सेवाएँ | 🚜 सभी गाँवों का खरीद-बिक्री बाज़ार";

return;

}


let district=this.getActiveDistrict();
let village=this.getActiveVillage();

if(!district||!village){

e.textContent=
"🌾 सरसों: ₹5,400/क्विंटल | 🌾 गेहूँ: ₹2,425/क्विंटल | 🌤️ मौसम: सामान्य";

return;

}


/*
 केवल CURRENT village
 */

let allowedTickerItems=[
 ...this.state.announcements.filter(x=>
  x.status==="approved" &&
  x.showOnTicker===true &&
  x.districtId===district &&
  x.villageHi===village
 ),
 ...this.state.greetings.filter(x=>
  x.status==="approved" &&
  x.districtId===district &&
  x.villageHi===village
 )
];


let itemsText=
allowedTickerItems
.map(x=>{

let titleText=
 x.title||
 x.message||
 x.name||
 "";

return titleText
 ?`📍 ${village}: ${titleText}`
 :"";

})
.filter(Boolean)
.join(" | ");


let base=
"🌾 सरसों: ₹5,400/क्विंटल | 🌾 गेहूँ: ₹2,425/क्विंटल | 🌤️ मौसम: सामान्य";


e.textContent=
itemsText
 ?`${itemsText} | ${base}`
 :`📍 ${village} | ${base}`;

}

 Local backup
 */

JSON.parse(
localStorage.getItem(
"customDistrictVillages"
)||"{}"
);

 db,ref,push
}=window.firebaseDb;

 villages_config/district/villages

ref(db,`villages_config/${d}/villages`),
{
 nameHi:v,

 createdAt:Date.now(),

)

"newVillageEnglishInput"
).value="";

})
.catch(e=>{

);

});

}

/* =========================
   TEXT WRAP
========================= */

wrapText(
ctx,text,x,y,max,lineH
){

let words=String(text).split(/\s+/);
let line="";

for(let w of words){

let t=
line
?line+" "+w
:w;

if(
ctx.measureText(t).width>max &&
line
){

ctx.fillText(line,x,y);

line=w;
y+=lineH;

}else{

line=t;

}

}

if(line)
ctx.fillText(line,x,y);

}

x.createLinearGradient(
0,0,800,800
);

g.addColorStop(0,"#064e3b");
g.addColorStop(.5,"#047857");
g.addColorStop(1,"#022c22");

);

400,740
);
