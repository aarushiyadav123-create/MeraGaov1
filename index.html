    ]

    villages:[

    ]

  "hisar": {

    nameEn:"Hisar",
    villages:[
      {hi:"हिसार शहर",en:"Hisar City"},
      {hi:"बरवाला",en:"Barwala"},
      {hi:"नारनौंद",en:"Narnaund"},

  "panipat": {

    villages:[

      {hi:"समालखा",en:"Samalkha"},
      {hi:"सनौली",en:"Sanauli"},
      {hi:"इन्द्रगढ़",en:"Indragarh"}

/* =========================================================
   APP
   ========================================================= */

class VillageApp {

  constructor(){

    this.loadCustomVillagesFromStorage();

    this.state = {

      lang:"hi",

      view:"home",

      selectedDistrict:
        localStorage.getItem("selectedDistrict")
        || "charkhi-dadri",

      searchVillage:
        localStorage.getItem("searchVillage")
        || "",

      lockedVillage:
        localStorage.getItem("my_locked_village")
        || "",

      services:[],
      gallery:[],
      market:[],
      announcements:[],
      greetings:[],
      chaupalMessages:[],
      historyGallery:[],
      allowedChatUsers:{},
      subAdmins:[],
      villagesConfig:{},
      resetRequests:[],

      userAvatarUrl:
        localStorage.getItem("userCustomAvatar")
        || "https://cdn-icons-png.flaticon.com/512/3135/3135715.png",

      isAdminLoggedIn:false,
      isSubAdminLoggedIn:false,
      loggedInSubAdminVillage:"",

      currentUserPhone:
        localStorage.getItem("currentUserPhone")
        || "",

      isDistrictBoxOpen:false
    };

    this.tempImage="";
    this.tempMedia="";
    this.tempMediaType="image";
    this.generatedBannerDataUrl="";
    this.bannerUserPhotoObj=null;
    this.unreadMessageCount=0;

    this.initListeners();
    this.initFirebaseData();
    this.render();
    this.handleStartupSplashAndWelcome();

  }


  /* =======================================================
     HELPERS
     ======================================================= */

  escapeHtml(value){

    if(value === null || value === undefined) return "";

    return String(value)
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;")
      .replace(/'/g,"&#039;");
  }


  showFirebaseStatus(message){

    const el=document.getElementById("firebaseStatus");

    if(!el) return;

    el.innerText=message;
    el.style.display="block";

    clearTimeout(this.firebaseStatusTimer);

    this.firebaseStatusTimer=setTimeout(()=>{
      el.style.display="none";
    },3500);

  }


  getCurrentVillageObject(){

    const district =
      HARYANA_DISTRICTS_AND_VILLAGES[this.state.selectedDistrict];

    if(!district) return null;

    return district.villages.find(
      v =>
        v.hi === this.state.searchVillage ||
        v.en === this.state.searchVillage
    ) || null;

  }


  isAdminForVillage(village){

    return (
      this.state.isAdminLoggedIn ||
      (
        this.state.isSubAdminLoggedIn &&
        this.state.loggedInSubAdminVillage === village
      )
    );

  }


  /* =======================================================
     SPLASH / WELCOME
     ======================================================= */

  handleStartupSplashAndWelcome(){

    setTimeout(()=>{

      const splash=document.getElementById("splashScreen");

      if(splash){

        splash.style.opacity="0";

        setTimeout(()=>{
          splash.remove();
        },500);

      }

    },1500);


    const hasSeenWelcome =
      localStorage.getItem("hasSeenWelcomeMeraGaov");

    if(!hasSeenWelcome){

      setTimeout(()=>{
        this.showWelcomeGreetingModal();
      },1600);

    }

  }


  showWelcomeGreetingModal(){

    const container=
      document.getElementById("welcomeModalContainer");

    if(!container) return;

    container.innerHTML=`

      <div class="welcome-overlay">

        <div class="welcome-modal">

          <div class="welcome-title">
            राम-राम भाईयों! 🙏
          </div>

          <div class="welcome-text">
            हरियाणा के हमारे इस डिजिटल गाँव
            (MeraGaov) में आपका स्वागत है।
            यह ऐप आपके और पूरे गाँव के लिए बनाई गई है,
            जिससे आप हर जरूरी खबर और सेवा से जुड़े रह सकें।
          </div>

          <button
            class="welcome-btn"
            onclick="app.closeWelcomeModal()"
          >
            शुरू करें
          </button>

        </div>

      </div>

    `;

  }


  closeWelcomeModal(){

    localStorage.setItem(
      "hasSeenWelcomeMeraGaov",
      "true"
    );

    const container=
      document.getElementById("welcomeModalContainer");

    if(container){
      container.innerHTML="";
    }

  }


  /* =======================================================
     LOCAL VILLAGES
     ======================================================= */

  loadCustomVillagesFromStorage(){

    try{

      const savedVillages=
        JSON.parse(
          localStorage.getItem("customDistrictVillages")
        );

      if(!savedVillages) return;

      for(const dKey in savedVillages){

        if(!HARYANA_DISTRICTS_AND_VILLAGES[dKey])
          continue;

        savedVillages[dKey].forEach(newV=>{

          const exists=
            HARYANA_DISTRICTS_AND_VILLAGES[dKey]
              .villages
              .some(v=>v.hi===newV.hi);

          if(!exists){
            HARYANA_DISTRICTS_AND_VILLAGES[dKey]
              .villages
              .push(newV);
          }

        });

      }

    }catch(error){

      console.error(
        "Custom village load error:",
        error
      );

    }

  }


  addNewVillageToDistrict(){

    const inputEl=
      document.getElementById(
        "newVillageNameInput"
      );

    const villageName=
      inputEl ? inputEl.value.trim() : "";

    if(!villageName){

      alert(
        "कृपया नए गाँव का नाम दर्ज करें!"
      );

      return;
    }

    const currentDist=
      this.state.selectedDistrict;

    if(!HARYANA_DISTRICTS_AND_VILLAGES[currentDist])
      return;

    const exists=
      HARYANA_DISTRICTS_AND_VILLAGES[currentDist]
        .villages
        .some(
          v =>
            v.hi===villageName ||
            v.en===villageName
        );

    if(exists){

      alert(
        `यह गाँव '${villageName}' पहले से ही मौजूद है!`
      );

      return;
    }

    const newVillageObj={
      hi:villageName,
      en:villageName
    };

    HARYANA_DISTRICTS_AND_VILLAGES[currentDist]
      .villages
      .push(newVillageObj);

    let savedVillages=
      JSON.parse(
        localStorage.getItem(
          "customDistrictVillages"
        )
      ) || {};

    if(!savedVillages[currentDist])
      savedVillages[currentDist]=[];

    savedVillages[currentDist].push(
      newVillageObj
    );

    localStorage.setItem(
      "customDistrictVillages",
      JSON.stringify(savedVillages)
    );

    this.state.searchVillage=villageName;

    if(inputEl)
      inputEl.value="";

    alert(
      `सफलतापूर्वक '${villageName}' जोड़ दिया गया है!`
    );

    this.render();

  }

  /* =======================================================

     ======================================================= */

  initFirebaseData(){

    if(window.firebaseDb){

      this.setupFirebaseListeners();
      return;

    }

    let attempts=0;

    const waitForFirebase=()=>{

      if(window.firebaseDb){

        this.setupFirebaseListeners();
        return;

      }

      attempts++;

      if(attempts>=30){

        this.showFirebaseStatus(
          "⚠️ Firebase उपलब्ध नहीं है"
        );

        return;

      }

      setTimeout(
        waitForFirebase,
        250
      );

    };

    waitForFirebase();

  }


  setupFirebaseListeners(){

    if(this.firebaseListenersStarted)
      return;

    if(!window.firebaseDb)
      return;

    this.firebaseListenersStarted=true;

    const {
      db,
      ref,
      onValue
    }=window.firebaseDb;


    const safeListener=(path,callback)=>{

      try{

        onValue(
          ref(db,path),
          callback,
          error=>{
            console.error(
              "Firebase read error:",
              path,
              error
            );

            this.showFirebaseStatus(
              "⚠️ Firebase data पढ़ने में समस्या"
            );
          }
        );

      }catch(error){

        console.error(
          "Listener error:",
          error
        );

      }

    };


    safeListener(
      "services",
      snap=>{

        const val=snap.val();

        this.state.services=
          val
            ? Object.keys(val)
                .map(k=>({
                  id:k,
                  ...val[k]
                }))
                .reverse()
            : [];

        this.updateTicker();

        if(
          this.state.view==="list" ||
          this.state.view==="admin"
        ){
          this.render();
        }

      }
    );


    safeListener(
      "announcements",
      snap=>{

        const val=snap.val();

        this.state.announcements=
          val
            ? Object.keys(val)
                .map(k=>({
                  id:k,
                  ...val[k]
                }))
                .reverse()
            : [];

        if(
          this.state.view==="announcements" ||
          this.state.view==="admin"
        ){
          this.render();
        }

      }
    );


    safeListener(
      "market",
      snap=>{

        const val=snap.val();

        this.state.market=
          val
            ? Object.keys(val)
                .map(k=>({
                  id:k,
                  ...val[k]
                }))
                .reverse()
            : [];

        if(
          this.state.view==="market" ||
          this.state.view==="admin"
        ){
          this.render();
        }

      }
    );


    safeListener(
      "greetings",
      snap=>{

        const val=snap.val();

        this.state.greetings=
          val
            ? Object.keys(val)
                .map(k=>({
                  id:k,
                  ...val[k]
                }))
                .reverse()
            : [];

        if(
          this.state.view==="greetings" ||

          this.render();
        }

      }
    );


    safeListener(
      "historyGallery",

        const val=snap.val();

        this.state.historyGallery=
          val
            ? Object.keys(val)
                .map(k=>({
                  id:k,
                  ...val[k]
                }))
                .reverse()
            : [];

        if(
          this.state.view==="historyGallery" ||
          this.state.view==="admin"
        ){
          this.render();
        }

      }
    );


    safeListener(
      "chaupalMessages",
      snap=>{

        const val=snap.val();

        const newMsgs=
          val
            ? Object.keys(val)
                .map(k=>({
                  id:k,
                  ...val[k]
                }))
                .reverse()
            : [];

        if(
          this.state.view!=="chaupal" &&

        ){

  updateTicker(){

    const tickerEl=
      document.getElementById(
        "dynamicTickerText"
      );

    if(!tickerEl) return;

    const approvedShops=
      this.state.services.filter(
        s =>
          s.status==="approved" &&
          s.districtId===
            this.state.selectedDistrict &&
          s.villageHi===
            this.state.searchVillage
      );

    const baseText=
      "🌾 सरसों: ₹5,400/क्विंटल | " +
      "🌾 गेहूँ: ₹2,425/क्विंटल | " +
      "🌤️ मौसम: सामान्य";

    if(approvedShops.length>0){

      const shopTickerItems=
        approvedShops
          .map(
            s =>
              `${this.escapeHtml(s.name)}
              (${this.escapeHtml(s.category || "Service")})
              - ${this.escapeHtml(s.phone || "")}`
          )
          .join(" | ");

      tickerEl.innerHTML=
        `${shopTickerItems} | ${baseText}`;

    }else{

      tickerEl.innerHTML=baseText;

    }

  }

  generateGreetingBannerCanvas(){

    const name=
      document.getElementById(
        "gName"
      )?.value.trim();

    const phone=
      document.getElementById(
        "gPhone"
      )?.value.trim();

    const msg=
      document.getElementById(
        "gMsg"
      )?.value.trim();

    const templateSelect=
      document.getElementById(
        "gTemplateSelect"
      )?.value;

    if(!name || !msg){

      alert(
        "कृपया अपना नाम और बधाई संदेश जरूर भरें!"
      );

      return;
    }

    const canvas=
      document.createElement(
        "canvas"
      );

    canvas.width=800;
    canvas.height=800;

    const ctx=
      canvas.getContext("2d");

    if(!ctx){

      alert(
        "आपके ब्राउज़र में Canvas उपलब्ध नहीं है।"
      );

      return;
    }

    if(
      templateSelect &&
      templateSelect!=="default"
    ){

      const templateImg=
        new Image();

      templateImg.crossOrigin="anonymous";

      templateImg.onload=()=>{

        try{

          ctx.drawImage(
            templateImg,
            0,
            0,
            800,
            800
          );

          this.drawTextAndUserPhotoOnCanvas(
            ctx,
            name,
            phone,
            msg,
            canvas
          );

        }catch(error){

          console.error(error);

          this.drawDefaultBannerBackground(
            ctx,
            name,
            phone,
            msg,
            canvas
          );

        }

      };

      templateImg.onerror=()=>{

        this.drawDefaultBannerBackground(
          ctx,
          name,
          phone,
          msg,
          canvas
        );

      };

      templateImg.src=
        templateSelect;

    }else{

      this.drawDefaultBannerBackground(
        ctx,
        name,
        phone,
        msg,
        canvas
      );

    }

  }


  drawDefaultBannerBackground(
    ctx,
    name,
    phone,
    msg,
    canvas
  ){

    const bgGrad=
      ctx.createLinearGradient(
        0,
        0,
        800,
        800
      );

    bgGrad.addColorStop(
      0,
      "#064e3b"
    );

    bgGrad.addColorStop(
      .5,
      "#047857"
    );

    bgGrad.addColorStop(
      1,
      "#022c22"
    );

    ctx.fillStyle=bgGrad;

    ctx.fillRect(
      0,
      0,
      800,
      800
    );

    ctx.strokeStyle="#fbbf24";
    ctx.lineWidth=12;

    ctx.strokeRect(
      20,
      20,
      760,
      760
    );

    ctx.fillStyle="#fbbf24";

    ctx.font=
      'bold 36px "Hind", sans-serif';

  drawUserPhotoAndTextOverlay(

    ctx.beginPath();

    ctx.arc(
      400,
      470,
      115,
      0,
      Math.PI*2,
      true
    );

    ctx.closePath();
    ctx.clip();

    ctx.fillStyle="#fff";

    ctx.fillRect(
      285,
      355,
      230,
      230
    );

    if(this.bannerUserPhotoObj){

      ctx.drawImage(
        this.bannerUserPhotoObj,
        285,
        355,
        230,
        230
      );

    }else{

      ctx.fillStyle="#064e3b";

      ctx.font=
        'bold 70px "Hind", sans-serif';

      ctx.textAlign="center";

      ctx.fillText(
        "👤",
        400,
        495
      );

    }

    ctx.restore();

    ctx.beginPath();

    ctx.arc(
      400,
      470,
      115,
      0,
      Math.PI*2,
      true
    );

    ctx.lineWidth=6;
    ctx.strokeStyle="#fbbf24";
    ctx.stroke();

    ctx.fillStyle="#fbbf24";

    ctx.font=
      'bold 36px "Hind", sans-serif';

    ctx.textAlign="center";

    ctx.fillText(

      400,

  wrapText(
    context,
    text,
    x,
    y,
    maxWidth,
    lineHeight
  ){

    const words=
      String(text).split(" ");

    let line="";

    for(
      let n=0;
      n<words.length;
      n++
    ){

      const testLine=
        line +
        words[n] +
        " ";

      const metrics=
        context.measureText(
          testLine
        );

      const testWidth=
        metrics.width;

      if(
        testWidth>maxWidth &&
        n>0
      ){

        context.fillText(
          line,
          x,
          y
        );

        line=
          words[n] +
          " ";

        y+=lineHeight;

      }else{

        line=testLine;

      }

    }

    context.fillText(
      line,
      x,
      y
    );

  }

  handleHistoryGalleryMedia(input){

    const file=
      input?.files?.[0];

    if(!file) return;

    if(
      !file.type.startsWith("image/") &&
      !file.type.startsWith("video/")
    ){

      alert(
        "कृपया केवल फोटो या वीडियो चुनें।"
      );

      return;
    }

    this.tempMediaType=
      file.type.startsWith("video")
        ? "video"
        : "image";

    const reader=
      new FileReader();

    reader.onloadend=()=>{

      this.tempMedia=
        reader.result;

      alert(
        `✅ ${
          this.tempMediaType==="video"
            ? "वीडियो"
            : "फोटो"
        } चुन ली गई है!`
      );

    };

    reader.readAsDataURL(file);

  }

  submitChaupalMsg(){

    const senderName=
      document.getElementById(
        "cName"
      )?.value.trim();

    const msgText=
      document.getElementById(
        "cText"
      )?.value.trim();

    if(!senderName || !msgText){

      alert(
        "कृपया नाम और संदेश लिखें!"
      );

      return;
    }

    if(!window.firebaseDb){

      alert(
        "Firebase कनेक्ट नहीं है।"
      );

      return;
    }

    const fullMsg=
      `${msgText} (सम्पर्क: ${this.state.currentUserPhone})`;

    const {
      db,
      ref,
      push
    }=window.firebaseDb;

    push(
      ref(db,"chaupalMessages"),
      {
        name:senderName,
        phone:this.state.currentUserPhone,
        message:fullMsg,
        districtId:this.state.selectedDistrict,
        villageHi:this.state.searchVillage,
        timestamp:Date.now()
      }
    )
    .then(()=>{

      this.render();

    })
    .catch(error=>{

      alert(
        "Message Error: "+
        error.message
      );

    });

  }

              class="form-control"
              id="cText"
              placeholder="अपना संदेश यहाँ लिखें..."
              style="
                margin-bottom:8px;
                height:60px;
              "
            ></textarea>


            <button
              class="btn-submit"
              onclick="app.submitChaupalMsg()"
            >
              💬 संदेश भेजें
            </button>

          </div>


          <div style="margin-top:10px;">

            ${
              chaupalList ||
              `<div class="empty-state">
                चैट रूम में अभी कोई संदेश नहीं है।
              </div>`
            }

          </div>

        `;

      }


      const canManageMembers=
        (
          this.state.isAdminLoggedIn ||
          (
            this.state.isSubAdminLoggedIn &&
            this.state.loggedInSubAdminVillage===
              this.state.searchVillage
          )
        );


      const adminMemberAddSection=
        canManageMembers
          ? `

            <div
              style="
                background:#eff6ff;
                border:1px solid #2563eb;
                border-radius:12px;
                padding:12px;
                margin-bottom:15px;
              "
            >

              <div
                style="
                  font-size:12px;
                  font-weight:bold;
                  color:#1e40af;
                  margin-bottom:6px;
                "
              >
                ⚙️ नया सदस्य और पासवर्ड जोड़ें
              </div>


              <input
                class="form-control"
                id="newMemberPhone"
                placeholder="मोबाइल नंबर..."
                style="margin-bottom:8px;"
              >


              <input
                class="form-control"
                id="newMemberPass"
                placeholder="पासवर्ड..."
                style="margin-bottom:8px;"
              >


              <button
                style="
                  background:#2563eb;
                  color:white;
                  border:none;
                  width:100%;
                  padding:10px;
                  border-radius:8px;
                  font-weight:bold;
                  cursor:pointer;
                "
                onclick="app.addAllowedMemberWithPassword()"
              >
                सेव करें
              </button>

            </div>

          `
          : "";


      html=`

        <button
          class="back-btn"
          onclick="app.changeView('home')"
        >
          ← होम
        </button>


        <div class="card">

          <div class="card-title">
            💬 Admin Chat Room
          </div>

          ${adminMemberAddSection}

          ${chatContentArea}

        </div>

      `;

    }


    /* =====================================================
       POLICY
       ===================================================== */

    else if(
      this.state.view==="policy"
    ){

      html=`

        <button
          class="back-btn"
          onclick="app.changeView('home')"
        >
          ← होम
        </button>

        <div class="card">

          <div class="card-title">
            📜 Privacy Policy
          </div>

          <p
            style="
              font-size:13px;
              color:#334155;
              line-height:1.6;
            "
          >
            डेटा सुरक्षा सुरक्षित है।
            उपयोगकर्ता द्वारा भेजी गई जानकारी
            MeraGaov के Firebase database में
            सेव हो सकती है।
          </p>

        </div>

      `;

    }


    /* =====================================================
       ABOUT
       ===================================================== */

    else if(
      this.state.view==="about"
    ){

      html=`

        <button
          class="back-btn"
          onclick="app.changeView('home')"
        >
          ← होम
        </button>

        <div class="card">

          <div class="card-title">
            ℹ️ About Us
          </div>

          <p
            style="
              font-size:13px;
              color:#334155;
            "
          >
            संचालक: Kusum w/o Rajesh Yadav
          </p>

        </div>

      `;

    }


    /* =====================================================
       ADMIN
       ===================================================== */

    else if(
      this.state.view==="admin"
    ){

      if(
        !this.state.isAdminLoggedIn &&
        !this.state.isSubAdminLoggedIn
      ){

        this.changeView("home");
        return;

      }


      const targetVillageFilter=
        this.state.isAdminLoggedIn
          ? null
          : this.state.loggedInSubAdminVillage;


      const renderPend=
        (
          arr,
          path,
          labelName
        )=>{

          return arr
            .filter(
              x =>
                x.status==="pending" &&
                x.districtId===
                  this.state.selectedDistrict &&
                (
                  !targetVillageFilter ||
                  x.villageHi===
                    targetVillageFilter
                )
            )
            .map(
              x=>`

                <div
                  class="media-card"
                  style="border:2px solid #2563eb;"
                >

                  <span class="service-tag">

                    ${this.escapeHtml(labelName)}
                    -
                    (${this.escapeHtml(
                      x.villageHi || "गाँव"
                    )})

                  </span>


                  <div class="service-name">

                    ${this.escapeHtml(
                      x.title ||
                      x.message ||
                      x.name ||
                      ""
                    )}

                  </div>


                  ${
                    x.name
                      ? `
                        <p
                          style="
                            font-size:11px;
                            color:#555;
                          "
                        >
                          द्वारा:
                          ${this.escapeHtml(x.name)}
                          |
                          फोन:
                          ${this.escapeHtml(
                            x.phone || "N/A"
                          )}
                        </p>
                      `
                      : ""
                  }


                  ${
                    x.imageUrl
                      ? `
                        <img
                          src="${x.imageUrl}"
                          class="service-img"
                        >
                      `
                      : ""
                  }


                  ${
                    x.mediaType==="video"
                      ? `
                        <video
                          src="${x.mediaUrl}"
                          controls
                          class="service-video"
                        ></video>
                      `
                      : ""
                  }


                  <button
                    class="approve-btn"
                    onclick="
                      app.approveItem(
                        '${this.escapeHtml(path)}',
                        '${this.escapeHtml(x.id)}'
                      )
                    "
                  >
                    ✅ Approve
                  </button>


                  <button
                    class="delete-btn"
                    onclick="
                      app.deleteItem(
                        '${this.escapeHtml(path)}',
                        '${this.escapeHtml(x.id)}'
                      )
                    "
                  >
                    ❌ Reject
                  </button>

                </div>

              `
            )
            .join("");

        };


      const pServ=
        renderPend(
          this.state.services,
          "services",
          "Shop"
        );

      const pAnn=
        renderPend(
          this.state.announcements,
          "announcements",
          "Announcement"
        );

      const pGreet=
        renderPend(
          this.state.greetings,
          "greetings",
          "Greeting/Banner"
        );

      const pMkt=
        renderPend(
          this.state.market,
          "market",
          "Market"
        );

      const pHg=
        renderPend(
          this.state.historyGallery,
          "historyGallery",
          "History"
        );


      let resetRequestsHtml="";


      if(this.state.isAdminLoggedIn){

        resetRequestsHtml=
          this.state.resetRequests
            .filter(
              r =>
                r.status==="pending"
            )
            .map(
              r=>`

                <div
                  class="media-card"
                  style="
                    border:2px solid #dc2626;
                    background:#fef2f2;
                  "
                >

                  <span
                    class="service-tag"
                    style="
                      background:#fecaca;
                      color:#991b1b;
                    "
                  >
                    गाँव रीसेट अनुरोध
                  </span>


                  <div class="service-name">

                    पुराना गाँव:
                    ${this.escapeHtml(r.old_village)}

                    ➡️

                    नया माँगा गया:
                    ${this.escapeHtml(
                      r.new_requested_village
                    )}

                  </div>


                  <p
                    style="
                      font-size:11px;
                      color:#555;
                    "
                  >
                    डिवाइस आईडी:
                    ${this.escapeHtml(r.device_id)}
                  </p>


                  <button
                    class="approve-btn"
                    onclick="
                      app.approveResetRequest(
                        '${this.escapeHtml(r.id)}',
                        '${this.escapeHtml(r.new_requested_village)}'
                      )
                    "
                  >
                    ✅ रीसेट की अनुमति दें
                  </button>


                  <button
                    class="delete-btn"
                    onclick="
                      app.deleteResetRequest(
                        '${this.escapeHtml(r.id)}'
                      )
                    "
                  >
                    ❌ रद्द करें
                  </button>

                </div>

              `
            )
            .join("");

      }


      const noPending=
        !resetRequestsHtml &&
        !pServ &&
        !pAnn &&
        !pGreet &&
        !pMkt &&
        !pHg;


      html=`

        <button
          class="back-btn"
          onclick="app.changeView('home')"
        >
          ← होम
        </button>


        <div class="card">

          <div class="card-title">

            📥 Admin Approval Panel

            ${
              targetVillageFilter
                ? `(${this.escapeHtml(targetVillageFilter)})`
                : ""
            }

          </div>

        </div>


        ${resetRequestsHtml || ""}

        ${pServ || ""}

        ${pAnn || ""}

        ${pGreet || ""}

        ${pMkt || ""}

        ${pHg || ""}


        ${
          noPending
            ? `
              <div class="empty-state">
                कोई पेंडिंग अनुरोध नहीं है।
              </div>
            `
            : ""
        }

      `;

    }


    content.innerHTML=html;

  }

}


/* =========================================================
   START APP
   ========================================================= */

let app;

try{

  app=new VillageApp();

}catch(error){

  console.error(
    "MeraGaov startup error:",
    error
  );

  const content=
    document.getElementById(
      "mainContent"
    );

  if(content){

    content.innerHTML=`

      <div
        class="card"
        style="
          text-align:center;
          border:2px solid #dc2626;
        "
      >

        <h3
          style="
            color:#dc2626;
            margin-bottom:10px;
          "
        >
          ⚠️ App खोलने में समस्या
        </h3>

        <p
          style="
            font-size:13px;
            color:#475569;
          "
        >
          कृपया HTML file को दोबारा खोलें।
          अगर समस्या बनी रहे तो browser console
          में error check करें।
        </p>

        <p
          style="
            font-size:11px;
            color:#64748b;
            margin-top:8px;
          "
        >
          ${String(error.message || error)}
        </p>

      </div>

    `;

  }

}

</script>

</body>
</html>
