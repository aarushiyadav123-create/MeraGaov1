class VillageApp {
  constructor() {
    this.state = {
      lang: 'hi',
      view: 'home',
      selectedDistrict: localStorage.getItem('selectedDistrict') || 'charkhi-dadri',
      searchVillage: localStorage.getItem('searchVillage') || 'मालकोश',
      activeCategory: 'all',
      services: [],
      gallery: [],
      market: [],
      announcements: [],
      history: [],
      videos: [],
      subAdmins: [],
      userAvatarUrl: localStorage.getItem('userCustomAvatar') || 'https://cdn-icons-png.flaticon.com/512/3135/3135715.png',
      isAdminLoggedIn: false,
      isSubAdminLoggedIn: false
    };

    this.tempImage = '';
    this.tempVideo = '';

    this.initListeners();
    this.initFirebaseData();
    this.render();
  }

  initListeners() {
    const menuToggle = document.getElementById('menuToggleBtn');
    if(menuToggle) {
      menuToggle.onclick = (e) => {
        e.stopPropagation();
        const menu = document.getElementById('dropdownMenu');
        menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
      };
    }
    window.onclick = () => { 
      const menu = document.getElementById('dropdownMenu');
      if(menu) menu.style.display = 'none'; 
    };
    
    const langBtn = document.getElementById('langToggleBtn');
    if(langBtn) {
      langBtn.onclick = () => {
        this.state.lang = this.state.lang === 'hi' ? 'en' : 'hi';
        langBtn.innerText = this.state.lang === 'hi' ? '🌐 हिंदी' : '🌐 English';
        this.render();
      };
    }
  }

  initFirebaseData() {
    setTimeout(() => {
      if (window.firebaseDb) {
        const { db, ref, onValue } = window.firebaseDb;
        
        onValue(ref(db, 'services'), snap => {
          const val = snap.val();
          this.state.services = val ? Object.keys(val).map(k => ({id: k, ...val[k]})).reverse() : [];
          if(this.state.view === 'list' || this.state.view === 'admin') this.render();
        });
        
        onValue(ref(db, 'announcements'), snap => {
          const val = snap.val();
          this.state.announcements = val ? Object.keys(val).map(k => ({id: k, ...val[k]})).reverse() : [];
          if(this.state.view === 'announcements' || this.state.view === 'admin') this.render();
        });
        
        onValue(ref(db, 'market'), snap => {
          const val = snap.val();
          this.state.market = val ? Object.keys(val).map(k => ({id: k, ...val[k]})).reverse() : [];
          if(this.state.view === 'market' || this.state.view === 'admin') this.render();
        });
        
        onValue(ref(db, 'gallery'), snap => {
          const val = snap.val();
          this.state.gallery = val ? Object.keys(val).map(k => ({id: k, ...val[k]})).reverse() : [];
          if(this.state.view === 'gallery' || this.state.view === 'admin') this.render();
        });
        
        onValue(ref(db, 'history'), snap => {
          const val = snap.val();
          this.state.history = val ? Object.keys(val).map(k => ({id: k, ...val[k]})).reverse() : [];
          if(this.state.view === 'history' || this.state.view === 'admin') this.render();
        });
        
        onValue(ref(db, 'videos'), snap => {
          const val = snap.val();
          this.state.videos = val ? Object.keys(val).map(k => ({id: k, ...val[k]})).reverse() : [];
          if(this.state.view === 'videos' || this.state.view === 'admin') this.render();
        });
        
        onValue(ref(db, 'subAdmins'), snap => {
          const val = snap.val();
          this.state.subAdmins = val ? Object.keys(val).map(k => ({id: k, pwd: val[k]})) : [];
        });
      }
    }, 1000);
  }

  changeUserAvatar(input) {
    const file = input.files[0];
    if(file) {
      const reader = new FileReader();
      reader.onloadend = () => {
        this.state.userAvatarUrl = reader.result;
        localStorage.setItem('userCustomAvatar', reader.result);
        const avatarEl = document.getElementById('headerUserAvatar');
        if(avatarEl) avatarEl.src = reader.result;
        alert("प्रोफाइल फोटो बदल दी गई है!");
      };
      reader.readAsDataURL(file);
    }
  }

  requestAdminAccess() {
    let pwd = prompt("एडमिन पासवर्ड दर्ज करें:");
    if(pwd === '1234') {
      this.state.isAdminLoggedIn = true;
      this.state.isSubAdminLoggedIn = false;
      this.changeView('admin');
    } else { alert("गलत पासवर्ड!"); }
  }

  requestSubAdminAccess() {
    let pwd = prompt("सब-एडमिन पासवर्ड दर्ज करें:");
    let matchedSub = this.state.subAdmins.find(s => s.pwd === pwd);
    if(matchedSub || pwd === '1234') {
      this.state.isAdminLoggedIn = (pwd === '1234');
      this.state.isSubAdminLoggedIn = true;
      this.changeView('admin');
    } else { alert("गलत पासवर्ड!"); }
  }

  addSubAdmin() {
    let inputEl = document.getElementById('newSubAdminPwd');
    let newSubPwd = inputEl ? inputEl.value : '';
    if(!newSubPwd) return alert("पासवर्ड दर्ज करें!");
    if (window.firebaseDb) {
      const { db, ref, push } = window.firebaseDb;
      push(ref(db, 'subAdmins'), newSubPwd).then(() => {
        alert("सब-एडमिन जोड़ दिया गया है!");
        if(inputEl) inputEl.value = '';
      });
    }
  }

  deleteSubAdmin(id) {
    if(confirm("हटाना चाहते हैं?")) {
      if (window.firebaseDb) {
        const { db, ref, remove } = window.firebaseDb;
        remove(ref(db, `subAdmins/${id}`)).then(() => this.render());
      }
    }
  }

  changeView(viewName) {
    this.state.view = viewName;
    this.render();
  }

  saveData(path, data, msg) {
    if (window.firebaseDb) {
      const { db, ref, push } = window.firebaseDb;
      push(ref(db, path), { 
        ...data, 
        districtId: this.state.selectedDistrict, 
        villageHi: this.state.searchVillage, 
        status: 'pending', 
        timestamp: Date.now() 
      })
      .then(() => { 
        alert(msg); 
        this.changeView('home'); 
      })
      .catch(err => alert("त्रुटि: " + err.message));
    } else { alert("डेटाबेस कनेक्टेड नहीं है!"); }
  }

  approveItem(path, id) {
    if (window.firebaseDb) {
      const { db, ref, update } = window.firebaseDb;
      update(ref(db, `${path}/${id}`), { status: 'approved' }).then(() => {
        alert("अप्रूव हो गया!");
        this.render();
      });
    }
  }

  deleteItem(path, id) {
    if(confirm("डिलीट करना चाहते हैं?")) {
      if (window.firebaseDb) {
        const { db, ref, remove } = window.firebaseDb;
        remove(ref(db, `${path}/${id}`)).then(() => this.render());
      }
    }
  }

  handleImage(input) {
    const file = input.files[0];
    if(file) {
      const reader = new FileReader();
      reader.onloadend = () => { 
        this.tempImage = reader.result; 
        let preview = document.getElementById('shopImgPreviewText') || 
                      document.getElementById('annImgPreviewText') || 
                      document.getElementById('histImgPreviewText') || 
                      document.getElementById('mImgPreviewText') || 
                      document.getElementById('gImgPreviewText');
        if(preview) preview.innerText = "✅ फोटो चुन ली गई है";
      };
      reader.readAsDataURL(file);
    }
  }

  handleVideo(input) {
    const file = input.files[0];
    if(file) {
      const reader = new FileReader();
      reader.onloadend = () => { 
        this.tempVideo = reader.result; 
        let preview = document.getElementById('vFilePreviewText');
        if(preview) preview.innerText = "✅ वीडियो चुन लिया गया है";
      };
      reader.readAsDataURL(file);
    }
  }

  submitShop() {
    const nameEl = document.getElementById('sName');
    const phoneEl = document.getElementById('sPhone');
    const catEl = document.getElementById('sCat');
    const name = nameEl ? nameEl.value : '';
    const phone = phoneEl ? phoneEl.value : '';
    const cat = catEl ? catEl.value : 'किराना';
    if(!name || !phone) return alert("कृपया सभी जानकारी भरें!");
    this.saveData('services', { name, phone, category: cat, imageUrl: this.tempImage || '' }, "दुकान एडमिन अप्रूवल के लिए भेज दी गई है!");
    this.tempImage = '';
  }

  submitAnnouncement() {
    const titleEl = document.getElementById('annTitle');
    const title = titleEl ? titleEl.value : '';
    if(!title) return alert("विवरण भरें!");
    this.saveData('announcements', { title, imageUrl: this.tempImage || '' }, "मुनादी भेज दी गई है!");
    this.tempImage = '';
  }

  submitHistory() {
    const titleEl = document.getElementById('histTitle');
    const title = titleEl ? titleEl.value : '';
    if(!title) return alert("विवरण भरें!");

          ${this.state.subAdmins.map(s => `<div style="display:flex; justify-content:space-between; align-items:center; background:#f1f5f9; padding:6px; border-radius:6px; margin-top:4px;"><span>🔑 ${s.pwd}</span><button class="delete-btn" onclick="app.deleteSubAdmin('${s.id}')">हटाएं</button></div>`).join('')}
        </div>
      ` : '';

      html = `
        <button class="back-btn" onclick="app.changeView('home')">← होम</button>
        <div class="card"><div class="card-title">📥 एडमिन अप्रूवल पैनल</div></div>
        ${pServ || ''} ${pAnn || ''} ${pHist || ''} ${pMkt || ''} ${pGal || ''} ${pVid || ''}
        ${(!pServ && !pAnn && !pHist && !pMkt && !pGal && !pVid) ? '<div class="empty-state">कोई पेंडिंग रिक्वेस्ट नहीं है।</div>' : ''}
        ${subAdminSection}
      `;
    }

    content.innerHTML = html;
    if(this.state.view === 'home') {
      let vInput = document.getElementById('villageInput');
      if(vInput) {
        vInput.oninput = (e) => { this.state.searchVillage = e.target.value; };
      }
    }
  }
}

const app = new VillageApp();
</script>
</body>
</html>
