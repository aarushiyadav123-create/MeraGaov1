<script>
const D={
"charkhi-dadri":{nameHi:"चरखी दादरी",nameEn:"Charkhi Dadri",villages:[["मालकोश","Malkosh"],["बाउंड","Baund"],["झूझू कलाँ","Jhujhu Kalan"],["पैडवा","Paidwa"],["बल्हा","Balha"],["मान्धी","Mandhi"],["मंसूरवास","Mansoorwas"],["अचैरा","Achaira"],["बडराई","Badrai"],["कोहला","Kohla"],["भागवी","Bhagvi"],["मटौर","Mataur"]]},
"rohtak":{nameHi:"रोहतक",nameEn:"Rohtak",villages:[["महम","Meham"],["कलानौर","Kalanaur"],["स्माइला","Smaila"],["निंदाना","Nindana"],["सांपला","Sampla"]]},
"hansi":{nameHi:"हाँसी",nameEn:"Hansi",villages:[["हाँसी शहर","Hansi City"],["सिसई","Sisai"],["उमरा","Umra"]]},
"rewari":{nameHi:"रेवाड़ी",nameEn:"Rewari",villages:[["बावल","Bawal"],["कोसली","Kosli"]]},
"bhiwani":{nameHi:"भिवानी",nameEn:"Bhiwani",villages:[["भिवानी शहर","Bhiwani City"],["लोहारू","Loharu"],["सिवानी","Siwani"],["बाढड़ा","Badhra"]]},
"hisar":{nameHi:"हिसार",nameEn:"Hisar",villages:[["हिसार शहर","Hisar City"],["बरवाला","Barwala"],["नारनौंद","Narnaund"],["हांसी रोड","Hansiwala"]]},
"panipat":{nameHi:"पानीपत",nameEn:"Panipat",villages:[["पानीपत शहर","Panipat City"],["समालखा","Samalkha"],["सनौली","Sanauli"],["इन्द्रगढ़","Indragarh"]]}
};
const jokesList=[
"तऊ बोला: बेटा अंग्रेजी में 'Apple' ने के कह्या करें? पोता: सेब तऊ! तऊ: बेबे के फूंके मारै है, मन्ने अंग्रेजी पूछ् राखी थी!",
"एक हरियाणवी छोरा अंग्रेजी बोलन लाग्या: 'I want a glass of water.' दूजा बोला: 'भाई, बाल्टी भरकै पी ले, अंग्रेजी झाड़ण की जरूरत कोन्या!'",
"मास्टर: बता यो 'Honesty is the best policy' का हिंदी अनुवाद कै होवै है? छात्र: मास्टर जी, ईमानदारी सबतै बढ़िया ठेकेदारी सै!",
"ताया ताश खेलने बैठ्या और बोला: 'पत्ता फेंकण तै पैल्या राम का नाम लेवियो!' दूजा बोला: 'तऊ, ताश में ना, किस्मत काम आया करै!'",
"पत्नी: जी सुणो हो, मन्ने सपने में राजकुमार मिल्या! पति: अच्छा, फेर कसूती कुटाई कोन्या करी उसनें तेरी?"
];
const avatarDefault="https://cdn-icons-png.flaticon.com/512/3135/3135715.png";
class VillageApp{
constructor(){
this.loadCustomVillages();
this.state={
lang:"hi",view:"home",
selectedDistrict:localStorage.getItem("selectedDistrict")||"charkhi-dadri",
searchVillage:localStorage.getItem("searchVillage")||"",
userVillage:localStorage.getItem("userVillage")||"",
userDistrict:localStorage.getItem("userDistrict")||"",
villageLocked:localStorage.getItem("villageLocked")==="true",
services:[],announcements:[],greetings:[],market:[],historyGallery:[],sarpanchDetails:[],chaupalMessages:[],feedbacks:[],khelKud:[],
allowedChatUsers:{},subAdmins:[],villagesConfig:{},villageUnlockRequests:{},
userAvatarUrl:localStorage.getItem("userCustomAvatar")||avatarDefault,
headerUsername:localStorage.getItem("headerUsername")||"User",
isAdminLoggedIn:false,isSubAdminLoggedIn:false,
adminName:localStorage.getItem("adminName")||"Admin",
loggedInSubAdminVillage:"",loggedInSubAdminDistrict:"",loggedInSubAdminName:"",loggedInSubAdminPhone:"",
currentUserPhone:localStorage.getItem("currentUserPhone")||"",
showGlobalManagedToggle:false
};
this.tempImage="";this.tempMedia="";this.tempMediaType="image";this.generatedBannerDataUrl="";this.bannerUserPhotoObj=null;this.unreadMessageCount=0;
this.listeners();this.firebase();this.render();this.startup();
}
esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");}
status(t){
let e=document.getElementById("firebaseStatus");if(!e)return;
e.textContent=t;e.style.display="block";clearTimeout(this.st);
this.st=setTimeout(()=>e.style.display="none",3500);
}
villageObj(){
let d=D[this.state.selectedDistrict];
return d?.villages.find(v=>v[0]===this.state.searchVillage||v[1]===this.state.searchVillage);
}
hasSubAdminForCurrentVillage(){
return this.state.subAdmins.some(s=>s.village===this.state.searchVillage&&s.districtId===this.state.selectedDistrict);
}
isAdminForVillage(v){
if(this.state.isAdminLoggedIn)return true;
if(this.state.isSubAdminLoggedIn){
return this.state.loggedInSubAdminVillage===v && this.state.loggedInSubAdminDistrict===this.state.selectedDistrict;
}
return false;
}
startup(){
setTimeout(()=>{let s=document.getElementById("splashScreen");if(s){s.style.opacity=0;setTimeout(()=>s.remove(),500);}},1000);
}
loadCustomVillages(){
try{
let x=JSON.parse(localStorage.getItem("customDistrictVillages")||"{}");
Object.keys(x).forEach(k=>{
if(!D[k])return;
x[k].forEach(v=>{if(!D[k].villages.some(a=>a[0]===v[0]))D[k].villages.push(v);});
});
}catch(e){console.error(e);}
}
listeners(){
document.getElementById("menuToggleBtn").onclick=e=>{
e.stopPropagation();let m=document.getElementById("dropdownMenu");m.style.display=m.style.display==="block"?"none":"block";
};
document.addEventListener("click",()=>{let m=document.getElementById("dropdownMenu");if(m)m.style.display="none";});

document.getElementById("langToggleBtn").onclick=()=>{
this.state.lang=this.state.lang==="hi"?"en":"hi";
document.getElementById("langToggleBtn").textContent=this.state.lang==="hi"?"🌐 English":"🌐 हिंदी";
this.render();
};
window.addEventListener("firebase-ready",()=>this.setupFirebase());
window.addEventListener("firebase-error",()=>this.status("⚠️ Firebase connect नहीं हुआ"));
}
saveHeaderUsername(val){
this.state.headerUsername=val;
localStorage.setItem("headerUsername",val);
}
firebase(){
if(window.firebaseDb)return this.setupFirebase();
let n=0,wait=()=>{
if(window.firebaseDb)return this.setupFirebase();
if(++n<30)setTimeout(wait,250);else this.status("⚠️ Firebase उपलब्ध नहीं है");
};
wait();
}
setupFirebase(){
if(this.firebaseStarted||!window.firebaseDb)return;
this.firebaseStarted=true;
const {db,ref,onValue}=window.firebaseDb;
const listen=(path,fn)=>onValue(ref(db,path),s=>fn(s.val()),e=>console.error(path,e));
const load=(key,val)=>{
this.state[key]=val?Object.keys(val).map(k=>({id:k,...val[k]})).reverse():[];
if(["list","announcements","greetings","market","historyGallery","sarpanchDetails","admin","feedback","khelKud"].includes(this.state.view))this.render();
this.updateTicker();
};
listen("services",v=>load("services",v));
listen("announcements",v=>load("announcements",v));
listen("market",v=>load("market",v));
listen("greetings",v=>load("greetings",v));
listen("historyGallery",v=>load("historyGallery",v));
listen("sarpanchDetails",v=>load("sarpanchDetails",v));
listen("feedbacks",v=>load("feedbacks",v));
listen("khelKud",v=>load("khelKud",v));
listen("chaupalMessages",v=>{
let a=v?Object.keys(v).map(k=>({id:k,...v[k]})).reverse():[];
if(this.state.view!=="chaupal"&&a.length>this.state.chaupalMessages.length){this.unreadMessageCount+=a.length-this.state.chaupalMessages.length;}
this.state.chaupalMessages=a;
if(["home","chaupal"].includes(this.state.view))this.render();
});
listen("allowedChatUsers",v=>{this.state.allowedChatUsers=v||{};if(["chaupal","admin"].includes(this.state.view))this.render();});
listen("subAdmins",v=>{this.state.subAdmins=v?Object.keys(v).map(k=>({id:k,...v[k]})):[];if(this.state.view==="admin"||this.state.view==="home")this.render();});
listen("villages_config",v=>{this.state.villagesConfig=v||{};if(this.state.view==="admin"||this.state.view==="home")this.render();});
listen("villageUnlockRequests",v=>{
this.state.villageUnlockRequests=v||{};
let phone=this.state.currentUserPhone||localStorage.getItem("currentUserPhone")||this.state.userPhone||"";
if(phone&&v&&v[phone]&&v[phone].status==="approved"){
this.state.villageLocked=false;
localStorage.removeItem("villageLocked");localStorage.removeItem("userVillage");localStorage.removeItem("userDistrict");
this.state.userVillage="";this.state.userDistrict="";
}
if(this.state.view==="admin")this.render();
});
}
updateTicker(){
let e=document.getElementById("dynamicTickerText");
if(e){
let base=this.state.lang==="en"? "🌾 Mustard: ₹5,400/Quintal | 🌾 Wheat: ₹2,425/Quintal | 🌤️ Weather: Normal" : "🌾 सरसों: ₹5,400/क्विंटल | 🌾 गेहूँ: ₹2,425/क्विंटल | 🌤️ मौसम: सामान्य";
let items=[...this.state.announcements.filter(x=>x.status==="approved"&&x.showOnTicker&&x.villageHi===this.state.searchVillage),...this.state.greetings.filter(x=>x.status==="approved"&&x.showOnTicker&&x.villageHi===this.state.searchVillage),...this.state.services.filter(x=>x.status==="approved"&&x.showOnTicker&&x.villageHi===this.state.searchVillage)].map(x=>x.villageHi?`📍 ${x.villageHi}: ${x.title||x.message||x.name}`:(x.title||x.message||x.name)).filter(Boolean).join(" | ");
e.textContent=items?`${items} | ${base}`:base;
}
}
changeUserAvatar(input){
let f=input?.files?.[0];if(!f||!f.type.startsWith("image/"))return alert(this.state.lang==="en"?"Please select an image only.":"केवल फोटो चुनें।");
if(f.size>2*1024*1024)return alert(this.state.lang==="en"?"Image should be less than 2 MB.":"फोटो 2 MB से छोटी रखें।");
let r=new FileReader();
r.onload=()=>{this.state.userAvatarUrl=r.result;localStorage.setItem("userCustomAvatar",r.result);document.getElementById("headerUserAvatar").src=r.result;alert(this.state.lang==="en"?"Profile photo updated!":"प्रोफाइल फोटो बदल दी गई!");};
r.readAsDataURL(f);
}
updateDashboardBannerPhoto(input){
let f=input?.files?.[0];if(!f||!f.type.startsWith("image/"))return alert(this.state.lang==="en"?"Please select an image only.":"केवल फोटो चुनें।");
if(f.size>2*1024*1024)return alert(this.state.lang==="en"?"Image should be less than 2 MB.":"फोटो 2 MB से छोटी रखें।");
let r=new FileReader();
r.onload=()=>{
let imgUrl=r.result;
this.saveData("greetings",{name:this.state.isSubAdminLoggedIn?this.state.loggedInSubAdminName:"Admin",phone:"",message:`🌟 ${this.state.searchVillage} डिजिटल डैशबोर्ड स्पेशल बैनर`,imageUrl:imgUrl,showOnTicker:true},this.state.lang==="en"?"Dashboard banner photo updated successfully!":"डैशबोर्ड बैनर फोटो सफलतापूर्वक बदल दी गई!");
};
r.readAsDataURL(f);
}
requestAdminAccess(){

wrapText(ctx,text,x,y,max,lineH){
let words=String(text).split(/\s+/),line="";
for(let w of words){let t=line?line+" "+w:w;if(ctx.measureText(t).width>max&&line){ctx.fillText(line,x,y);line=w;y+=lineH;}else line=t;}
if(line)ctx.fillText(line,x,y);
}
generateGreetingBannerCanvas(){

let c=document.createElement("canvas");c.width=800;c.height=800;let x=c.getContext("2d");
let g=x.createLinearGradient(0,0,800,800);g.addColorStop(0,"#064e3b");g.addColorStop(.5,"#047857");g.addColorStop(1,"#022c22");
x.fillStyle=g;x.fillRect(0,0,800,800);x.strokeStyle="#fbbf24";x.lineWidth=12;x.strokeRect(20,20,760,760);

x.save();x.beginPath();x.arc(400,470,115,0,Math.PI*2);x.clip();

x.restore();x.beginPath();x.arc(400,470,115,0,Math.PI*2);x.strokeStyle="#fbbf24";x.lineWidth=6;x.stroke();
x.fillStyle="#fbbf24";x.font='bold 36px Hind';x.fillText(name,400,635);
if(phone){x.fillStyle="#a7f3d0";x.font="26px Hind";x.fillText(`संपर्क: ${phone}`,400,680);}
x.fillStyle="#fff";x.font="18px Hind";x.fillText("MeraGaov डिजिटल गाँव",400,740);
try{this.generatedBannerDataUrl=c.toDataURL("image/png");}catch(e){return alert("बैनर नहीं बना।");}
document.getElementById("bannerPreviewBox").innerHTML=`<div class="card" style="text-align:center"><b style="color:#047857">बैनर तैयार है!</b><br><img src="${this.generatedBannerDataUrl}" style="width:100%;max-width:300px;border-radius:12px;margin:8px 0"><br><a href="${this.generatedBannerDataUrl}" download="MeraGaov_Banner.png" class="btn-submit" style="display:inline-block;text-decoration:none;width:auto;background:#2563eb">📥 डाउनलोड करें</a></div>`;
alert(this.state.lang==="en"?"Banner created!":"बैनर बन गया!");
}

if(!this.state.isAdminLoggedIn&&!this.state.isSubAdminLoggedIn)return this.changeView("home");

let isEn = this.state.lang === "en";
let backText = isEn ? "← Home" : "← होम";
let filterVillage = this.state.isSubAdminLoggedIn ? this.state.loggedInSubAdminVillage : null;
let filterDistrict = this.state.isSubAdminLoggedIn ? this.state.loggedInSubAdminDistrict : null;

const globalPendingList=(arr,path,label)=>arr.filter(x=>{
if(filterVillage && x.villageHi !== filterVillage) return false;
if(filterDistrict && x.districtId !== filterDistrict) return false;
return x.status && x.status !== "approved";
}).map(x=>`<div class="media-card" style="border:2px solid #fbbf24;background:#fffbeb"><span class="service-tag" style="background:#fbbf24;color:#0f172a">⏳ Pending: ${label} | 📍 ${this.esc(x.villageHi||(isEn?"Village":"गाँव"))}</span><div class="service-name">${this.esc(x.title||x.message||x.name||x.sarpanch)}</div><div style="margin-top:8px"><button class="approve-btn" onclick="app.approveItem('${path}','${this.esc(x.id)}')">✅ Approve</button><button class="live-btn" onclick="app.makeItemLiveDirect('${path}','${this.esc(x.id)}')">🔴 Direct Live</button><button class="delete-btn" onclick="app.deleteItem('${path}','${this.esc(x.id)}')">❌ Delete</button></div></div>`).join("");

let adminPanelTools = "";

if(this.state.isAdminLoggedIn){
let subAdminListHtml = this.state.subAdmins.map(s=>`
  <div style="background:#fff;padding:8px 12px;border-radius:8px;border:1px solid #cbd5e1;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;">
    <div>
      <b style="color:#064e3b">${this.esc(s.name)}</b> (${this.esc(s.phone)})<br>
      <span style="font-size:12px;color:#d97706">📍 ${isEn?"Village":"गाँव"}: <b>${this.esc(s.village||s.villageHi||"N/A")}</b></span>
    </div>
    <button class="delete-btn" onclick="app.deleteSubAdmin('${this.esc(s.id)}')">🗑️ ${isEn?"Delete":"डिलीट"}</button>
  </div>
`).join("") || `<div class="empty-state" style="padding:10px">${isEn?"No sub-admins exist.":"कोई सब-एडमिन मौजूद नहीं है।"}</div>`;

adminPanelTools = `
<div class="card" style="background:#f0fdf4;border:2px solid #10b981;">
  <div class="card-title" style="color:#064e3b">⚙️ Main Admin Control</div>
  <div class="form-group">
    <label>${isEn?"Enter any village directly":"डायरेक्ट किसी भी गाँव में प्रवेश करें"}</label>
    <select class="form-control" id="adminDirectDistSelect" style="margin-bottom:8px" onchange="let d=this.value, s=document.getElementById('adminDirectVilSelect'); s.innerHTML=D[d]?D[d].villages.map(v=>\`<option value='\${v[0]}'>\${v[0]}</option>\`).join(''):'';">
      ${Object.keys(D).map(k=>`<option value="${k}">${D[k].nameHi}</option>`).join("")}
    </select>
    <select class="form-control" id="adminDirectVilSelect" style="margin-bottom:8px">
      ${D[this.state.selectedDistrict]?.villages.map(v=>`<option value="${v[0]}">${v[0]}</option>`).join("")}
    </select>
    <button class="btn-submit" style="background:#059669;margin-bottom:14px" onclick="app.adminDirectOpenVillage()">🚀 ${isEn?"Enter Village":"इस गाँव में प्रवेश करें"}</button>

    <label>${isEn?"Add New Village":"नया गाँव जोड़ें"} (${D[this.state.selectedDistrict]?.nameHi})</label>
    <input class="form-control" id="newVillageNameInput" placeholder="${isEn?"Village Name...":"गाँव का नाम..."}" style="margin-bottom:8px">
    <button class="btn-submit" style="background:#047857;margin-bottom:14px" onclick="app.addNewVillageToDistrict()">➕ ${isEn?"Add New Village":"नया गाँव जोड़ें"}</button>

    <hr style="border:0;border-top:1px solid #cbd5e1;margin:12px 0">

    <button class="btn-submit" style="background:#2563eb;margin-bottom:10px" onclick="app.toggleSubAdminForm()">➕ ${isEn?"Add New Sub-Admin":"नया Sub-Admin जोड़ें"}</button>
    
    <div id="subAdminFormContainer" style="display:none;background:#f8fafc;padding:12px;border-radius:10px;border:1px solid #cbd5e1;margin-bottom:14px">
      <label style="color:#064e3b;font-size:13px;font-weight:bold;margin-bottom:6px;display:block">${isEn?"Fill Sub-Admin Details:":"सब-एडमिन विवरण भरें:"}</label>
      <input class="form-control" id="subAdminNameInput" placeholder="${isEn?"Sub-Admin Name...":"सब-एडमिन का नाम..."}" style="margin-bottom:8px">
      <input class="form-control" id="subAdminPhoneInput" placeholder="${isEn?"10-Digit Mobile Number (for Chat)...":"10 अंकों का मोबाइल नंबर (Chat Access हेतु)..."}" style="margin-bottom:8px">
      <select class="form-control" id="subAdminDistSelect" style="margin-bottom:8px" onchange="let d=this.value, s=document.getElementById('subAdminVillageSelect'); s.innerHTML=D[d]?D[d].villages.map(v=>\`<option value='\${v[0]}'>\${v[0]}</option>\`).join(''):'';">
        ${Object.keys(D).map(k=>`<option value="${k}">${D[k].nameHi}</option>`).join("")}
      </select>
      <select class="form-control" id="subAdminVillageSelect" style="margin-bottom:8px">
        ${D[this.state.selectedDistrict]?.villages.map(v=>`<option value="${v[0]}">${v[0]}</option>`).join("")}
      </select>
      <input class="form-control" id="subAdminPwdInput" placeholder="${isEn?"Login Password...":"लॉगिन पासवर्ड..."}" style="margin-bottom:8px">
      <button class="btn-submit" style="background:#10b981" onclick="app.addNewSubAdmin()">💾 ${isEn?"Save Sub-Admin":"सब-एडमिन सुरक्षित करें"}</button>
    </div>

    <label style="margin-top:10px;margin-bottom:6px">👥 ${isEn?"Registered Sub-Admins List & Management:":"पंजीकृत सब-एडमिन लिस्ट व प्रबंधन:"}</label>
    ${subAdminListHtml}

  </div>
</div>`;
} else {
adminPanelTools = `
<div class="card" style="background:#eff6ff;border:2px solid #3b82f6;">
  <div class="card-title" style="color:#1d4ed8">🔑 Sub-Admin Dashboard</div>
  <p style="font-size:13px">${isEn?"You can manage data only for your assigned village":"आप केवल अपने निर्धारित गाँव"} <b>${this.esc(this.state.loggedInSubAdminVillage)}</b>.</p>
</div>`;
}

let pendingCombined = (
  globalPendingList(this.state.services,"services","Shop") +
  globalPendingList(this.state.announcements,"announcements","Announcement") +
  globalPendingList(this.state.greetings,"greetings","Greeting") +
  globalPendingList(this.state.market,"market","Market") +
  globalPendingList(this.state.feedbacks,"feedbacks","Feedback") +
  globalPendingList(this.state.khelKud,"khelKud","KhelKud")
);

let allManagedList = "";
if(this.state.isAdminLoggedIn){
let totalGlobalArr = [
  ...this.state.services.map(x=>({...x, pType:'services', lName:'Shop'})),
  ...this.state.announcements.map(x=>({...x, pType:'announcements', lName:'Announcement'})),
  ...this.state.market.map(x=>({...x, pType:'market', lName:'Market'})),
  ...this.state.greetings.map(x=>({...x, pType:'greetings', lName:'Greeting'}))
];

let isOpen = this.state.showGlobalManagedToggle;

allManagedList = `
<div class="card" style="margin-top:16px;background:#fefce8;border:2px solid #facc15;">
  <div class="card-title" style="color:#854d0e;cursor:pointer;margin-bottom:0" onclick="app.state.showGlobalManagedToggle=!app.state.showGlobalManagedToggle;app.render()">
    <span>🌐 ${isEn?"Global All-Village Data Management":"ग्लोबल ऑल-विलेज डेटा मैनेजमेंट (Global Managed)"}</span>
    <span>${isOpen ? (isEn?'▲ Hide':'▲ छुपाएं') : (isEn?'▼ Open':'▼ खोलें')}</span>
  </div>
  ${isOpen ? `
    <p style="font-size:12px;color:#713f12;margin:10px 0">${isEn?"Admin can view and control live data of all villages here:":"यहाँ से एडमिन सभी गाँवों का लाइव डेटा देख और कंट्रोल कर सकते हैं:"}</p>
    ${totalGlobalArr.map(x=>`
      <div class="media-card" style="background:#fff;border:1px solid #fde047;margin-bottom:10px">
        <span class="service-tag" style="background:#fef08a;color:#713f12">${x.lName} | 📍 ${this.esc(x.villageHi||(isEn?"Village":"गाँव"))}</span>
        <div class="service-name">${this.esc(x.title||x.message||x.name||"")}</div>
        ${x.imageUrl?`<img src="${this.esc(x.imageUrl)}" class="service-img">`:""}
        <div style="margin-top:6px;display:flex;gap:6px">
          <button class="live-btn" onclick="app.makeItemLiveDirect('${x.pType}','${this.esc(x.id)}')">🔴 Live</button>
          <button class="delete-btn" onclick="app.deleteItem('${x.pType}','${this.esc(x.id)}')">🗑️ Delete</button>
        </div>
      </div>
    `).join("") || `<div class="empty-state">${isEn?"No global data available.":"कोई ग्लोबल डेटा उपलब्ध नहीं है।"}</div>`}
  ` : ''}
</div>`;
}

let emptyPending = isEn ? "No pending requests right now. All data is approved." : "अभी कोई पेंडिंग रिक्वेस्ट नहीं है। सभी डेटा अप्रूव्ड हैं।";

return `<button class="back-btn" onclick="app.changeView('home')">${backText}</button>
<div class="card"><div class="card-title">📊 ${this.state.isAdminLoggedIn?"Main Admin Dashboard":"Sub-Admin Panel"}</div></div>
${adminPanelTools}
<h3 style="font-size:14px;color:#064e3b;margin:12px 0 8px">⏳ ${isEn?"Global Pending Requests for Approval":"अप्रूवल के लिए पेंडिंग रिक्वेस्ट्स (Global Pending Requests)"}:</h3>
${pendingCombined || `<div class="empty-state">${emptyPending}</div>`}
${allManagedList}
`;
}
render(){
let d=D[this.state.selectedDistrict];if(!d){this.state.selectedDistrict="charkhi-dadri";d=D[this.state.selectedDistrict];}
if(!this.state.searchVillage)this.state.searchVillage=d.villages[0]?.[0]||"";
let village=this.villageObj();
let display=village?(this.state.lang==="en"?village[1]:village[0]):this.state.searchVillage;

document.getElementById("headerVillageBadge").textContent="📍 "+display;
document.getElementById("headerUserAvatar").src=this.state.userAvatarUrl;
let headerInput = document.getElementById("headerUsernameInput");
if(headerInput && document.activeElement !== headerInput){
  headerInput.value = this.state.headerUsername;
}

localStorage.setItem("selectedDistrict",this.state.selectedDistrict);
if(this.state.searchVillage)localStorage.setItem("searchVillage",this.state.searchVillage);
this.updateTicker();

let dashBannerEl=document.getElementById("villageDashboardBannerContainer");
let isEn = this.state.lang === "en";
if(!this.state.villageLocked){
dashBannerEl.innerHTML="";
let dsOptions=Object.keys(D).map(k=>`<option value="${k}" ${k===this.state.selectedDistrict?"selected":""}>${this.esc(isEn?D[k].nameEn:D[k].nameHi)}</option>`).join("");
let curD=D[this.state.selectedDistrict]||D["charkhi-dadri"];
let vilOptions=curD.villages.map(v=>`<option value="${this.esc(v[0])}">${this.esc(isEn?v[1]:v[0])}</option>`).join("");
let html=`<div class="card" style="background:#f0fdf4;border:2px solid #10b981;text-align:center"><div class="card-title" style="justify-content:center;color:#064e3b">🏡 ${isEn?"Select Your Village":"अपना गाँव चुनें"}</div><div class="form-group" style="text-align:left"><label>${isEn?"District":"जिला"}</label><select class="form-control" id="setupDistrictSelect" onchange="app.state.selectedDistrict=this.value;app.state.searchVillage='';app.render()">${dsOptions}</select></div><div class="form-group" style="text-align:left"><label>${isEn?"Village":"गाँव"}</label><select class="form-control" id="setupVillageSelect">${vilOptions}</select></div><button class="btn-submit" style="background:#059669;padding:12px;margin-top:8px" onclick="app.lockUserVillage()">🔒 ${isEn?"Lock Village":"गाँव लॉक करें"}</button></div>`;
document.getElementById("mainContent").innerHTML=html;
return;
}else{
let approvedGreetings=this.state.greetings.filter(x=>x.status==="approved"&&x.villageHi===this.state.searchVillage&&x.imageUrl);
let bannerImg=approvedGreetings.length>0?approvedGreetings[0].imageUrl:"https://images.unsplash.com/photo-1500382017468-9049fed747ef?w=600&auto=format&fit=crop";
dashBannerEl.innerHTML=`<div class="village-banner-dash" onclick="document.getElementById('dashBannerImageInput').click()" style="cursor:pointer"><b>🌟 ${this.esc(display)} ${isEn?"Digital Dashboard":"डिजिटल डैशबोर्ड"}</b><img src="${bannerImg}"></div>`;
}

let html="";
if(this.state.view==="home"){
html=`<div class="menu-card-small" onclick="app.changeView('allVillageMarket')">🌐 ${isEn?"All Village (Open Market)":"All Village (ओपन बाज़ार)"} →</div>
<div class="menu-card bg-1" onclick="app.changeView('list')">🛒 1. ${isEn?"Shop & Service Market":"दुकान और सेवा बाजार"} →</div>
<div class="menu-card bg-2" onclick="app.changeView('announcements')">📢 2. ${isEn?"Announcements & News":"मुनादी व जरूरी खबरें"} →</div>
<div class="menu-card bg-3" onclick="app.changeView('greetings')">🎉 3. ${isEn?"Festivals & Greetings":"त्यौहार व बधाई संदेश"} →</div>
<div class="menu-card bg-4" onclick="app.changeView('market')">🚜 4. ${isEn?"Marketplace (Buy-Sell)":"खरीद-बिक्री बाज़ार"} →</div>
<div class="menu-card bg-5" onclick="app.changeView('khelkud')">🏆 5. ${isEn?"Sports (Kabaddi / Wrestling)":"खेल-कूद (कबड्डी / कुश्ती)"} →</div>
<div class="menu-card bg-8" onclick="app.changeView('sarpanch')">🏛️ 6. ${isEn?"Sarpanch, Wards & Population":"सरपंच, वार्ड व आबादी विवरण"} →</div>
<div class="menu-card bg-6" onclick="app.changeView('historyGallery')">📸 7. ${isEn?"Village History & Gallery":"गाँव का इतिहास और गैलरी"} →</div>
<div class="menu-card bg-5" onclick="app.changeView('chaupal')">💬 8. Admin Chat Room →</div>
<div class="menu-card bg-7" onclick="app.changeView('jokes')">😂 ${isEn?"Joke of the Day":"चुटकुला ऑफ़ द डे"} →</div>`;
}else if(this.state.view==="list"){html=this.renderForm({title:isEn?"🛒 Shop & Service Market":"🛒 दुकान और सेवा बाजार",type:"shop"});
}else if(this.state.view==="announcements"){html=this.renderForm({title:isEn?"📢 Announcements & News":"📢 मुनादी व जरूरी खबरें",type:"announcement"});
}else if(this.state.view==="greetings"){html=this.renderForm({title:isEn?"🎉 Festivals & Greetings":"🎉 त्यौहार व बधाई संदेश",type:"greeting"});
}else if(this.state.view==="market"){html=this.renderForm({title:isEn?"🚜 Marketplace (Buy-Sell)":"🚜 खरीद-बिक्री बाज़ार",type:"market"});
}else if(this.state.view==="khelkud"){html=this.renderForm({title:isEn?"🏆 Sports (Kabaddi / Wrestling)":"🏆 खेल-कूद (कबड्डी / कुश्ती)",type:"khelkud"});
}else if(this.state.view==="historyGallery"){html=this.renderForm({title:isEn?"📸 Village History & Gallery":"📸 गाँव का इतिहास और गैलरी",type:"history"});
}else if(this.state.view==="sarpanch"){html=this.renderForm({title:isEn?"🏛️ Sarpanch, Wards & Population":"🏛️ सरपंच, वार्ड व आबादी विवरण",type:"sarpanch"});
}else if(this.state.view==="allVillageMarket"){html=this.renderAllVillageMarket();
}else if(this.state.view==="jokes"){html=this.renderJokes();
}else if(this.state.view==="chaupal"){html=this.renderChat();
}else if(this.state.view==="feedback"){html=this.renderFeedbackForm();
}else if(this.state.view==="policy"){html=`<button class="back-btn" onclick="app.changeView('home')">${isEn?"← Home":"← होम"}</button>
<div class="card">
<div class="card-title">📜 Privacy Policy & Legal Disclaimer</div>
<div class="policy-text">
<p><b>1. ${isEn?"Public Platform":"सार्वजनिक मंच (Public Platform)"}:</b><br>${isEn?"MeraGaov is a public platform where rural citizens share local information, shops, buy-sell posts, and thoughts.":"MeraGaov एक सार्वजनिक मंच है जहाँ ग्रामीण नागरिक अपनी स्थानीय जानकारी, दुकानें, खरीद-बिक्री और विचार साझा करते हैं।"}</p><br>
<p><b>2. ${isEn?"Disclaimer":"कानूनी दायित्व से मुक्ति (Disclaimer)"}:</b><br>${isEn?"No responsibility is taken for content posted by any user on this platform. The responsibility of all posts lies with the respective user.":"इस प्लेटफ़ॉर्म पर किसी भी यूजर द्वारा पोस्ट की गई सामग्री के लिए कोई उत्तरदायित्व नहीं है। समस्त पोस्ट की जिम्मेदारी संबंधित यूजर की होगी।"}</p><br>
<p><b>3. ${isEn?"Admin Rights":"एडमिन के अधिकार"}:</b><br>${isEn?"Admin reserves the right to remove offensive posts.":"एडमिन के पास आपत्तिजनक पोस्ट हटाने का अधिकार सुरक्षित है।"}</p>
</div>
</div>`;
}else if(this.state.view==="about"){html=`<button class="back-btn" onclick="app.changeView('home')">${isEn?"← Home":"← होम"}</button><div class="card"><div class="card-title">ℹ️ About Us</div><div style="font-size:13px;line-height:1.7;color:#334155"><h3 style="color:#064e3b;margin-bottom:8px">MeraGaov - मेरी पहचान</h3><p><b>${isEn?"One Digital Village, One Digital Identity":"एक डिजिटल गाँव, एक डिजिटल पहचान"}</b></p></div></div>`;
}else if(this.state.view==="admin"){html=this.renderAdmin();}
document.getElementById("mainContent").innerHTML=html;
}
}
let app;try{app=new VillageApp();}catch(e){console.error(e);document.getElementById("splashScreen")?.remove();document.getElementById("mainContent").innerHTML=`<div class="card" style="text-align:center;border:2px solid #dc2626"><h3 style="color:#dc2626">⚠️ समस्या</h3><p style="font-size:13px;margin-top:8px">${String(e.message||e)}</p></div>`;}
</script>
