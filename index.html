<script>
const D={
"charkhi-dadri":{nameHi:"चरखी दादरी",nameEn:"Charkhi Dadri",villages:[["मालकोश","Malkosh"],["बाउंड","Baund"],["झूझू कलाँ","Jhujhu Kalan"],["पैडवा","Paidwa"],["बल्हा","Balha"],["मान्धी","Mandhi"],["मंसूरवास","Mansoorwas"],["अचैरा","Achaira"],["बडराई","Badrai"],["कोहला","Kohla"],["भागवी","Bhagvi"],["मटौर","Mataur"]]},
"rohtak":{nameHi:"रोहतक",nameEn:"Rohtak",villages:[["महम","Meham"],["कलानौर","Kalanaur"],["स्माइला","Smaila"],["निंदाना","Nindana"],["सांपला","Sampla"]]},
"hansi":{nameHi:"हाँसी",nameEn:"Hansi",villages:[["हाँसी शहर","Hansi City"],["सिसई","Sisai"],["उमरा","Umra"]]},
"rewari":{nameHi:"रेवाड़ी",nameEn:"Rewari",villages:[["बावल","Bawal"],["कोसली","Kosli"]]},
"bhiwani":{nameHi:"भिवानी",nameEn:"Bhiwani",villages:[["भिवानी शहर","Bhiwani City"],["लोहारू","Loharu"],["सिवानी","Siwani"],["बाढड़ा","Badhra"]]},
"hisar":{nameHi:"हिसार",nameEn:"Hisar",villages:[["हिसार शहर","Hisar City"],["बरवाला","Barwala"],["नारनौंद","Narnaund"],["हांसी रोड","Hansiwala"]]},
"panipat":{nameHi:"पानीपत",nameEn:"Panipat",villages:[["पानीपत शहर","Panipat City"],["समालखा","Samalkha"],["सनौली","Sanauli"],["इन्द्रगढ़","Indragarh"]]}
};
const jokesList=[
"तऊ बोला: बेटा अंग्रेजी में 'Apple' ने के कह्या करें? पोता: सेब तऊ! तऊ: बेबे के फूंके मारै है, मन्ने अंग्रेजी पूछ् राखी थी!",
"एक हरियाणवी छोरा अंग्रेजी बोलन लाग्या: 'I want a glass of water.' दूजा बोला: 'भाई, बाल्टी भरकै पी ले, अंग्रेजी झाड़ण की जरूरत कोन्या!'",
"मास्टर: बता यो 'Honesty is the best policy' का हिंदी अनुवाद कै होवै है? छात्र: मास्टर जी, ईमानदारी सबतै बढ़िया ठेकेदारी सै!",
"ताया ताश खेलने बैठ्या और बोला: 'पत्ता फेंकण तै पैल्या राम का नाम लेवियो!' दूजा बोला: 'तऊ, ताश में ना, किस्मत काम आया करै!'",
"पत्नी: जी सुणो हो, मन्ने सपने में राजकुमार मिल्या! पति: अच्छा, फेर कसूती कुटाई कोन्या करी उसनें तेरी?"
];
const avatarDefault="https://cdn-icons-png.flaticon.com/512/3135/3135715.png";
class VillageApp{
constructor(){
this.loadCustomVillages();
this.state={
lang:"hi",view:"home",
selectedDistrict:localStorage.getItem("selectedDistrict")||"charkhi-dadri",
searchVillage:localStorage.getItem("searchVillage")||"",
userVillage:localStorage.getItem("userVillage")||"",
userDistrict:localStorage.getItem("userDistrict")||"",
villageLocked:localStorage.getItem("villageLocked")==="true",
services:[],announcements:[],greetings:[],market:[],historyGallery:[],sarpanchDetails:[],chaupalMessages:[],feedbacks:[],khelKud:[],
allowedChatUsers:{},subAdmins:[],villagesConfig:{},villageUnlockRequests:{},
userAvatarUrl:localStorage.getItem("userCustomAvatar")||avatarDefault,
isAdminLoggedIn:false,isSubAdminLoggedIn:false,
loggedInSubAdminVillage:"",loggedInSubAdminDistrict:"",loggedInSubAdminName:"",loggedInSubAdminPhone:"",
currentUserPhone:localStorage.getItem("currentUserPhone")||""
};
this.tempImage="";this.tempMedia="";this.tempMediaType="image";this.generatedBannerDataUrl="";this.bannerUserPhotoObj=null;this.unreadMessageCount=0;
this.listeners();this.firebase();this.render();this.startup();
}
esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");}
status(t){
let e=document.getElementById("firebaseStatus");if(!e)return;
e.textContent=t;e.style.display="block";clearTimeout(this.st);
this.st=setTimeout(()=>e.style.display="none",3500);
}
villageObj(){
let d=D[this.state.selectedDistrict];
return d?.villages.find(v=>v[0]===this.state.searchVillage||v[1]===this.state.searchVillage);
}
hasSubAdminForCurrentVillage(){
return this.state.subAdmins.some(s=>s.village===this.state.searchVillage&&s.districtId===this.state.selectedDistrict);
}
isAdminForVillage(v){
if(this.state.isAdminLoggedIn)return true;
if(this.state.isSubAdminLoggedIn){return this.state.loggedInSubAdminVillage===v&&this.state.loggedInSubAdminDistrict===this.state.selectedDistrict;}
return false;
}
startup(){
setTimeout(()=>{let s=document.getElementById("splashScreen");if(s){s.style.opacity=0;setTimeout(()=>s.remove(),500);}},1000);
}
loadCustomVillages(){
try{
let x=JSON.parse(localStorage.getItem("customDistrictVillages")||"{}");
Object.keys(x).forEach(k=>{
if(!D[k])return;
x[k].forEach(v=>{if(!D[k].villages.some(a=>a[0]===v[0]))D[k].villages.push(v);});
});
}catch(e){console.error(e);}
}
listeners(){
document.getElementById("menuToggleBtn").onclick=e=>{
e.stopPropagation();let m=document.getElementById("dropdownMenu");m.style.display=m.style.display==="block"?"none":"block";
};
document.addEventListener("click",()=>{let m=document.getElementById("dropdownMenu");if(m)m.style.display="none";});
document.getElementById("langToggleBtn").onclick=()=>{
this.state.lang=this.state.lang==="hi"?"en":"hi";
document.getElementById("langToggleBtn").textContent=this.state.lang==="hi"?"🌐 English":"🌐 हिंदी";
this.render();
};
window.addEventListener("firebase-ready",()=>this.setupFirebase());
window.addEventListener("firebase-error",()=>this.status("⚠️ Firebase connect नहीं हुआ"));
}
firebase(){
if(window.firebaseDb)return this.setupFirebase();
let n=0,wait=()=>{
if(window.firebaseDb)return this.setupFirebase();
if(++n<30)setTimeout(wait,250);else this.status("⚠️ Firebase उपलब्ध नहीं है");
};
wait();
}
setupFirebase(){
if(this.firebaseStarted||!window.firebaseDb)return;
this.firebaseStarted=true;
const {db,ref,onValue}=window.firebaseDb;
const listen=(path,fn)=>onValue(ref(db,path),s=>fn(s.val()),e=>console.error(path,e));
const load=(key,val)=>{
this.state[key]=val?Object.keys(val).map(k=>({id:k,...val[k]})).reverse():[];
if(["list","announcements","greetings","market","historyGallery","sarpanchDetails","admin","feedback","khelKud","allVillageMarket"].includes(this.state.view))this.render();
this.updateTicker();
};
listen("services",v=>load("services",v));
listen("announcements",v=>load("announcements",v));
listen("market",v=>load("market",v));
listen("greetings",v=>load("greetings",v));
listen("historyGallery",v=>load("historyGallery",v));
listen("sarpanchDetails",v=>load("sarpanchDetails",v));
listen("feedbacks",v=>load("feedbacks",v));
listen("khelKud",v=>load("khelKud",v));
listen("chaupalMessages",v=>{
let a=v?Object.keys(v).map(k=>({id:k,...v[k]})).reverse():[];
if(this.state.view!=="chaupal"&&a.length>this.state.chaupalMessages.length){this.unreadMessageCount+=a.length-this.state.chaupalMessages.length;}
this.state.chaupalMessages=a;
if(["home","chaupal"].includes(this.state.view))this.render();
});
listen("allowedChatUsers",v=>{this.state.allowedChatUsers=v||{};if(["chaupal","admin"].includes(this.state.view))this.render();});
listen("subAdmins",v=>{this.state.subAdmins=v?Object.keys(v).map(k=>({id:k,...v[k]})):[];if(this.state.view==="admin"||this.state.view==="home")this.render();});
listen("villages_config",v=>{this.state.villagesConfig=v||{};if(this.state.view==="admin"||this.state.view==="home")this.render();});
listen("villageUnlockRequests",v=>{
this.state.villageUnlockRequests=v||{};
let phone=this.state.currentUserPhone||localStorage.getItem("currentUserPhone")||this.state.userPhone||"";
if(phone&&v&&v[phone]&&v[phone].status==="approved"){
this.state.villageLocked=false;
localStorage.removeItem("villageLocked");localStorage.removeItem("userVillage");localStorage.removeItem("userDistrict");
this.state.userVillage="";this.state.userDistrict="";
}
if(this.state.view==="admin")this.render();
});
}
updateTicker(){
let e=document.getElementById("dynamicTickerText");
if(e){
let base=this.state.lang==="en"? "🌾 Mustard: ₹5,400/Quintal | 🌾 Wheat: ₹2,425/Quintal | 🌤️ Weather: Normal" : "🌾 सरसों: ₹5,400/क्विंटल | 🌾 गेहूं: ₹2,425/क्विंटल | 🌤️ मौसम: सामान्य";
let items=[...this.state.announcements.filter(x=>x.status==="approved"&&x.showOnTicker&&x.villageHi===this.state.searchVillage),...this.state.greetings.filter(x=>x.status==="approved"&&x.showOnTicker&&x.villageHi===this.state.searchVillage),...this.state.services.filter(x=>x.status==="approved"&&x.showOnTicker&&x.villageHi===this.state.searchVillage)].map(x=>x.villageHi?`📍 ${x.villageHi}: ${x.title||x.message||x.name}`:(x.title||x.message||x.name)).filter(Boolean).join(" | ");
e.textContent=items?`${items} | ${base}`:base;
}
}
changeUserAvatar(input){
let f=input?.files?.[0];if(!f||!f.type.startsWith("image/"))return alert(this.state.lang==="en"?"Please select an image only.":"केवल फोटो चुनें।");
if(f.size>2*1024*1024)return alert(this.state.lang==="en"?"Keep image smaller than 2 MB.":"फोटो 2 MB से छोटी रखें।");
let r=new FileReader();
r.onload=()=>{this.state.userAvatarUrl=r.result;localStorage.setItem("userCustomAvatar",r.result);document.getElementById("headerUserAvatar").src=r.result;alert(this.state.lang==="en"?"Profile photo updated!":"प्रोफाइल फोटो बदल दी गई!");};
r.readAsDataURL(f);
}
updateDashboardBannerPhoto(input){
let f=input?.files?.[0];if(!f||!f.type.startsWith("image/"))return alert(this.state.lang==="en"?"Please select an image only.":"केवल फोटो चुनें।");
if(f.size>2*1024*1024)return alert(this.state.lang==="en"?"Keep image smaller than 2 MB.":"फोटो 2 MB से छोटी रखें।");
let r=new FileReader();
r.onload=()=>{
let imgUrl=r.result;
this.saveData("greetings",{name:this.state.isSubAdminLoggedIn?this.state.loggedInSubAdminName:"Admin",phone:"",message:`🌟 ${this.state.searchVillage} ${this.state.lang==="en"?"Digital Dashboard Special Banner":"डिजिटल डैशबोर्ड स्पेशल बैनर"}`,imageUrl:imgUrl,showOnTicker:true},this.state.lang==="en"?"Dashboard banner photo successfully changed!":"डैशबोर्ड बैनर फोटो सफलतापूर्वक बदल दी गई!");
};
r.readAsDataURL(f);
}
requestAdminAccess(){
let p=prompt(this.state.lang==="en"?"Enter Admin Password:":"एडमिन पासवर्ड दर्ज करें:");
if(p==="1234"){this.state.isAdminLoggedIn=true;this.state.isSubAdminLoggedIn=false;this.changeView("admin");}else alert(this.state.lang==="en"?"Wrong Password!":"गलत पासवर्ड!");
}
requestSubAdminAccess(){
let p=prompt(this.state.lang==="en"?"Enter Sub-Admin Password:":"सब-एडमिन पासवर्ड दर्ज करें:");
let s=this.state.subAdmins.find(x=>String(x.pwd)===p);
if(!s)return alert(this.state.lang==="en"?"Wrong Password!":"गलत पासवर्ड!");
this.state.isSubAdminLoggedIn=true;this.state.isAdminLoggedIn=false;
this.state.loggedInSubAdminVillage=s.village||s.villageHi||"";
this.state.loggedInSubAdminDistrict=s.districtId||s.district||"";
this.state.loggedInSubAdminName=s.name||"Sub-Admin";
this.state.loggedInSubAdminPhone=s.phone||"";
if(s.districtId&&D[s.districtId])this.state.selectedDistrict=s.districtId;
this.state.searchVillage=this.state.loggedInSubAdminVillage;
this.changeView("admin");
}
changeView(v){this.state.view=v;if(v==="chaupal")this.unreadMessageCount=0;this.render();}
saveData(path,data,msg,extra={}){
if(!window.firebaseDb)return alert(this.state.lang==="en"?"Firebase not connected yet.":"Firebase अभी कनेक्ट नहीं है।");
let {db,ref,push}=window.firebaseDb;

let hasSub=this.hasSubAdminForCurrentVillage();
let autoStatus = (this.state.isAdminLoggedIn || this.state.isSubAdminLoggedIn) ? "approved" : (hasSub ? "pending_subadmin" : "pending");
let statusMsg = (this.state.isAdminLoggedIn || this.state.isSubAdminLoggedIn) ? (this.state.lang==="en"?"Successfully made live!":"सफलतापूर्वक लाइव कर दिया गया!") : (hasSub ? (this.state.lang==="en"?"Sent to village sub-admin for approval!":"गाँव के सब-एडमिन के पास अप्रूवल के लिए भेज दिया गया है!") : (this.state.lang==="en"?"Sent to admin for approval!":"एडमिन के पास भेज दिया गया है!"));

push(ref(db,path),{...data,...extra,districtId:this.state.selectedDistrict,villageHi:this.state.searchVillage,status:autoStatus,timestamp:Date.now()})
.then(()=>{alert(statusMsg||msg);this.tempImage="";this.tempMedia="";this.changeView("home");})
.catch(e=>alert("Firebase Error: "+e.message));
}
approveItem(path,id){
if(!window.firebaseDb)return alert("Firebase कनेक्ट नहीं है।");
let {db,ref,update}=window.firebaseDb;
update(ref(db,`${path}/${id}`),{status:"approved"}).then(()=>{alert(this.state.lang==="en"?"Successfully approved!":"सफलतापूर्वक अप्रूव हो गया!");this.render();}).catch(e=>alert(e.message));
}
makeItemLiveDirect(path,id){
if(!this.isAdminForVillage(this.state.searchVillage) && !this.state.isAdminLoggedIn)return alert(this.state.lang==="en"?"Only admin or sub-admin can make this live directly!":"केवल एडमिन या सब-एडमिन इसे डायरेक्ट लाइव कर सकते हैं!");
if(!window.firebaseDb)return alert("Firebase कनेक्ट नहीं है।");
let {db,ref,update}=window.firebaseDb;
update(ref(db,`${path}/${id}`),{status:"approved",showOnTicker:true}).then(()=>{alert(this.state.lang==="en"?"Successfully made live directly!":"सफलतापूर्वक डायरेक्ट लाइव कर दिया गया!");this.render();}).catch(e=>alert(e.message));
}
deleteItem(path,id){
if(!confirm(this.state.lang==="en"?"Do you want to delete?":"डिलीट करना चाहते हैं?")||!window.firebaseDb)return;
let {db,ref,remove}=window.firebaseDb;
remove(ref(db,`${path}/${id}`)).then(()=>this.render()).catch(e=>alert(e.message));
}

.then(()=>{alert(this.state.lang==="en"?"Your feedback has been sent!":"आपकी शिकायत/फीडबैक भेज दी गई है!");this.changeView("home");})

submitKhelKud(){

addSubAdminConfig(){
let d=document.getElementById("subAdminDist").value,name=document.getElementById("subAdminName")?.value.trim()||"",phone=document.getElementById("subAdminPhone")?.value.trim()||"",v=document.getElementById("subAdminVillage").value.trim(),p=document.getElementById("subAdminPwd").value.trim();
if(!v||!p)return alert(this.state.lang==="en"?"Please fill village and password!":"गाँव और पासवर्ड भरें!");

push(ref(db,"subAdmins"),{districtId:d,name,phone,village:v,pwd:p,timestamp:Date.now()}).then(()=>{if(phone&&p)set(ref(db,"allowedChatUsers/"+phone),p);alert(this.state.lang==="en"?"Sub-admin added successfully!":"सब-एडमिन सफलतापूर्वक जोड़ दिया गया!");this.render();}).catch(e=>alert(e.message));

deleteSubAdmin(id){if(confirm("सब-एडमिन हटाना चाहते हैं?")&&window.firebaseDb)window.firebaseDb.remove(window.firebaseDb.ref(window.firebaseDb.db,"subAdmins/"+id)).then(()=>this.render());}
addNewVillageToDistrict(){
let e=document.getElementById("newVillageNameInput"),v=e?.value.trim(),d=this.state.selectedDistrict;
if(!v)return alert(this.state.lang==="en"?"Enter village name!":"गाँव का नाम डालें!");
if(!D[d])return;
if(D[d].villages.some(x=>x[0]===v||x[1]===v))return alert(this.state.lang==="en"?"Village already exists!":"यह गाँव पहले से मौजूद है!");
let x=[v,v];D[d].villages.push(x);
let all=JSON.parse(localStorage.getItem("customDistrictVillages")||"{}");
(all[d]??=[]).push(x);
localStorage.setItem("customDistrictVillages",JSON.stringify(all));
this.state.searchVillage=v;e.value="";
alert(this.state.lang==="en"?`New village "${v}" added!`:`नया गाँव "${v}" सफलतापूर्वक जोड़ दिया गया है!`);
this.render();
}
adminDirectOpenVillage(){
if(!this.state.isAdminLoggedIn)return alert(this.state.lang==="en"?"Only Main Admin has permission!":"केवल Main Admin अनुमति रखता है!");
let selDist=document.getElementById("adminDirectDistSelect")?.value,selVil=document.getElementById("adminDirectVilSelect")?.value;
if(!selDist||!D[selDist]||!selVil)return alert(this.state.lang==="en"?"Select valid district and village!":"सही जिला और गाँव चुनें!");
this.state.selectedDistrict=selDist;this.state.searchVillage=selVil;this.state.villageLocked=true;
localStorage.setItem("selectedDistrict",selDist);localStorage.setItem("searchVillage",selVil);localStorage.setItem("villageLocked","true");
alert(`Admin Mode On\nDistrict: ${D[selDist].nameHi}\nVillage: ${selVil}`);
this.changeView("home");
}
handleImage(input){
let f=input?.files?.[0];if(!f||!f.type.startsWith("image/"))return alert(this.state.lang==="en"?"Please select an image only.":"केवल फोटो चुनें।");
if(f.size>2*1024*1024)return alert(this.state.lang==="en"?"Keep image smaller than 2 MB.":"फोटो 2 MB से छोटी रखें।");
let r=new FileReader();
r.onload=()=>{this.tempImage=r.result;alert(this.state.lang==="en"?"Image selected!":"फोटो चुन ली गई है!");};
r.readAsDataURL(f);
}
handleBannerUserPhoto(input){
let f=input?.files?.[0];if(!f||!f.type.startsWith("image/"))return alert("केवल फोटो चुनें।");
if(f.size>2*1024*1024)return alert("फोटो 2 MB से छोटी रखें।");
let r=new FileReader();r.onload=()=>{let img=new Image();img.onload=()=>{this.bannerUserPhotoObj=img;alert(this.state.lang==="en"?"Photo ready for banner!":"फोटो बैनर के लिए तैयार है!");};img.src=r.result;};r.readAsDataURL(f);
}
handleHistoryGalleryMedia(input){
let f=input?.files?.[0];if(!f||(!f.type.startsWith("image/")&&!f.type.startsWith("video/")))return alert("फोटो या वीडियो चुनें।");
if(f.size>5*1024*1024)return alert("5 MB से छोटा रखें।");
this.tempMediaType=f.type.startsWith("video")?"video":"image";
let r=new FileReader();r.onload=()=>{this.tempMedia=r.result;alert(this.state.lang==="en"?"Media selected!":"मीडिया चुन लिया गया!");};r.readAsDataURL(f);
}
wrapText(ctx,text,x,y,max,lineH){
let words=String(text).split(/\s+/),line="";
for(let w of words){let t=line?line+" "+w:w;if(ctx.measureText(t).width>max&&line){ctx.fillText(line,x,y);line=w;y+=lineH;}else line=t;}
if(line)ctx.fillText(line,x,y);
}
generateGreetingBannerCanvas(){
let name=document.getElementById("gName")?.value.trim(),phone=document.getElementById("gPhone")?.value.trim(),msg=document.getElementById("gMsg")?.value.trim();
if(!name||!msg)return alert(this.state.lang==="en"?"Please fill name and greeting message!":"नाम और बधाई संदेश भरें!");
let c=document.createElement("canvas");c.width=800;c.height=800;let x=c.getContext("2d");
let g=x.createLinearGradient(0,0,800,800);g.addColorStop(0,"#064e3b");g.addColorStop(.5,"#047857");g.addColorStop(1,"#022c22");
x.fillStyle=g;x.fillRect(0,0,800,800);x.strokeStyle="#fbbf24";x.lineWidth=12;x.strokeRect(20,20,760,760);
x.textAlign="center";x.fillStyle="#fbbf24";x.font='bold 36px Hind';x.fillText(`🌾 MeraGaov - ${this.state.searchVillage} 🌾`,400,80);
x.fillStyle="#ffffff22";x.fillRect(60,115,680,210);x.fillStyle="#fff";x.font='bold 30px Hind';this.wrapText(x,msg,400,170,620,40);
x.save();x.beginPath();x.arc(400,470,115,0,Math.PI*2);x.clip();
if(this.bannerUserPhotoObj)x.drawImage(this.bannerUserPhotoObj,285,355,230,230);else{x.fillStyle="#064e3b";x.font="70px sans-serif";x.fillText("👤",400,495);}
x.restore();x.beginPath();x.arc(400,470,115,0,Math.PI*2);x.strokeStyle="#fbbf24";x.lineWidth=6;x.stroke();
x.fillStyle="#fbbf24";x.font='bold 36px Hind';x.fillText(name,400,635);
if(phone){x.fillStyle="#a7f3d0";x.font="26px Hind";x.fillText(`${this.state.lang==="en"?"Contact":"संपर्क"}: ${phone}`,400,680);}
x.fillStyle="#fff";x.font="18px Hind";x.fillText("MeraGaov",400,740);
try{this.generatedBannerDataUrl=c.toDataURL("image/png");}catch(e){return alert("बैनर नहीं बना।");}
document.getElementById("bannerPreviewBox").innerHTML=`<div class="card" style="text-align:center"><b style="color:#047857">${this.state.lang==="en"?"Banner is ready!":"बैनर तैयार है!"}</b><br><img src="${this.generatedBannerDataUrl}" style="width:100%;max-width:300px;border-radius:12px;margin:8px 0"><br><a href="${this.generatedBannerDataUrl}" download="MeraGaov_Banner.png" class="btn-submit" style="display:inline-block;text-decoration:none;width:auto;background:#2563eb">${this.state.lang==="en"?"📥 Download":"📥 डाउनलोड करें"}</a></div>`;
alert(this.state.lang==="en"?"Banner created!":"बैनर बन गया!");
}

requestVillageUnlock(){
let phone=prompt("गाँव बदलने के लिए अपना मोबाइल नंबर दर्ज करें:");

listItems(arr,type){
let isEn = this.state.lang === "en";
return arr.filter(x=>x.status==="approved"&&x.districtId===this.state.selectedDistrict&&x.villageHi===this.state.searchVillage).map(x=>`
<div class="service-item">
<span class="service-tag">${this.esc(x.category||x.itemType||type)}</span>
<div class="service-name">${this.esc(x.title||x.message||x.name||x.sarpanch||"")}</div>
${x.player?`<p style="font-size:12px;color:#064e3b"><b>${isEn?"Player":"खिलाड़ी"}:</b> ${this.esc(x.player)}</p>`:""}
${x.sarpanch?`<p style="font-size:12px;color:#064e3b"><b>${isEn?"Sarpanch":"सरपंच"}:</b> ${this.esc(x.sarpanch)}</p>`:""}
${x.name&&type!=="Sarpanch"&&type!=="Feedback"?`<p style="font-size:11px;color:#047857"><b>${isEn?"Name":"नाम"}:</b> ${this.esc(x.name)}${x.phone?` | <b>${isEn?"Phone":"फोन"}:</b> ${this.esc(x.phone)}`:""}</p>`:""}
${x.imageUrl?`<img src="${this.esc(x.imageUrl)}" class="service-img">`:""}
${x.phone&&type==="Market"?`<a href="tel:${this.esc(x.phone)}" class="btn-call">📞 ${isEn?"Contact":"संपर्क करें"}</a>`:""}
<div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:6px">
${this.isAdminForVillage(this.state.searchVillage)?`<button class="live-btn" onclick="app.makeItemLiveDirect('${type==="Shop"?"services":type==="Announcement"?"announcements":type==="Greeting"?"greetings":type==="Market"?"market":type==="Sarpanch"?"sarpanchDetails":type==="KhelKud"?"khelKud":"historyGallery"}','${this.esc(x.id)}')">🔴 Live</button>`:""}
${this.isAdminForVillage(this.state.searchVillage)?`<button class="delete-btn" onclick="app.deleteItem('${type==="Shop"?"services":type==="Announcement"?"announcements":type==="Greeting"?"greetings":type==="Market"?"market":type==="Sarpanch"?"sarpanchDetails":type==="KhelKud"?"khelKud":"historyGallery"}','${this.esc(x.id)}')">🗑️ Delete</button>`:""}
</div>
</div>`).join("");
}
renderForm(view){
let d=this.state.searchVillage;
let isEn = this.state.lang === "en";
let html=`<button class="back-btn" onclick="app.changeView('home')">← ${isEn?"Home":"होम"}</button><div class="card"><div class="card-title">${view.title}<span>📍 ${this.esc(d)}</span></div>`;
if(view.type==="shop"){
html+=`<div class="live-upload-box"><input class="form-control" id="sName" placeholder="${isEn?"Name / Shop Name...":"नाम / दुकान का नाम..."}" style="margin-bottom:8px"><input class="form-control" id="sPhone" placeholder="${isEn?"Mobile Number...":"मोबाइल नंबर..."}" style="margin-bottom:8px">
<select class="form-control" id="sCat" style="margin-bottom:8px">
    <option value="mistri">🛠️ ${isEn?"Mistri / Artisan":"मिस्त्री / कारीगर"}</option>
    <option value="dukan">🏥 ${isEn?"Shop / CSC":"दुकान / सीएसएसी"}</option>
    <option value="kirana">🛒 ${isEn?"Kirana Store":"किराना स्टोर"}</option>
    <option value="krishi">🌾 ${isEn?"Agriculture & Seeds":"कृषि व खाद-बीज"}</option>
    <option value="medical">💊 ${isEn?"Health / Medical":"स्वास्थ्य / मेडिकल"}</option>
    <option value="other">📦 ${isEn?"Other":"अन्य"}</option>
</select>
