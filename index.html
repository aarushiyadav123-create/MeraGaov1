const DICT = {

    appTitle: "मेरा गाँव - मेरा हरियाणा (Live Portal)",
    ticker: "🌾 सरसों: ₹5,400/क्विंटल | 🌾 गेहूँ: ₹2,425/क्विंटल | 🌤️ लाइव मौसम: Haryana - तापमान सामान्य व साफ़ आसमान | 📢 सभी गाँवों के लिए लाइव अपडेट जारी है!",
    selectDistVill: "📍 जिला व गाँव चुनें / बदलें",
    selectDistrict: "जिला चुनें:",
    searchVillageLabel: "गाँव खोजें या नाम टाइप करें:",

    backHome: "← होम पर जाएं"
  },
  en: {
    appTitle: "Mera Gaov Mera Haryana (Live Portal)",
    ticker: "🌾 Mustard: ₹5,400/Quintal | 🌾 Wheat: ₹2,425/Quintal | 🌤️ Live Weather: Haryana - Normal Temp | 📢 Live updates active for all villages!",
    selectDistVill: "📍 Select / Change District & Village",
    selectDistrict: "Select District:",
    searchVillageLabel: "Search Village / Type Name:",
    activeVillage: "Active Village:",
    menu1: "🏥 1. View Shops & Add (Live Photo)",
    menu2: "🛠️ 1B. Essential Services & Add",
    menu3: "📢 2. Announcements & News",
    menu4: "📜 3. Village History & Sarpanch List",
    menu5: "🌾 4. Cattle, Wheat Buy-Sell & Live Photos 📸",
    menu6: "📸 5. Village Gallery (Live Photos)",
    menu7: "🎵 6. Videos & Live Programs",
    menu8: "📚 7. Children Education & Portals",
    menu9: "🐄 8. Animal Diseases & Farmer Inquiry",
    menu10: "🌤️ 9. Live Weather & Mandi Rates",
    backHome: "← Go to Home"
  }
};

function App() {
  const [lang, setLang] = useState("hi");
  const [view, setView] = useState("home"); 

  const [selectedDistrict, setSelectedDistrict] = useState(() => localStorage.getItem('selectedDistrict') || 'charkhi-dadri');
  const [searchVillage, setSearchVillage] = useState(() => localStorage.getItem('searchVillage') || 'मालकोश');

  const [activeCategory, setActiveCategory] = useState("all");
  const [showDropdown, setShowDropdown] = useState(false);
  const [showMenuPopup, setShowMenuPopup] = useState(false);

  const [services, setServices] = useState([]);
  const [galleryItems, setGalleryItems] = useState([]);
  const [marketItems, setMarketItems] = useState([]);
  const [videoItems, setVideoItems] = useState([]);
  const [animalItems, setAnimalItems] = useState([]);
  const [announcementItems, setAnnouncementItems] = useState([]);
  const [historyItems, setHistoryItems] = useState([]);
  const [mandiItems, setMandiItems] = useState([]);

  const [isAdminLoggedIn, setIsAdminLoggedIn] = useState(false);
  const [isSubAdminLoggedIn, setIsSubAdminLoggedIn] = useState(false);
  const [adminPass, setAdminPass] = useState("");
  const [subAdminPass, setSubAdminPass] = useState("");

  const t = DICT[lang];

  useEffect(() => {
    localStorage.setItem('selectedDistrict', selectedDistrict);
    localStorage.setItem('searchVillage', searchVillage);
  }, [selectedDistrict, searchVillage]);

  useEffect(() => {
    if (window.firebaseDb) {
      const { db, ref, onValue } = window.firebaseDb;

      onValue(ref(db, 'services'), (snapshot) => {
        const data = snapshot.val();
        setServices(data ? Object.keys(data).map(k => ({id: k, ...data[k]})).reverse() : []);
      });
      onValue(ref(db, 'gallery'), (snapshot) => {
        const data = snapshot.val();
        setGalleryItems(data ? Object.keys(data).map(k => ({id: k, ...data[k]})).reverse() : []);
      });
      onValue(ref(db, 'market'), (snapshot) => {
        const data = snapshot.val();
        setMarketItems(data ? Object.keys(data).map(k => ({id: k, ...data[k]})).reverse() : []);
      });
      onValue(ref(db, 'announcements'), (snapshot) => {
        const data = snapshot.val();
        setAnnouncementItems(data ? Object.keys(data).map(k => ({id: k, ...data[k]})).reverse() : []);
      });
      onValue(ref(db, 'history'), (snapshot) => {
        const data = snapshot.val();
        setHistoryItems(data ? Object.keys(data).map(k => ({id: k, ...data[k]})).reverse() : []);
      });
      onValue(ref(db, 'mandi'), (snapshot) => {
        const data = snapshot.val();
        setMandiItems(data ? Object.keys(data).map(k => ({id: k, ...data[k]})).reverse() : [
          {id: '1', crop: 'सरसों (Mustard)', price: '₹5,400 / क्विंटल', mandi: 'चरखी दादरी / रोहतक मंडी'},
          {id: '2', crop: 'गेहूँ (Wheat)', price: '₹2,425 / क्विंटल', mandi: 'हरियाणा सरकारी एमएसपी'}
        ]);
      });
    }
  }, []);

  const [title, setTitle] = useState("");
  const [phone, setPhone] = useState("");
  const [category, setCategory] = useState("CSC");
  const [personName, setPersonName] = useState("");
  const [shopImage, setShopImage] = useState("");

  const handleImageCapture = (e, callback) => {
    const file = e.target.files[0];
    if(file) {
      const reader = new FileReader();
      reader.onloadend = () => { callback(reader.result); };
      reader.readAsDataURL(file);
    }
  };

  const saveDynamicData = (path, dataObj, successMsg) => {
    if (window.firebaseDb) {
      const { db, ref, push } = window.firebaseDb;
      push(ref(db, path), { ...dataObj, districtId: selectedDistrict, villageHi: searchVillage, timestamp: Date.now() })
      .then(() => { alert(successMsg); setTitle(""); setPhone(""); setPersonName(""); setShopImage(""); })
      .catch(err => alert("त्रुटि: " + err.message));
    }
  };

  const deleteItem = (path, id) => {
    if(confirm("क्या आप वाकई इसे डिलीट करना चाहते हैं?")) {
      if (window.firebaseDb) {
        const { db, ref, remove } = window.firebaseDb;
        remove(ref(db, `${path}/${id}`)).then(() => alert("डिलीट हो गया!")).catch(err => alert(err.message));
      }
    }
  };

  const currentDistrictVillages = MASTER_DISTRICT_VILLAGES[selectedDistrict] ? MASTER_DISTRICT_VILLAGES[selectedDistrict].villages : [];
  const suggestedVillages = useMemo(() => {
    const query = searchVillage.trim().toLowerCase();
    if (!query) return currentDistrictVillages;
    return currentDistrictVillages.filter(v => v.hi.toLowerCase().includes(query) || v.en.toLowerCase().includes(query));
  }, [searchVillage, currentDistrictVillages]);

  const displayServices = useMemo(() => {
    const query = searchVillage.trim().toLowerCase();
    return services.filter(s => s.districtId === selectedDistrict && (!query || s.villageHi?.toLowerCase().includes(query)) && (activeCategory === "all" || s.category === activeCategory));
  }, [services, selectedDistrict, searchVillage, activeCategory]);

  return (
    <div className="container" onClick={() => { if(showMenuPopup) setShowMenuPopup(false); }}>

      <div className="header">
        <div className="title-box">
          <div className="title">MeraGaov - {searchVillage}</div>
          <div className="subtitle">{t.appTitle}</div>
        </div>

        <div className="header-right" onClick={(e) => e.stopPropagation()}>
          <button className="header-btn menu-btn-style" onClick={() => setShowMenuPopup(!showMenuPopup)}>☰ Menu</button>
          <button className="header-btn" onClick={() => setLang(lang === 'hi' ? 'en' : 'hi')}>🌐 {lang === 'hi' ? 'English' : 'हिंदी'}</button>

          {showMenuPopup && (
            <div className="dropdown-menu">
              <div className="dropdown-item" onClick={() => { setView('admin'); setShowMenuPopup(false); }}>⚙️ Admin Panel</div>
              <div className="dropdown-item" onClick={() => { setView('subadmin'); setShowMenuPopup(false); }}>🛡️ Sub-Admin Panel</div>
              <div className="dropdown-item" onClick={() => { setView('about'); setShowMenuPopup(false); }}>ℹ️ About Us</div>
            </div>
          )}
        </div>
      </div>

      <div className="ticker">
        <marquee scrollamount="6">{t.ticker}</marquee>
      </div>

      <div className="content">

        {view === "admin" && (
          <div>
            <button className="back-btn" onClick={() => setView("home")}>← होम पर जाएं</button>
            <div className="card">
              <div className="card-title">⚙️ Admin Panel (Master Control)</div>
              {!isAdminLoggedIn ? (
                <div>
                  <div className="form-group"><label>Admin Password:</label><input className="form-control" type="password" value={adminPass} onChange={e => setAdminPass(e.target.value)} /></div>
                  <button className="btn-submit" onClick={() => { if(adminPass === "1234") { setIsAdminLoggedIn(true); } else { alert("गलत पासवर्ड!"); } }}>लॉगिन करें</button>
                </div>
              ) : (
                <div>
                  <p style={{fontSize:'12px', color:'#047857', fontWeight:'bold', marginBottom:'8px'}}>✅ एडमिन लॉगिन सफल</p>
                  <button className="btn-submit" style={{background:'#dc2626', marginBottom:'10px'}} onClick={() => setIsAdminLoggedIn(false)}>लॉग आउट</button>
                  <h4 style={{fontSize:'13px', margin:'10px 0'}}>सभी डेटा सूची (डिलीट करने के लिए):</h4>
                  {services.map(s => (
                    <div key={s.id} className="service-item">
                      <div className="service-name">{s.titleHi} ({s.villageHi})</div>
                      <button className="delete-btn" onClick={() => deleteItem('services', s.id)}>🗑️ डिलीट करें</button>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>
        )}

        {view === "subadmin" && (
          <div>
            <button className="back-btn" onClick={() => setView("home")}>← होम पर जाएं</button>
            <div className="card">
              <div className="card-title">🛡️ Sub-Admin Panel ({searchVillage})</div>
              {!isSubAdminLoggedIn ? (
                <div>
                  <div className="form-group"><label>Sub-Admin Password:</label><input className="form-control" type="password" value={subAdminPass} onChange={e => setSubAdminPass(e.target.value)} /></div>
                  <button className="btn-submit" onClick={() => { if(subAdminPass === "5678") { setIsSubAdminLoggedIn(true); } else { alert("गलत पासवर्ड!"); } }}>लॉगिन करें</button>
                </div>
              ) : (
                <div>
                  <p style={{fontSize:'12px', color:'#047857', fontWeight:'bold', marginBottom:'8px'}}>✅ सब-एडमिन लॉगिन सफल ({searchVillage})</p>
                  <button className="btn-submit" style={{background:'#dc2626', marginBottom:'10px'}} onClick={() => setIsSubAdminLoggedIn(false)}>लॉग आउट</button>
                  {services.filter(s => s.villageHi === searchVillage).map(s => (
                    <div key={s.id} className="service-item">
                      <div className="service-name">{s.titleHi}</div>
                      <button className="delete-btn" onClick={() => deleteItem('services', s.id)}>🗑️ डिलीट करें</button>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>
        )}

    </div>
  );
}

document.getElementById('root') ? ReactDOM.createRoot(document.getElementById('root')).render(<App />) : null;
</script>
</body>
