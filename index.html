class VillageApp {
  constructor() {
    this.loadCustomVillagesFromStorage();

    this.state = {
      lang: 'hi',
      view: 'home',
      selectedDistrict: localStorage.getItem('selectedDistrict') || 'charkhi-dadri',
      searchVillage: localStorage.getItem('searchVillage') || 'कलानौर',
      services: [],
      gallery: [],
      market: [],
      announcements: [],
      history: [],
      jokes: [],
      complaints: [],
      subAdmins: [],
      userAvatarUrl: localStorage.getItem('userCustomAvatar') || 'https://cdn-icons-png.flaticon.com/512/3135/3135715.png',
      isAdminLoggedIn: false,
      isSubAdminLoggedIn: false
    };

    this.tempImage = '';

    this.initListeners();
    this.initFirebaseData();
    this.render();
  }

  loadCustomVillagesFromStorage() {
    try {
      let savedVillages = JSON.parse(localStorage.getItem('customDistrictVillages'));
      if (savedVillages) {
        for (let dKey in savedVillages) {
          if (HARYANA_DISTRICTS_AND_VILLAGES[dKey]) {
            savedVillages[dKey].forEach(newV => {
              let exists = HARYANA_DISTRICTS_AND_VILLAGES[dKey].villages.some(v => v.hi === newV.hi);
              if (!exists) {
                HARYANA_DISTRICTS_AND_VILLAGES[dKey].villages.push(newV);
              }
            });
          }
        }
      }
    } catch(e) { console.error(e); }
  }

  addNewVillageToDistrict() {
    const inputEl = document.getElementById('newVillageNameInput');
    const villageName = inputEl ? inputEl.value.trim() : '';

    if (!villageName) {
      alert(this.state.lang === 'hi' ? "कृपया नए गाँव का नाम दर्ज करें!" : "Please enter new village name!");
      return;
    }

    const currentDist = this.state.selectedDistrict;
    const exists = HARYANA_DISTRICTS_AND_VILLAGES[currentDist].villages.some(v => v.hi === villageName);
    
    if (exists) {
      alert(this.state.lang === 'hi' ? "यह गाँव सूची में पहले से मौजूद है!" : "Village already exists in the list!");
      return;
    }

    const newVillageObj = { hi: villageName, en: villageName };
    HARYANA_DISTRICTS_AND_VILLAGES[currentDist].villages.push(newVillageObj);

    let savedVillages = JSON.parse(localStorage.getItem('customDistrictVillages')) || {};
    if (!savedVillages[currentDist]) savedVillages[currentDist] = [];
    savedVillages[currentDist].push(newVillageObj);
    localStorage.setItem('customDistrictVillages', JSON.stringify(savedVillages));

    this.state.searchVillage = villageName;
    alert(this.state.lang === 'hi' ? `गाँव '${villageName}' सफलतापूर्वक जोड़ दिया गया है!` : `Village '${villageName}' added successfully!`);
    this.render();
  }

  initListeners() {
    const menuToggle = document.getElementById('menuToggleBtn');
    if(menuToggle) {
      menuToggle.onclick = (e) => {
        e.stopPropagation();
        const menu = document.getElementById('dropdownMenu');
        menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
      };
    }
    window.onclick = () => { 
      const menu = document.getElementById('dropdownMenu');
      if(menu) menu.style.display = 'none'; 
    };
    
    const langBtn = document.getElementById('langToggleBtn');
    if(langBtn) {
      langBtn.onclick = () => {
        this.state.lang = this.state.lang === 'hi' ? 'en' : 'hi';
        langBtn.innerText = this.state.lang === 'hi' ? '🌐 English' : '🌐 हिंदी';
        this.render();
      };
    }
  }

  initFirebaseData() {
    setTimeout(() => {
      if (window.firebaseDb) {
        const { db, ref, onValue } = window.firebaseDb;
        onValue(ref(db, 'services'), snap => {
          const val = snap.val();
          this.state.services = val ? Object.keys(val).map(k => ({id: k, ...val[k]})).reverse() : [];
          this.updateTicker();
          if(this.state.view === 'list' || this.state.view === 'admin') this.render();
        });
        onValue(ref(db, 'announcements'), snap => {
          const val = snap.val();
          this.state.announcements = val ? Object.keys(val).map(k => ({id: k, ...val[k]})).reverse() : [];
          if(this.state.view === 'announcements' || this.state.view === 'admin') this.render();
        });
        onValue(ref(db, 'market'), snap => {
          const val = snap.val();
          this.state.market = val ? Object.keys(val).map(k => ({id: k, ...val[k]})).reverse() : [];
          if(this.state.view === 'market' || this.state.view === 'admin') this.render();
        });
        onValue(ref(db, 'subAdmins'), snap => {
          const val = snap.val();
          this.state.subAdmins = val ? Object.keys(val).map(k => ({id: k, pwd: val[k]})) : [];
        });
      }
    }, 1000);
  }

  updateTicker() {
    const tickerEl = document.getElementById('dynamicTickerText');
    if(!tickerEl) return;

    let approvedShops = this.state.services.filter(s => s.status === 'approved' && s.districtId === this.state.selectedDistrict && s.villageHi === this.state.searchVillage);
    let baseText = "🌾 सरसों: ₹5,400/क्विंटल | 🌾 गेहूँ: ₹2,425/क्विंटल | 🌤️ लाइव मौसम: सामान्य";
    
    if(approvedShops.length > 0) {
      let shopTickerItems = approvedShops.map(s => `🛒 नई दुकान/सेवा: ${s.name} (${s.category || 'Service'}) - फोन: ${s.phone}`).join(' | ');
      tickerEl.innerHTML = `${shopTickerItems} | ${baseText}`;
    } else {
      tickerEl.innerHTML = baseText;
    }
  }

  changeUserAvatar(input) {
    const file = input.files[0];
    if(file) {
      const reader = new FileReader();
      reader.onloadend = () => {
        this.state.userAvatarUrl = reader.result;
        localStorage.setItem('userCustomAvatar', reader.result);
        const avatarEl = document.getElementById('headerUserAvatar');
        if(avatarEl) avatarEl.src = reader.result;
        alert(this.state.lang === 'hi' ? "प्रोफाइल फोटो बदल दी गई है!" : "Profile photo updated!");
      };
      reader.readAsDataURL(file);
    }
  }

  requestAdminAccess() {
    let pwd = prompt(this.state.lang === 'hi' ? "एडमिन पासवर्ड दर्ज करें:" : "Enter Admin Password:");
    if(pwd === '1234') {
      this.state.isAdminLoggedIn = true;
      this.state.isSubAdminLoggedIn = false;
      this.changeView('admin');
    } else { alert(this.state.lang === 'hi' ? "गलत पासवर्ड!" : "Wrong Password!"); }
  }

  requestSubAdminAccess() {
    let pwd = prompt(this.state.lang === 'hi' ? "सब-एडमिन पासवर्ड दर्ज करें:" : "Enter Sub-Admin Password:");
    let matchedSub = this.state.subAdmins.find(s => s.pwd === pwd);
    if(matchedSub || pwd === '1234') {
      this.state.isAdminLoggedIn = (pwd === '1234');
      this.state.isSubAdminLoggedIn = true;
      this.changeView('admin');
    } else { alert(this.state.lang === 'hi' ? "गलत पासवर्ड!" : "Wrong Password!"); }
  }

  addSubAdmin() {
    let inputEl = document.getElementById('newSubAdminPwd');
    let newSubPwd = inputEl ? inputEl.value : '';
    if(!newSubPwd) return alert(this.state.lang === 'hi' ? "पासवर्ड दर्ज करें!" : "Enter password!");
    if (window.firebaseDb) {
      const { db, ref, push } = window.firebaseDb;
      push(ref(db, 'subAdmins'), newSubPwd).then(() => {
        alert(this.state.lang === 'hi' ? "सब-एडमिन जोड़ दिया गया है!" : "Sub-admin added!");
        if(inputEl) inputEl.value = '';
      });
    }
  }

  deleteSubAdmin(id) {
    if(confirm(this.state.lang === 'hi' ? "हटाना चाहते हैं?" : "Want to delete?")) {
      if (window.firebaseDb) {
        const { db, ref, remove } = window.firebaseDb;
        remove(ref(db, `subAdmins/${id}`)).then(() => this.render());
      }
    }
  }

  changeView(viewName) {
    this.state.view = viewName;
    this.render();
  }

  saveData(path, data, msgHi, msgEn) {
    if (window.firebaseDb) {
      const { db, ref, push } = window.firebaseDb;
      push(ref(db, path), { 
        ...data, 
        districtId: this.state.selectedDistrict, 
        villageHi: this.state.searchVillage, 
        status: 'pending', 
        timestamp: Date.now() 
      })
      .then(() => { 
        alert(this.state.lang === 'hi' ? msgHi : msgEn); 
        this.changeView('home'); 
      })
      .catch(err => alert("Error: " + err.message));
    } else { alert("Database not connected!"); }
  }

  approveItem(path, id) {
    if (window.firebaseDb) {
      const { db, ref, update } = window.firebaseDb;
      update(ref(db, `${path}/${id}`), { status: 'approved' }).then(() => {
        alert(this.state.lang === 'hi' ? "सफलतापूर्वक अप्रूव हो गया!" : "Approved successfully!");
        this.updateTicker();
        this.render();
      });
    }
  }

  deleteItem(path, id) {
    if(confirm(this.state.lang === 'hi' ? "डिलीट करना चाहते हैं?" : "Want to delete?")) {
      if (window.firebaseDb) {
        const { db, ref, remove } = window.firebaseDb;
        remove(ref(db, `${path}/${id}`)).then(() => {
          this.updateTicker();
          this.render();
        });
      }
    }
  }

  handleImage(input) {
    const file = input.files[0];
    if(file) {
      const reader = new FileReader();
      reader.onloadend = () => { 
        this.tempImage = reader.result; 
        let preview = document.getElementById('shopImgPreviewText') || 
                      document.getElementById('servImgPreviewText') || 
                      document.getElementById('annImgPreviewText') || 
                      document.getElementById('mImgPreviewText');
        if(preview) preview.innerText = this.state.lang === 'hi' ? "✅ फोटो अपलोड हो गई है" : "✅ Photo uploaded";
      };
      reader.readAsDataURL(file);
    }
  }

  submitShop() {
    const nameEl = document.getElementById('sName');
    const phoneEl = document.getElementById('sPhone');
    const catEl = document.getElementById('sCat');
    const name = nameEl ? nameEl.value : '';
    const phone = phoneEl ? phoneEl.value : '';
    const cat = catEl ? catEl.value : 'किराना';
    if(!name || !phone) return alert(this.state.lang === 'hi' ? "कृपया सभी जानकारी भरें!" : "Please fill all details!");
    this.saveData('services', { name, phone, category: cat, imageUrl: this.tempImage || '' }, "दुकान एडमिन अप्रूवल के लिए भेज दी गई है!", "Shop submitted for admin approval!");
    this.tempImage = '';
  }

  submitAnnouncement() {
    const titleEl = document.getElementById('annTitle');
    const title = titleEl ? titleEl.value : '';
    if(!title) return alert(this.state.lang === 'hi' ? "विवरण भरें!" : "Fill description!");
    this.saveData('announcements', { title, imageUrl: this.tempImage || '' }, "मुनादी अप्रूवल के लिए भेज दी गई है!", "Announcement sent for approval!");
    this.tempImage = '';
  }

  submitMarket() {
    const nameEl = document.getElementById('mName');
    const phoneEl = document.getElementById('mPhone');
    const titleEl = document.getElementById('mTitle');

    const name = nameEl ? nameEl.value.trim() : '';
    const phone = phoneEl ? phoneEl.value.trim() : '';
    const title = titleEl ? titleEl.value.trim() : '';

    if (!name || !phone) {
      alert(this.state.lang === 'hi' ? "⚠️ कृपया 'नाम' और 'मोबाइल नंबर' दोनों दर्ज करें!" : "⚠️ Please enter both Name and Mobile Number!");
      return;
    }

    if (!title) {
      alert(this.state.lang === 'hi' ? "⚠️ कृपया विवरण लिखें!" : "⚠️ Please enter item description!");
      return;
    }

    this.saveData('market', { name, phone, title, imageUrl: this.tempImage || '' }, "पशु/बाजार पोस्ट एडमिन अप्रूवल के लिए भेज दी गई है!", "Market post sent for approval!");
    this.tempImage = '';
  }

  render() {
    const isEn = this.state.lang === 'en';
    const currentDistrictObj = HARYANA_DISTRICTS_AND_VILLAGES[this.state.selectedDistrict] || HARYANA_DISTRICTS_AND_VILLAGES['charkhi-dadri'];
    
    let currentVillageObj = currentDistrictObj.villages.find(v => v.hi === this.state.searchVillage || v.en === this.state.searchVillage);
    let displayVillageName = currentVillageObj ? (isEn ? currentVillageObj.en : currentVillageObj.hi) : this.state.searchVillage;

    const titleEl = document.getElementById('headerTitleText');
    if(titleEl) titleEl.innerText = `MeraGaov - ${displayVillageName}`;
    
    const avatarEl = document.getElementById('headerUserAvatar');
    if(avatarEl) avatarEl.src = this.state.userAvatarUrl;

    const menuText = document.getElementById('menuText');
    if(menuText) menuText.innerText = isEn ? 'Menu' : 'मेनू';

    const content = document.getElementById('mainContent');
    if(!content) return;

    localStorage.setItem('selectedDistrict', this.state.selectedDistrict);
    localStorage.setItem('searchVillage', this.state.searchVillage);

    this.updateTicker();

    let html = '';

    if (this.state.view === 'home') {
      let districtOptions = Object.keys(HARYANA_DISTRICTS_AND_VILLAGES).map(dKey => `
        <option value="${dKey}" ${this.state.selectedDistrict === dKey ? 'selected' : ''}>${isEn ? HARYANA_DISTRICTS_AND_VILLAGES[dKey].nameEn : HARYANA_DISTRICTS_AND_VILLAGES[dKey].nameHi}</option>
      `).join('');

      let villageOptions = currentDistrictObj.villages.map(v => `
        <option value="${v.hi}" ${(this.state.searchVillage === v.hi || this.state.searchVillage === v.en) ? 'selected' : ''}>${isEn ? v.en : v.hi}</option>
      `).join('');

      html = `
        <div class="card" style="background: #ecfdf5; border: 1px solid #a7f3d0;">
          <div class="card-title" style="color: #064e3b;">📍 ${isEn ? 'Select District & Village' : 'जिला व गाँव चुनें'}</div>
          <div class="form-group">
            <label>${isEn ? 'Select District:' : 'जिला चुनें:'}</label>
            <select class="form-control" id="districtSelect" onchange="app.state.selectedDistrict = this.value; app.state.searchVillage = HARYANA_DISTRICTS_AND_VILLAGES[this.value].villages[0].hi; app.render();">
              ${districtOptions}
            </select>
          </div>
          <div class="form-group">
            <label>${isEn ? 'Select Village:' : 'गाँव चुनें:'}</label>
            <select class="form-control" id="villageDropdownSelect" onchange="app.state.searchVillage = this.value; app.render();">
              ${villageOptions}
            </select>
          </div>

          <div style="margin-top: 10px; border-top: 1px dashed #059669; padding-top: 10px;">
            <label style="color:#047857; font-weight:700;">➕ ${isEn ? 'Add New Village in Same District' : 'इसी जिले में नया गाँव/वार्ड जोड़ें:'}</label>
            <div style="display: flex; gap: 6px; margin-top: 5px;">
              <input class="form-control" id="newVillageNameInput" placeholder="${isEn ? 'New village name...' : 'गाँव का नाम लिखें...'}" style="margin-bottom:0;" />
              <button style="background: #047857; color: white; border: none; padding: 0 12px; border-radius: 8px; font-weight: bold; cursor: pointer; white-space: nowrap;" onclick="app.addNewVillageToDistrict()">${isEn ? 'Add' : 'जोड़ें'}</button>
            </div>
          </div>
        </div>

        <!-- होमपेज के केवल 5 सबसे ज़रूरी और काम के विकल्प -->
        <div class="menu-card bg-1" onclick="app.changeView('greetings')"><span>🎉 त्यौहार व बधाई संदेश</span><span>→</span></div>
        <div class="menu-card bg-2" onclick="app.changeView('announcements')"><span>📢 मुनादी व जरूरी खबरें</span><span>→</span></div>
        <div class="menu-card bg-3" onclick="app.changeView('list')"><span>🛒 दुकान और सेवा बाजार</span><span>→</span></div>
        <div class="menu-card bg-4" onclick="app.changeView('market')"><span>🐃 पशु हाट और सेकेंड-हैंड बाजार</span><span>→</span></div>
        <div class="menu-card bg-5" onclick="app.changeView('chaupal')"><span>💬 गाँव की चौपाल / आपसी चर्चा</span><span>→</span></div>
      `;
    } 
    else if (this.state.view === 'list') {
      let list = this.state.services.filter(s => s.status === 'approved' && s.districtId === this.state.selectedDistrict && s.villageHi === this.state.searchVillage).map(s => `
        <div class="service-item">
          <span class="service-tag">${s.category || 'Shop'}</span>
          <div class="service-name">${s.name}</div>
          ${s.imageUrl ? `<img src="${s.imageUrl}" class="service-img" />` : ''}
          <a href="tel:${s.phone}" class="btn-call">📞 कॉल करें: ${s.phone}</a>
          ${(this.state.isAdminLoggedIn || this.state.isSubAdminLoggedIn) ? `<button class="delete-btn" onclick="app.deleteItem('services', '${s.id}')">🗑️ डिलीट</button>` : ''}
        </div>
      `).join('');
      html = `
        <button class="back-btn" onclick="app.changeView('home')">← होम</button>
        <div class="card">
          <div class="card-title">🛒 दुकान और सेवा बाजार (${displayVillageName})</div>
          <div class="live-upload-box" style="margin-bottom:14px;">
            <input class="form-control" id="sName" placeholder="दुकान/सेवा का नाम..." style="margin-bottom:8px;" />
            <input class="form-control" id="sPhone" placeholder="मोबाइल नंबर..." style="margin-bottom:8px;" />
            <select class="form-control" id="sCat" style="margin-bottom:8px;"><option value="किराना">किराना स्टोर</option><option value="मिस्त्री">मिस्त्री / सेवा</option><option value="अन्य">अन्य</option></select>
            <button class="btn-submit" onclick="app.submitShop()">📤 दुकान जोड़ें (अप्रूवल के लिए)</button>
          </div>
        </div>
        ${list || `<div class="empty-state">इस गाँव में अभी कोई दुकान उपलब्ध नहीं है।</div>`}
      `;
    }
    else if (this.state.view === 'announcements') {
      let items = this.state.announcements.filter(a => a.status === 'approved' && a.districtId === this.state.selectedDistrict && a.villageHi === this.state.searchVillage).map(a => `
        <div class="service-item"><div class="service-name">${a.title}</div>${a.imageUrl ? `<img src="${a.imageUrl}" class="service-img"/>` : ''}${(this.state.isAdminLoggedIn || this.state.isSubAdminLoggedIn)?`<button class="delete-btn" onclick="app.deleteItem('announcements', '${a.id}')">🗑️ Delete</button>`:''}</div>
      `).join('');
      html = `
        <button class="back-btn" onclick="app.changeView('home')">← होम</button>
        <div class="card">
          <div class="card-title">📢 मुनादी व जरूरी खबरें (${displayVillageName})</div>
          <div class="live-upload-box">
            <input class="form-control" id="annTitle" placeholder="मुनादी का विवरण..." style="margin-bottom:8px;" />
            <button class="btn-submit" onclick="app.submitAnnouncement()">📤 मुनादी भेजें</button>
          </div>
          ${items || `<div class="empty-state">कोई मुनादी उपलब्ध नहीं है।</div>`}
        </div>
      `;
    }
    else if (this.state.view === 'market') {
      let items = this.state.market.filter(m => m.status === 'approved' && m.districtId === this.state.selectedDistrict && m.villageHi === this.state.searchVillage).map(m => `
        <div class="service-item" style="border-left: 4px solid #f59e0b;">
          <div class="service-name">${m.title}</div>
          <p style="font-size: 12px; color: #047857; margin-bottom: 6px;"><b>विक्रेता:</b> ${m.name} | <b>फोन:</b> ${m.phone}</p>
          ${m.imageUrl ? `<img src="${m.imageUrl}" class="service-img"/>` : ''}
          ${(this.state.isAdminLoggedIn || this.state.isSubAdminLoggedIn)?`<button class="delete-btn" onclick="app.deleteItem('market', '${m.id}')">🗑️ Delete</button>`:''}
        </div>
      `).join('');
      html = `
        <button class="back-btn" onclick="app.changeView('home')">← होम</button>
        <div class="card">
          <div class="card-title">🐃 पशु हाट और सेकेंड-हैंड बाजार (${displayVillageName})</div>
          <div class="live-upload-box">
            <input class="form-control" id="mName" placeholder="आपका नाम (अनिवार्य)..." style="margin-bottom:8px;" />
            <input class="form-control" id="mPhone" placeholder="मोबाइल नंबर (अनिवार्य)..." style="margin-bottom:8px;" />
            <textarea class="form-control" id="mTitle" placeholder="पशु या वस्तु का विवरण..." style="margin-bottom:8px; height:60px;"></textarea>
            <button class="btn-submit" onclick="app.submitMarket()">📤 पोस्ट भेजें</button>
          </div>
          ${items || `<div class="empty-state">कोई पोस्ट उपलब्ध नहीं है।</div>`}
        </div>
      `;
    }
    else if (this.state.view === 'greetings') {
      html = `
        <button class="back-btn" onclick="app.changeView('home')">← होम</button>
        <div class="card">
          <div class="card-title">🎉 त्यौहार व बधाई संदेश</div>
          <p style="font-size:13px; color:#334155;">यहाँ जन्मदिन, सालगिरह और त्योहारों के बैनर लगवाएं। विज्ञापन और बैनर लगवाने के लिए संपर्क करें।</p>
        </div>
      `;
    }
    else if (this.state.view === 'chaupal') {
      html = `
        <button class="back-btn" onclick="app.changeView('home')">← होम</button>
        <div class="card">
          <div class="card-title">💬 गाँव की चौपाल / आपसी चर्चा</div>
          <p style="font-size:13px; color:#334155;">गाँव के लोगों के लिए आपसी चर्चा और ग्रुप चैट का मंच।</p>
        </div>
      `;
    }
    else if (this.state.view === 'policy') {
      html = `
        <button class="back-btn" onclick="app.changeView('home')">← होम</button>
        <div class="card">
          <div class="card-title">📜 Privacy Policy</div>
          <p style="font-size:13px; color:#334155;">आपकी डेटा सुरक्षा हमारी प्राथमिकता है। MeraGaov पोर्टल पर आपकी जानकारी सुरक्षित रहती है।</p>
        </div>
      `;
    }
    else if (this.state.view === 'about') {
      html = `
        <button class="back-btn" onclick="app.changeView('home')">← होम</button>
        <div class="card">
          <div class="card-title">ℹ️ About Us</div>
          <p style="font-size:13px; color:#334155; line-height: 1.6;">
            गाँव को डिजिटल रूप से सशक्त बनाना।<br>
            <b>संचालक / निर्माता:</b> Kusum w/o Rajesh Yadav
          </p>
        </div>
      `;
    }
    else if (this.state.view === 'admin') {
      if(!this.state.isAdminLoggedIn && !this.state.isSubAdminLoggedIn) return this.changeView('home');

      let renderPend = (arr, path, labelName) => arr.filter(x => x.status === 'pending' && x.districtId === this.state.selectedDistrict && x.villageHi === this.state.searchVillage).map(x => `
        <div class="media-card" style="border: 2px solid #2563eb;">
          <span class="service-tag">${labelName}</span>
          <div class="service-name">${x.title || x.name || ''}</div>
          ${x.name ? `<p style="font-size:11px; color:#555;">फोन: ${x.phone}</p>` : ''}
          ${x.imageUrl ? `<img src="${x.imageUrl}" class="service-img"/>` : ''}
          <button class="approve-btn" onclick="app.approveItem('${path}', '${x.id}')">✅ Approve</button>
          <button class="delete-btn" onclick="app.deleteItem('${path}', '${x.id}')">❌ Reject</button>
        </div>
      `).join('');

      let pServ = renderPend(this.state.services, 'services', 'Shop');
      let pAnn = renderPend(this.state.announcements, 'announcements', 'Announcement');
      let pMkt = renderPend(this.state.market, 'market', 'Market');

      html = `
        <button class="back-btn" onclick="app.changeView('home')">← होम</button>
        <div class="card"><div class="card-title">📥 Admin Approval Panel (${displayVillageName})</div></div>
        ${pServ || ''} ${pAnn || ''} ${pMkt || ''}
        ${(!pServ && !pAnn && !pMkt) ? '<div class="empty-state">कोई पेंडिंग अनुरोध नहीं है।</div>' : ''}
      `;
    }

    content.innerHTML = html;
  }
}

const app = new VillageApp();
</script>
</body>
</html>
