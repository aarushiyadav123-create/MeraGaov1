<style>
@import url('https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600;700&display=swap');

body{background:#064e3b;color:#0f172a;padding:6px}
.container{max-width:580px;margin:auto;background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 8px 25px #0005}

.menu-btn-style{background:#fbbf24;color:#0f172a}.dropdown-menu{position:absolute;top:45px;right:0;background:#fff;border-radius:12px;box-shadow:0 10px 25px #0004;border:1px solid #cbd5e1;width:220px;z-index:1000;overflow:hidden;display:none}

.bg-1{background:linear-gradient(135deg,#0d9488,#0f766e)}.bg-2{background:linear-gradient(135deg,#ea580c,#c2410c)}
.bg-3{background:linear-gradient(135deg,#db2777,#be185d)}.bg-4{background:linear-gradient(135deg,#2563eb,#1d4ed8)}
.bg-5{background:linear-gradient(135deg,#7c3aed,#6d28d9)}.bg-6{background:linear-gradient(135deg,#0891b2,#155e75)}
.card,.service-item,.media-card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:0 2px 8px #0000000d}
.card-title{font-size:14px;font-weight:700;color:#064e3b;border-bottom:1px solid #e2e8f0;padding-bottom:8px;margin-bottom:12px;display:flex;justify-content:space-between;gap:8px}
.form-group{margin-bottom:12px}.form-group label{display:block;font-size:12px;font-weight:700;color:#475569;margin-bottom:5px}
.form-control{width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:10px;font-size:13px;background:#f8fafc;outline:0}
.form-control:focus{border-color:#10b981;box-shadow:0 0 0 2px #10b98120}
.btn-submit{margin-top:8px}.service-tag{background:#d1fae5;color:#064e3b;font-size:10px;font-weight:bold;padding:3px 8px;border-radius:6px;display:inline-block}
.service-name{font-size:14px;font-weight:700;margin:6px 0;white-space:pre-wrap}
.service-img{width:100%;height:160px;object-fit:cover;border-radius:8px;margin-top:8px}.service-video{width:100%;max-height:220px;border-radius:8px;margin-top:8px}
.btn-call{display:block;width:100%;background:#059669;color:#fff;text-align:center;text-decoration:none;padding:10px;border-radius:10px;font-weight:bold;font-size:13px;margin-top:10px}
.empty-state{text-align:center;padding:25px 15px;background:#fff;border:1px dashed #cbd5e1;border-radius:14px;color:#64748b;font-size:13px}

.live-upload-box{background:#f0fdf4;border:2px dashed #10b981;border-radius:12px;padding:14px;text-align:center;margin-bottom:15px}
.delete-btn,.approve-btn{border:0;color:#fff;padding:5px 9px;border-radius:6px;font-size:11px;font-weight:bold;cursor:pointer;margin-top:6px}
.delete-btn{background:#dc2626}.approve-btn{background:#2563eb}
.firebase-status{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:7px 12px;border-radius:20px;font-size:11px;z-index:10000;display:none}
.badge{background:#dc2626;color:#fff;font-size:10px;padding:2px 7px;border-radius:10px}

<body>

<div id="firebaseStatus" class="firebase-status"></div>

<div id="splashScreen">

<div class="content" id="mainContent"></div>
</div>

<script>
const D={
"charkhi-dadri":{nameHi:"चरखी दादरी",nameEn:"Charkhi Dadri",villages:[
["कलानौर","Kalanaur"],["मालकोश","Malkosh"],["बाउंड","Baund"],["झूझू कलाँ","Jhujhu Kalan"],["पैडवा","Paidwa"],["बल्हा","Balha"],["मान्धी","Mandhi"],["मंसूरवास","Mansoorwas"],["अचैरा","Achaira"],["बडराई","Badrai"],["कोहला","Kohla"],["भागवी","Bhagvi"],["मटौर","Mataur"]]},
"rohtak":{nameHi:"रोहतक",nameEn:"Rohtak",villages:[["महम","Meham"],["कलानौर","Kalanaur (Rohtak)"],["स्माइला","Smaila"],["निंदाना","Nindana"],["सांपला","Sampla"]]},
"hansi":{nameHi:"हाँसी",nameEn:"Hansi",villages:[["हाँसी शहर","Hansi City"],["सिसई","Sisai"],["उमरा","Umra"]]},
"rewari":{nameHi:"रेवाड़ी",nameEn:"Rewari",villages:[["बावल","Bawal"],["कोसली","Kosli"]]},
"bhiwani":{nameHi:"भिवानी",nameEn:"Bhiwani",villages:[["भिवानी शहर","Bhiwani City"],["लोहारू","Loharu"],["सिवानी","Siwani"],["बाढड़ा","Badhra"]]},
"hisar":{nameHi:"हिसार",nameEn:"Hisar",villages:[["हिसार शहर","Hisar City"],["बरवाला","Barwala"],["नारनौंद","Narnaund"],["हांसी रोड","Hansiwala"]]},
"panipat":{nameHi:"पानीपत",nameEn:"Panipat",villages:[["पानीपत शहर","Panipat City"],["समालखा","Samalkha"],["सनौली","Sanauli"],["इन्द्रगढ़","Indragarh"]]}
};

const avatarDefault="https://cdn-icons-png.flaticon.com/512/3135/3135715.png";

class VillageApp{
constructor(){
this.loadCustomVillages();
this.state={
lang:"hi",view:"home",
selectedDistrict:localStorage.getItem("selectedDistrict")||"charkhi-dadri",
searchVillage:localStorage.getItem("searchVillage")||"",
userVillage:localStorage.getItem("userVillage")||"",
userDistrict:localStorage.getItem("userDistrict")||"",
villageLocked:localStorage.getItem("villageLocked")==="true",
villageUnlockRequested:localStorage.getItem("villageUnlockRequested")==="true",
services:[],announcements:[],greetings:[],market:[],historyGallery:[],chaupalMessages:[],
allowedChatUsers:{},subAdmins:[],villagesConfig:{},villageUnlockRequests:{},
userAvatarUrl:localStorage.getItem("userCustomAvatar")||avatarDefault,
isAdminLoggedIn:false,isSubAdminLoggedIn:false,loggedInSubAdminVillage:"",
loggedInSubAdminDistrict:"",currentUserPhone:localStorage.getItem("currentUserPhone")||"",
globalVillageSearchQuery:""
};
this.tempImage="";this.tempMedia="";this.tempMediaType="image";this.generatedBannerDataUrl="";this.bannerUserPhotoObj=null;this.unreadMessageCount=0;
this.listeners();
this.firebase();
this.render();
this.startup();
}

esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
status(t){let e=document.getElementById("firebaseStatus");if(!e)return;e.textContent=t;e.style.display="block";clearTimeout(this.st);this.st=setTimeout(()=>e.style.display="none",3500)}
villageObj(){
let d=D[this.state.selectedDistrict];return d?.villages.find(v=>v[0]===this.state.searchVillage||v[1]===this.state.searchVillage)
}

isAdminForVillage(v){
if(this.state.isAdminLoggedIn)return true;
if(this.state.isSubAdminLoggedIn){
return this.state.loggedInSubAdminVillage===v && this.state.loggedInSubAdminDistrict===this.state.selectedDistrict;
}
return false;
}

startup(){
setTimeout(()=>{let s=document.getElementById("splashScreen");if(s){s.style.opacity=0;setTimeout(()=>s.remove(),500)}},1000);
if(!localStorage.getItem("hasSeenWelcomeMeraGaov"))setTimeout(()=>this.welcome(),1100);
}
welcome(){
document.getElementById("welcomeModalContainer").innerHTML=`
<div class="welcome-overlay"><div class="welcome-modal">
<div class="welcome-title">राम-राम भाईयों! 🙏</div>
<div class="welcome-text">हरियाणा के हमारे डिजिटल गाँव MeraGaov में आपका स्वागत है। यहाँ गाँव की खबर और सेवाओं से जुड़ें।</div>
<button class="welcome-btn" onclick="app.closeWelcome()">शुरू करें</button>
</div></div>`;
}
closeWelcome(){localStorage.setItem("hasSeenWelcomeMeraGaov","true");document.getElementById("welcomeModalContainer").innerHTML=""}

loadCustomVillages(){
try{
let x=JSON.parse(localStorage.getItem("customDistrictVillages")||"{}");
Object.keys(x).forEach(k=>{
if(!D[k])return;
x[k].forEach(v=>{if(!D[k].villages.some(a=>a[0]===v[0]))D[k].villages.push(v)});
});
}catch(e){console.error(e)}
}

listeners(){
document.getElementById("menuToggleBtn").onclick=e=>{
e.stopPropagation();let m=document.getElementById("dropdownMenu");m.style.display=m.style.display==="block"?"none":"block";
};
document.addEventListener("click",()=>{let m=document.getElementById("dropdownMenu");if(m)m.style.display="none"});
document.getElementById("langToggleBtn").onclick=()=>{
this.state.lang=this.state.lang==="hi"?"en":"hi";
document.getElementById("langToggleBtn").textContent=this.state.lang==="hi"?"🌐 English":"🌐 हिंदी";
this.render();
};
window.addEventListener("firebase-ready",()=>this.setupFirebase());
window.addEventListener("firebase-error",()=>this.status("⚠️ Firebase connect नहीं हुआ"));
}

firebase(){
if(window.firebaseDb)return this.setupFirebase();
let n=0;
let wait=()=>{
if(window.firebaseDb)return this.setupFirebase();
if(++n<30)setTimeout(wait,250);else this.status("⚠️ Firebase उपलब्ध नहीं है");
};
wait();
}

setupFirebase(){
if(this.firebaseStarted||!window.firebaseDb)return;
this.firebaseStarted=true;
const {db,ref,onValue}=window.firebaseDb;
const listen=(path,fn)=>{
try{onValue(ref(db,path),s=>fn(s.val()),e=>{console.error(path,e);this.status("⚠️ Firebase data error")})}catch(e){console.error(e)}
};
const load=(key,val)=>{
this.state[key]=val?Object.keys(val).map(k=>({id:k,...val[k]})).reverse():[];
if(["list","announcements","greetings","market","historyGallery","admin"].includes(this.state.view))this.render();
this.updateTicker();
};

listen("services",v=>load("services",v));
listen("announcements",v=>load("announcements",v));
listen("market",v=>load("market",v));
listen("greetings",v=>load("greetings",v));
listen("historyGallery",v=>load("historyGallery",v));

listen("chaupalMessages",v=>{
let a=v?Object.keys(v).map(k=>({id:k,...v[k]})).reverse():[];
if(this.state.view!=="chaupal"&&a.length>this.state.chaupalMessages.length)this.unreadMessageCount+=a.length-this.state.chaupalMessages.length;
this.state.chaupalMessages=a;
if(["home","chaupal"].includes(this.state.view))this.render();
});
listen("allowedChatUsers",v=>{this.state.allowedChatUsers=v||{};if(["chaupal","admin"].includes(this.state.view))this.render()});
listen("subAdmins",v=>{this.state.subAdmins=v?Object.keys(v).map(k=>({id:k,...v[k]})):[]});
listen("villages_config",v=>{this.state.villagesConfig=v||{};if(this.state.view==="admin")this.render()});
listen("villageUnlockRequests",v=>{
this.state.villageUnlockRequests=v||{};
if(this.state.userPhone&&v&&v[this.state.userPhone]){
let req=v[this.state.userPhone];
if(req.status==="approved"){
this.state.villageLocked=false;
this.state.villageUnlockRequested=false;
localStorage.removeItem("villageLocked");
localStorage.removeItem("villageUnlockRequested");
localStorage.removeItem("userVillage");
localStorage.removeItem("userDistrict");
this.state.userVillage="";
this.state.userDistrict="";
alert("🎉 एडमिन ने आपके गाँव बदलने का अनुरोध स्वीकृत कर लिया है!");
}
}
if(this.state.view==="admin")this.render();
});
}

updateTicker(){
let e=document.getElementById("dynamicTickerText");if(!e)return;
let a=this.state.services.filter(x=>x.status==="approved"&&x.districtId===this.state.selectedDistrict&&x.villageHi===this.state.searchVillage);
let base="🌾 सरसों: ₹5,400/क्विंटल | 🌾 गेहूँ: ₹2,425/क्विंटल | 🌤️ मौसम: सामान्य";
e.textContent=a.length?a.map(x=>`${x.name} (${x.category||"Service"}) - ${x.phone||""}`).join(" | ")+" | "+base:base;
}

changeUserAvatar(input){
let f=input?.files?.[0];if(!f)return;
if(!f.type.startsWith("image/"))return alert("केवल फोटो चुनें।");
if(f.size>2*1024*1024)return alert("फोटो 2 MB से छोटी रखें।");
let r=new FileReader();r.onload=()=>{
this.state.userAvatarUrl=r.result;localStorage.setItem("userCustomAvatar",r.result);
document.getElementById("headerUserAvatar").src=r.result;alert("प्रोफाइल फोटो बदल दी गई!");
};r.readAsDataURL(f);
}

requestAdminAccess(){
if(prompt("एडमिन पासवर्ड दर्ज करें:")==="1234"){
this.state.isAdminLoggedIn=true;this.state.isSubAdminLoggedIn=false;this.changeView("admin");
}else alert("गलत पासवर्ड!");
}

requestSubAdminAccess(){
let p=prompt("सब-एडमिन पासवर्ड दर्ज करें:");
let s=this.state.subAdmins.find(x=>String(x.pwd)===p);
if(!s)return alert("गलत पासवर्ड!");
this.state.isSubAdminLoggedIn=true;
this.state.isAdminLoggedIn=false;
this.state.loggedInSubAdminVillage=s.village||s.villageHi||"";
this.state.loggedInSubAdminDistrict=s.districtId||s.district||"";
if(s.districtId&&D[s.districtId])this.state.selectedDistrict=s.districtId;
this.state.searchVillage=this.state.loggedInSubAdminVillage;
this.changeView("admin");
}

changeView(v){this.state.view=v;if(v==="chaupal")this.unreadMessageCount=0;this.render()}

saveData(path,data,msg){
if(!window.firebaseDb)return alert("Firebase अभी कनेक्ट नहीं है।");
let {db,ref,push}=window.firebaseDb;
push(ref(db,path),{
...data,districtId:this.state.selectedDistrict,
villageHi:this.state.searchVillage,status:"pending",timestamp:Date.now()
}).then(()=>{alert(msg);this.tempImage="";this.tempMedia="";this.changeView("home")})
.catch(e=>alert("Firebase Error: "+e.message));
}

approveItem(path,id){
if(!window.firebaseDb)return alert("Firebase कनेक्ट नहीं है।");
let {db,ref,update}=window.firebaseDb;
update(ref(db,`${path}/${id}`),{status:"approved"})
.then(()=>{alert("सफलतापूर्वक अप्रूव हो गया!");this.render()})
.catch(e=>alert("Approve Error: "+e.message));
}

deleteItem(path,id){
if(!confirm("डिलीट करना चाहते हैं?")||!window.firebaseDb)return;
let {db,ref,remove}=window.firebaseDb;
remove(ref(db,`${path}/${id}`)).then(()=>this.render()).catch(e=>alert(e.message));
}

addSubAdminConfig(){
let d=document.getElementById("subAdminDist").value;
let v=document.getElementById("subAdminVillage").value.trim();
let p=document.getElementById("subAdminPwd").value.trim();
if(!v||!p)return alert("गाँव और पासवर्ड भरें!");
if(!window.firebaseDb)return alert("Firebase कनेक्ट नहीं है।");
let {db,ref,push}=window.firebaseDb;
push(ref(db,"subAdmins"),{districtId:d,village:v,pwd:p,timestamp:Date.now()})
.then(()=>{alert("सब-एडमिन सफलतापूर्वक जोड़ दिया गया!");this.render()})
.catch(e=>alert(e.message));
}

deleteSubAdmin(id){
if(!confirm("सब-एडमिन हटाना चाहते हैं?")||!window.firebaseDb)return;
let {db,ref,remove}=window.firebaseDb;
remove(ref(db,"subAdmins/"+id)).then(()=>this.render());
}

addNewVillageToDistrict(){
let e=document.getElementById("newVillageNameInput"),v=e?.value.trim(),d=this.state.selectedDistrict;
if(!v)return alert("गाँव का नाम डालें!");
if(!D[d])return;
if(D[d].villages.some(x=>x[0]===v||x[1]===v))return alert("यह गाँव पहले से मौजूद है!");
let x=[v,v];D[d].villages.push(x);
let all=JSON.parse(localStorage.getItem("customDistrictVillages")||"{}");
(all[d]??=[]).push(x);localStorage.setItem("customDistrictVillages",JSON.stringify(all));
this.state.searchVillage=v;e.value="";this.render();
}

handleImage(input){
let f=input?.files?.[0];if(!f)return;
if(!f.type.startsWith("image/"))return alert("केवल फोटो चुनें।");
if(f.size>2*1024*1024)return alert("फोटो 2 MB से छोटी रखें।");
let r=new FileReader();r.onload=()=>{this.tempImage=r.result;alert("✅ फोटो चुन ली गई है!")};r.readAsDataURL(f);
}

handleBannerUserPhoto(input){

if(f.size>2*1024*1024)return alert("फोटो 2 MB से छोटी रखें।");
let r=new FileReader();r.onload=()=>{
let img=new Image();img.onload=()=>{this.bannerUserPhotoObj=img;alert("✅ फोटो बैनर के लिए तैयार है!")};img.src=r.result;
};r.readAsDataURL(f);
}

handleHistoryGalleryMedia(input){

if(!f.type.startsWith("image/")&&!f.type.startsWith("video/"))return alert("केवल फोटो या वीडियो चुनें।");
if(f.size>5*1024*1024)return alert("फोटो/वीडियो 5 MB से छोटा रखें।");
this.tempMediaType=f.type.startsWith("video")?"video":"image";
let r=new FileReader();r.onload=()=>{this.tempMedia=r.result;alert("✅ मीडिया चुन लिया गया!")};r.readAsDataURL(f);
}

wrapText(ctx,text,x,y,max,lineH){
let words=String(text).split(/\s+/),line="";
for(let w of words){
let t=line?line+" "+w:w;
if(ctx.measureText(t).width>max&&line){ctx.fillText(line,x,y);line=w;y+=lineH}else line=t;
}
if(line)ctx.fillText(line,x,y);
}

generateGreetingBannerCanvas(){
let name=document.getElementById("gName")?.value.trim();
let phone=document.getElementById("gPhone")?.value.trim();
let msg=document.getElementById("gMsg")?.value.trim();
if(!name||!msg)return alert("नाम और बधाई संदेश भरें!");
let c=document.createElement("canvas");c.width=800;c.height=800;
let x=c.getContext("2d"),g=x.createLinearGradient(0,0,800,800);
g.addColorStop(0,"#064e3b");g.addColorStop(.5,"#047857");g.addColorStop(1,"#022c22");
x.fillStyle=g;x.fillRect(0,0,800,800);
x.strokeStyle="#fbbf24";x.lineWidth=12;x.strokeRect(20,20,760,760);
x.textAlign="center";x.fillStyle="#fbbf24";x.font='bold 36px Hind';
x.fillText(`🌾 MeraGaov - ${this.state.searchVillage} 🌾`,400,80);
x.fillStyle="#ffffff22";x.fillRect(60,115,680,210);
x.fillStyle="#fff";x.font='bold 30px Hind';this.wrapText(x,msg,400,170,620,40);
x.save();x.beginPath();x.arc(400,470,115,0,Math.PI*2);x.clip();
if(this.bannerUserPhotoObj)x.drawImage(this.bannerUserPhotoObj,285,355,230,230);
else{x.fillStyle="#064e3b";x.font="70px sans-serif";x.fillText("👤",400,495)}
x.restore();
x.beginPath();x.arc(400,470,115,0,Math.PI*2);x.strokeStyle="#fbbf24";x.lineWidth=6;x.stroke();
x.fillStyle="#fbbf24";x.font='bold 36px Hind';x.fillText(name,400,635);
if(phone){x.fillStyle="#a7f3d0";x.font="26px Hind";x.fillText(`संपर्क: ${phone}`,400,680)}
x.fillStyle="#fff";x.font="18px Hind";x.fillText("MeraGaov डिजिटल गाँव",400,740);
try{this.generatedBannerDataUrl=c.toDataURL("image/png")}catch(e){return alert("बैनर export नहीं हो सका।")}
document.getElementById("bannerPreviewBox").innerHTML=`
<div class="card" style="text-align:center">
<b style="color:#047857">✨ बैनर तैयार है!</b><br>
<img src="${this.generatedBannerDataUrl}" style="width:100%;max-width:300px;border-radius:12px;margin:8px 0">
<br><a href="${this.generatedBannerDataUrl}" download="MeraGaov_Banner.png" class="btn-submit" style="display:inline-block;text-decoration:none;width:auto;background:#2563eb">📥 डाउनलोड करें</a>
</div>`;
alert("🎉 बैनर बन गया!");
}

<input class="form-control" id="verifyPhoneInput" placeholder="मोबाइल नंबर..." style="margin:8px 0">
<input type="password" class="form-control" id="verifyPassInput" placeholder="पासवर्ड..." style="margin-bottom:8px">
<button class="btn-submit" style="background:#dc2626" onclick="app.verifyUserForChat()">🔐 प्रवेश करें</button></div>`;
return `<button class="back-btn" onclick="app.changeView('home')">← होम</button><div class="card"><div class="card-title">💬 Admin Chat Room ${this.unreadMessageCount?`<span class="badge">${this.unreadMessageCount} नया</span>`:""}</div>${manage}${area}</div>`;
}

renderAdmin(){
if(!this.state.isAdminLoggedIn&&!this.state.isSubAdminLoggedIn)return this.changeView("home");

let targetVillage = this.state.isAdminLoggedIn ? null : this.state.loggedInSubAdminVillage;
let targetDistrict = this.state.isAdminLoggedIn ? null : this.state.loggedInSubAdminDistrict;

const pending=(arr,path,label)=>arr.filter(x=>{
let matchStatus = x.status==="pending";
let matchDistrict = this.state.isAdminLoggedIn ? (x.districtId===this.state.selectedDistrict) : (x.districtId===targetDistrict);
let matchVillage = this.state.isAdminLoggedIn ? true : (x.villageHi===targetVillage);
return matchStatus && matchDistrict && matchVillage;
}).map(x=>`
<div class="media-card"><span class="service-tag">${label} - ${this.esc(x.villageHi)}</span>
<div class="service-name">${this.esc(x.title||x.message||x.name)}</div>
${x.name?`<p style="font-size:11px">द्वारा: ${this.esc(x.name)} | ${this.esc(x.phone||"")}</p>`:""}
${x.imageUrl?`<img src="${this.esc(x.imageUrl)}" class="service-img">`:""}
${x.mediaUrl?`<${x.mediaType==="video"?"video controls":"img"} src="${this.esc(x.mediaUrl)}" class="${x.mediaType==="video"?"video-media":"service-img"}"></${x.mediaType==="video"?"video":"img"}>`:""}
<button class="approve-btn" onclick="app.approveItem('${path}','${this.esc(x.id)}')">✅ Approve</button>
<button class="delete-btn" onclick="app.deleteItem('${path}','${this.esc(x.id)}')">❌ Reject</button>
</div>`).join("");

let unlockRequestsBox="";
if(this.state.isAdminLoggedIn){
let reqs=Object.keys(this.state.villageUnlockRequests||{}).filter(k=>this.state.villageUnlockRequests[k].status==="pending").map(k=>{
let r=this.state.villageUnlockRequests[k];
return `
<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #f1f5f9;font-size:12px">
<span>📞 फोन: <b>${this.esc(r.phone)}</b> (गाँव: ${this.esc(r.oldVillage)})</span>
<button class="approve-btn" style="margin:0" onclick="app.approveVillageUnlock('${this.esc(r.phone)}')">✅ अप्रूव करें</button>
</div>
`;
}).join("");

unlockRequestsBox=`
<div class="card" style="background:#f0fdf4;border:1px solid #10b981">
<div class="card-title">🔓 गाँव रीसेट/बदलाव अनुरोध (Village Unlock Requests)</div>
<div style="margin-top:10px">${reqs||'<div style="color:#064e3b;font-size:12px">कोई लंबित अनुरोध नहीं है।</div>'}</div>
</div>
`;
}

let subAdminManagerBox="";
if(this.state.isAdminLoggedIn){
let dsOptions=Object.keys(D).map(k=>`<option value="${k}">${this.esc(D[k].nameHi)}</option>`).join("");
let subAdminList=this.state.subAdmins.map(s=>`
<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #f1f5f9;font-size:12px">
<span><b>${this.esc(s.village)}</b> (${this.esc(s.districtId)}) - पास: ${this.esc(s.pwd)}</span>
<button class="delete-btn" style="margin:0" onclick="app.deleteSubAdmin('${s.id}')">🗑️ हटाएं</button>
</div>
`).join("");

subAdminManagerBox=`
<div class="card" style="background:#fefce8;border:1px solid #facc15">
<div class="card-title">🔑 सब-एडमिन (Sub-Admin) जोड़ें</div>
<select class="form-control" id="subAdminDist" style="margin-bottom:8px">${dsOptions}</select>
<input class="form-control" id="subAdminVillage" placeholder="गाँव का नाम (जैसे: कलानौर)..." style="margin-bottom:8px">
<input class="form-control" id="subAdminPwd" placeholder="सब-एडमिन पासवर्ड..." style="margin-bottom:8px">
<button class="btn-submit" style="background:#ca8a04" onclick="app.addSubAdminConfig()">➕ सब-एडमिन सेव करें</button>
<div style="margin-top:10px">${subAdminList||'<div style="color:#713f12;font-size:12px">कोई सब-एडमिन नहीं जोड़ा गया है।</div>'}</div>
</div>
`;
}

let html=`<button class="back-btn" onclick="app.changeView('home')">← होम</button>
${unlockRequestsBox}
${subAdminManagerBox}
<div class="card"><div class="card-title">📊 Admin Dashboard / Approval Panel ${targetVillage?`(${this.esc(targetVillage)})`:""}</div></div>${pending(this.state.services,"services","Shop")}${pending(this.state.announcements,"announcements","Announcement")}${pending(this.state.greetings,"greetings","Greeting")}${pending(this.state.market,"market","Market")}${pending(this.state.historyGallery,"historyGallery","History")}`;
return html||`<button class="back-btn" onclick="app.changeView('home')">← होम</button><div class="empty-state">कोई पेंडिंग अनुरोध नहीं है।</div>`;
}

render(){
let d=D[this.state.selectedDistrict];
if(!d){this.state.selectedDistrict="charkhi-dadri";d=D[this.state.selectedDistrict]}
if(!this.state.searchVillage)this.state.searchVillage=d.villages[0]?.[0]||"";

let village=this.villageObj(),display=village?(this.state.lang==="en"?village[1]:village[0]):this.state.searchVillage;
document.getElementById("headerTitleText").textContent="MeraGaov - "+display;
document.getElementById("headerUserAvatar").src=this.state.userAvatarUrl;
localStorage.setItem("selectedDistrict",this.state.selectedDistrict);
if(this.state.searchVillage)localStorage.setItem("searchVillage",this.state.searchVillage);
this.updateTicker();

let html="";
if(!this.state.villageLocked){
let dsOptions=Object.keys(D).map(k=>`<option value="${k}">${this.esc(D[k].nameHi)}</option>`).join("");
let curD=D[this.state.selectedDistrict]||D["charkhi-dadri"];
let vilOptions=curD.villages.map(v=>`<option value="${this.esc(v[0])}">${this.esc(v[0])}</option>`).join("");

html=`
<div class="card" style="background:#f0fdf4;border:2px solid #10b981;text-align:center">
<div class="card-title" style="justify-content:center;color:#064e3b">🏡 अपना गाँव चुनें (Village Selection)</div>
<p style="font-size:12px;color:#475569;margin-bottom:12px">एक बार गाँव चुनने के बाद लॉक हो जाएगा और आप केवल अपने ही गाँव की निजी सामग्री देख सकेंगे।</p>
<div class="form-group" style="text-align:left"><label>जिला चुनें</label>
<select class="form-control" id="setupDistrictSelect" onchange="app.state.selectedDistrict=this.value;app.render()">${dsOptions}</select>
</div>
<div class="form-group" style="text-align:left"><label>गाँव चुनें</label>
<select class="form-control" id="setupVillageSelect">${vilOptions}</select>
</div>
<button class="btn-submit" style="background:#059669;padding:12px;margin-top:8px" onclick="app.lockUserVillage()">🔒 यह गाँव लॉक करें और आगे बढ़ें</button>
</div>
`;
}else if(this.state.view==="home"){
html=`<div class="card" style="background:#f0fdf4;border:1px solid #10b981;text-align:center">
<b style="color:#064e3b">🏡 आपका लॉक किया गया गाँव: ${this.esc(this.state.searchVillage)}</b>
<p style="font-size:12px;color:#475569;margin:6px 0 10px">आप केवल अपने गाँव की निजी सामग्री देख सकते हैं। अन्य गाँवों के लिए "All Village" बाज़ार देखें।</p>
${this.state.villageUnlockRequested?`<p style="font-size:12px;color:#dc2626;font-weight:bold">⏳ गाँव बदलने का अनुरोध एडमिन के पास लंबित है।</p>`:`<button class="btn-submit" style="background:#dc2626;padding:8px;font-size:12px;width:auto" onclick="app.requestVillageUnlock()">⚠️ गलती से गलत गाँव चुन लिया? एडमिन से रीसेट अनुरोध करें</button>`}
</div>
<div class="menu-card bg-1" onclick="app.changeView('list')">🛒 1. दुकान और सेवा बाजार →</div>
<div class="menu-card bg-2" onclick="app.changeView('announcements')">📢 2. मुनादी व जरूरी खबरें →</div>
<div class="menu-card bg-3" onclick="app.changeView('greetings')">🎉 3. त्यौहार व बधाई संदेश →</div>
<div class="menu-card bg-4" onclick="app.changeView('market')">🚜 4. खरीद-बिक्री बाज़ार →</div>
<div class="menu-card bg-6" onclick="app.changeView('historyGallery')">🏛️ 5. गाँव का इतिहास और गैलरी →</div>
<div class="menu-card" style="background:linear-gradient(135deg,#d97706,#b45309)" onclick="app.changeView('allVillageMarket')">🌐 6. All Village (ओपन बाज़ार) →</div>
<div class="menu-card bg-5" onclick="app.changeView('chaupal')">💬 7. Admin Chat Room ${this.unreadMessageCount?`<span class="badge">${this.unreadMessageCount} नया</span>`:""} →</div>`;
}else if(this.state.view==="list")html=this.renderForm({title:"🛒 दुकान और सेवा बाजार",type:"shop"});
else if(this.state.view==="announcements")html=this.renderForm({title:"📢 मुनादी व जरूरी खबरें",type:"announcement"});
else if(this.state.view==="greetings")html=this.renderForm({title:"🎉 त्यौहार व बधाई संदेश",type:"greeting"});
else if(this.state.view==="market")html=this.renderForm({title:"🚜 खरीद-बिक्री बाज़ार",type:"market"});
else if(this.state.view==="historyGallery")html=this.renderForm({title:"🏛️ गाँव का इतिहास और गैलरी",type:"history"});
else if(this.state.view==="allVillageMarket")html=this.renderAllVillageMarket();
else if(this.state.view==="chaupal")html=this.renderChat();
else if(this.state.view==="policy")html=`<button class="back-btn" onclick="app.changeView('home')">← होम</button><div class="card"><div class="card-title">📜 बड़ा Privacy + User Policy</div><p style="font-size:13px;line-height:1.6">MeraGaov प्लेटफ़ॉर्म आपकी गोपनीयता और डेटा सुरक्षा को पूरी गंभीरता से लेता है। हमारे प्लेटफ़ॉर्म पर शेयर की जाने वाली सभी जानकारियाँ, चैट संदेश, और डिजिटल विज्ञापन Firebase डेटाबेस के माध्यम से सुरक्षित रूप से संरक्षित किए जाते हैं। उपयोगकर्ता किसी भी सामग्री को अपलोड करते समय यह सुनिश्चित करें कि वह किसी भी प्रकार की भ्रामक या आपत्तिजनक न हो। एडमिनिस्ट्रेटर के पास सुरक्षा नियमों के तहत किसी भी गलत कंटेंट को हटाने का पूरा अधिकार सुरक्षित है।</p></div>`;
else if(this.state.view==="about")html=`<button class="back-btn" onclick="app.changeView('home')">← होम</button><div class="card"><div class="card-title">ℹ️ About Us</div><p style="font-size:13px;line-height:1.6"><b>MeraGaov - मेरी पहचान</b><br><br>गाँव की हर खबर और जरूरत, अब आपके फोन पर。<br><br><b>संचालक:</b> Kusum w/o Rajesh Yadav</p></div>`;
else if(this.state.view==="admin")html=this.renderAdmin();
document.getElementById("mainContent").innerHTML=html;
}
}

let app;
try{app=new VillageApp()}catch(e){
console.error(e);
document.getElementById("splashScreen")?.remove();
document.getElementById("mainContent").innerHTML=`<div class="card" style="text-align:center;border:2px solid #dc2626"><h3 style="color:#dc2626">⚠️ App खोलने में समस्या</h3><p style="font-size:13px;margin-top:8px">${String(e.message||e)}</p></div>`;
}
</script>
</body>
</html>
