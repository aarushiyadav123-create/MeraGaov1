const avatarDefault="https://cdn-icons-png.flaticon.com/512/3135/3135715.png";
class VillageApp{
constructor(){
this.loadCustomVillages();
this.state={
lang:localStorage.getItem("appLang")||"hi",view:"home",
selectedDistrict:localStorage.getItem("selectedDistrict")||"charkhi-dadri",
searchVillage:localStorage.getItem("searchVillage")||"",
userVillage:localStorage.getItem("userVillage")||"",
userDistrict:localStorage.getItem("userDistrict")||"",
villageLocked:localStorage.getItem("villageLocked")==="true",
services:[],announcements:[],greetings:[],market:[],historyGallery:[],sarpanchDetails:[],chaupalMessages:[],feedbacks:[],khelKud:[],
allowedChatUsers:{},subAdmins:[],villagesConfig:{},villageUnlockRequests:{},
userAvatarUrl:localStorage.getItem("userCustomAvatar")||avatarDefault,
isAdminLoggedIn:false,isSubAdminLoggedIn:false,
loggedInSubAdminVillage:"",loggedInSubAdminDistrict:"",loggedInSubAdminName:"",loggedInSubAdminPhone:"",
currentUserPhone:localStorage.getItem("currentUserPhone")||""
};
this.tempImage="";this.tempMedia="";this.tempMediaType="image";this.generatedBannerDataUrl="";this.bannerUserPhotoObj=null;this.unreadMessageCount=0;
this.listeners();this.firebase();this.render();this.startup();
}
t(k){return i18n[this.state.lang]?.[k]||i18n["hi"][k]||k;}
esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");}
status(t){
let e=document.getElementById("firebaseStatus");if(!e)return;
e.textContent=t;e.style.display="block";clearTimeout(this.st);
this.st=setTimeout(()=>e.style.display="none",3500);
}
villageObj(){
let d=D[this.state.selectedDistrict];
return d?.villages.find(v=>v[0]===this.state.searchVillage||v[1]===this.state.searchVillage);
}
hasSubAdminForCurrentVillage(){
return this.state.subAdmins.some(s=>s.village===this.state.searchVillage&&s.districtId===this.state.selectedDistrict);
}
isAdminForVillage(v){
if(this.state.isAdminLoggedIn)return true;
if(this.state.isSubAdminLoggedIn){return this.state.loggedInSubAdminVillage===v&&this.state.loggedInSubAdminDistrict===this.state.selectedDistrict;}
return false;
}
startup(){
setTimeout(()=>{let s=document.getElementById("splashScreen");if(s){s.style.opacity=0;setTimeout(()=>s.remove(),500);}},1000);
}
loadCustomVillages(){
try{
let x=JSON.parse(localStorage.getItem("customDistrictVillages")||"{}");
Object.keys(x).forEach(k=>{
if(!D[k])return;
x[k].forEach(v=>{if(!D[k].villages.some(a=>a[0]===v[0]))D[k].villages.push(v);});
});
}catch(e){console.error(e);}
}
listeners(){
document.getElementById("menuToggleBtn").onclick=e=>{
e.stopPropagation();let m=document.getElementById("dropdownMenu");m.style.display=m.style.display==="block"?"none":"block";
};
document.addEventListener("click",()=>{let m=document.getElementById("dropdownMenu");if(m)m.style.display="none";});
document.getElementById("langToggleBtn").onclick=()=>{
this.state.lang=this.state.lang==="hi"?"en":"hi";
localStorage.setItem("appLang",this.state.lang);
document.getElementById("langToggleBtn").textContent=this.state.lang==="hi"?"🌐 English":"🌐 हिंदी";
this.render();
};
window.addEventListener("firebase-ready",()=>this.setupFirebase());
window.addEventListener("firebase-error",()=>this.status("⚠️ Firebase connect नहीं हुआ"));
}
firebase(){
if(window.firebaseDb)return this.setupFirebase();
let n=0,wait=()=>{
if(window.firebaseDb)return this.setupFirebase();
if(++n<30)setTimeout(wait,250);else this.status("⚠️ Firebase उपलब्ध नहीं है");
};
wait();
}
setupFirebase(){
if(this.firebaseStarted||!window.firebaseDb)return;
this.firebaseStarted=true;
const {db,ref,onValue}=window.firebaseDb;
const listen=(path,fn)=>onValue(ref(db,path),s=>fn(s.val()),e=>console.error(path,e));
const load=(key,val)=>{
this.state[key]=val?Object.keys(val).map(k=>({id:k,...val[k]})).reverse():[];
if(["list","announcements","greetings","market","historyGallery","sarpanchDetails","admin","feedback","khelKud","allVillageMarket"].includes(this.state.view))this.render();
this.updateTicker();
};
listen("services",v=>load("services",v));
listen("announcements",v=>load("announcements",v));
listen("market",v=>load("market",v));
listen("greetings",v=>load("greetings",v));
listen("historyGallery",v=>load("historyGallery",v));
listen("sarpanchDetails",v=>load("sarpanchDetails",v));
listen("feedbacks",v=>load("feedbacks",v));
listen("khelKud",v=>load("khelKud",v));
listen("chaupalMessages",v=>{
let a=v?Object.keys(v).map(k=>({id:k,...v[k]})).reverse():[];
this.state.chaupalMessages=a;
if(["home","chaupal"].includes(this.state.view))this.render();
});
listen("subAdmins",v=>{this.state.subAdmins=v?Object.keys(v).map(k=>({id:k,...v[k]})):[];if(this.state.view==="admin"||this.state.view==="home")this.render();});
}
updateTicker(){
let e=document.getElementById("dynamicTickerText");
if(e){
let base="🌾 सरसों: ₹5,400/क्विंटल | 🌾 गेहूँ: ₹2,425/क्विंटल | 🌤️ मौसम: सामान्य";
let items=[...this.state.announcements.filter(x=>x.status==="approved"&&x.showOnTicker),...this.state.greetings.filter(x=>x.status==="approved"&&x.showOnTicker),...this.state.services.filter(x=>x.status==="approved"&&x.showOnTicker)].map(x=>x.villageHi?`📍 [${x.villageHi}]: ${x.title||x.message||x.name}`:(x.title||x.message||x.name)).filter(Boolean).join(" | ");
e.textContent=items?`${items} | ${base}`:base;
}
}
changeUserAvatar(input){

wrapText(ctx,text,x,y,max,lineH){
let words=String(text).split(/\s+/),line="";
for(let w of words){let t=line?line+" "+w:w;if(ctx.measureText(t).width>max&&line){ctx.fillText(line,x,y);line=w;y+=lineH;}else line=t;}
if(line)ctx.fillText(line,x,y);
}
generateGreetingBannerCanvas(){
let name=document.getElementById("gName")?.value.trim(),phone=document.getElementById("gPhone")?.value.trim(),msg=document.getElementById("gMsg")?.value.trim();
if(!name||!msg)return alert("नाम और बधाई संदेश भरें!");
let c=document.createElement("canvas");c.width=800;c.height=800;let x=c.getContext("2d");
let g=x.createLinearGradient(0,0,800,800);g.addColorStop(0,"#064e3b");g.addColorStop(.5,"#047857");g.addColorStop(1,"#022c22");
x.fillStyle=g;x.fillRect(0,0,800,800);x.strokeStyle="#fbbf24";x.lineWidth=12;x.strokeRect(20,20,760,760);
x.textAlign="center";x.fillStyle="#fbbf24";x.font='bold 36px Hind';x.fillText(`🌾 MeraGaov - ${this.state.searchVillage} 🌾`,400,80);
x.fillStyle="#ffffff22";x.fillRect(60,115,680,210);x.fillStyle="#fff";x.font='bold 30px Hind';this.wrapText(x,msg,400,170,620,40);
x.save();x.beginPath();x.arc(400,470,115,0,Math.PI*2);x.clip();
if(this.bannerUserPhotoObj)x.drawImage(this.bannerUserPhotoObj,285,355,230,230);else{x.fillStyle="#064e3b";x.font="70px sans-serif";x.fillText("👤",400,495);}
x.restore();x.beginPath();x.arc(400,470,115,0,Math.PI*2);x.strokeStyle="#fbbf24";x.lineWidth=6;x.stroke();
x.fillStyle="#fbbf24";x.font='bold 36px Hind';x.fillText(name,400,635);
if(phone){x.fillStyle="#a7f3d0";x.font="26px Hind";x.fillText(`संपर्क: ${phone}`,400,680);}
this.generatedBannerDataUrl=c.toDataURL("image/png");
document.getElementById("bannerPreviewBox").innerHTML=`<div class="card" style="text-align:center"><b style="color:#047857">बैनर तैयार है!</b><br><img src="${this.generatedBannerDataUrl}" style="width:100%;max-width:250px;border-radius:12px;margin:8px 0"></div>`;

}

    let dName=D[parts[0]]?D[parts[0]].nameHi:parts[0];
    let vName=parts[1];
    villageStatsHtml+=`<div style="background:#fff;border:1px solid #cbd5e1;border-radius:10px;padding:10px;margin-bottom:10px"><b style="color:#047857">📍 ${dName} -> ${vName} (${villagesWithActivity[k].length} पोस्ट)</b>`;
    villagesWithActivity[k].forEach(i=>{
      villageStatsHtml+=`<div style="font-size:11px;display:flex;justify-content:space-between;align-items:center;background:#f1f5f9;padding:6px;border-radius:6px;margin-top:6px"><span><b>[${i.label}]</b> ${this.esc(i.title||i.name||i.message||"")}</span><button class="delete-btn" style="padding:2px 6px;font-size:10px" onclick="app.deleteItem('${i.pPath}','${i.id}')">🗑️ डिलीट</button></div>`;
    });
    villageStatsHtml+=`</div>`;
  }
}
villageStatsHtml+=`</div>`;

return `<button class="back-btn" onclick="app.changeView('home')">${this.t('back')}</button>
<div class="card"><div class="card-title">${this.t('adminDash')}</div></div>
<div class="card" style="background:#f0fdf4;border:2px solid #10b981;">
  <div class="card-title" style="color:#064e3b">${this.t('adminControl')}</div>
  <div class="form-group">
    <label>${this.t('directOpen')}</label>
    <select class="form-control" id="adminDirectDistSelect" style="margin-bottom:8px" onchange="let d=this.value, s=document.getElementById('adminDirectVilSelect'); s.innerHTML=D[d]?D[d].villages.map(v=>\`<option value='\${v[0]}'>\${v[0]}</option>\`).join(''):'';">
      ${Object.keys(D).map(k=>`<option value="${k}">${D[k].nameHi}</option>`).join("")}
    </select>
    <select class="form-control" id="adminDirectVilSelect" style="margin-bottom:8px">
      ${D[this.state.selectedDistrict]?.villages.map(v=>`<option value="${v[0]}">${v[0]}</option>`).join("")}
    </select>
    <button class="btn-submit" style="background:#059669" onclick="app.adminDirectOpenVillage()">${this.t('enterVillageBtn')}</button>
  </div>
</div>
<h3 style="font-size:14px;color:#fff;margin:12px 0 8px">पेंडिंग अप्रूवल सूची:</h3>
${pendingList(this.state.services,"services","Shop")||""}
${pendingList(this.state.announcements,"announcements","Announcement")||""}
${pendingList(this.state.greetings,"greetings","Greeting")||""}
${pendingList(this.state.market,"market","Market")||""}
${pendingList(this.state.feedbacks,"feedbacks","Feedback")||""}
${pendingList(this.state.khelKud,"khelKud","KhelKud")||""}
${villageStatsHtml}
`;
}
render(){
let d=D[this.state.selectedDistrict];if(!d){this.state.selectedDistrict="charkhi-dadri";d=D[this.state.selectedDistrict];}
if(!this.state.searchVillage)this.state.searchVillage=d.villages[0]?.[0]||"";
let village=this.villageObj();
let display=village?(this.state.lang==="en"?village[1]:village[0]):this.state.searchVillage;

document.getElementById("headerTitleText").textContent="MeraGaov";
document.getElementById("headerVillageBadge").textContent="📍 "+display;
document.getElementById("headerUserAvatar").src=this.state.userAvatarUrl;
document.getElementById("splashTitle").textContent=this.t("appTitle");
document.getElementById("splashSub").textContent=this.t("subTitle");
document.getElementById("langToggleBtn").textContent=this.state.lang==="hi"?"🌐 English":"🌐 हिंदी";

localStorage.setItem("selectedDistrict",this.state.selectedDistrict);
if(this.state.searchVillage)localStorage.setItem("searchVillage",this.state.searchVillage);
this.updateTicker();

let dashBannerEl=document.getElementById("villageDashboardBannerContainer");
if(!this.state.villageLocked){
dashBannerEl.innerHTML="";
let dsOptions=Object.keys(D).map(k=>`<option value="${k}" ${k===this.state.selectedDistrict?"selected":""}>${this.esc(D[k].nameHi)}</option>`).join("");
let curD=D[this.state.selectedDistrict]||D["charkhi-dadri"];
let vilOptions=curD.villages.map(v=>`<option value="${this.esc(v[0])}">${this.esc(v[0])}</option>`).join("");
let html=`<div class="card" style="background:#f0fdf4;border:2px solid #10b981;text-align:center"><div class="card-title" style="justify-content:center;color:#064e3b">${this.t('selectVillage')}</div><div class="form-group" style="text-align:left"><label>${this.t('district')}</label><select class="form-control" id="setupDistrictSelect" onchange="app.state.selectedDistrict=this.value;app.state.searchVillage='';app.render()">${dsOptions}</select></div><div class="form-group" style="text-align:left"><label>${this.t('village')}</label><select class="form-control" id="setupVillageSelect">${vilOptions}</select></div><button class="btn-submit" style="background:#059669;padding:12px;margin-top:8px" onclick="app.lockUserVillage()">${this.t('lockVillage')}</button></div>`;
document.getElementById("mainContent").innerHTML=html;
return;
}else{
let approvedGreetings=this.state.greetings.filter(x=>x.status==="approved"&&x.villageHi===this.state.searchVillage&&x.imageUrl);
let bannerImg=approvedGreetings.length>0?approvedGreetings[0].imageUrl:"https://images.unsplash.com/photo-1500382017468-9049fed747ef?w=600&auto=format&fit=crop";
dashBannerEl.innerHTML=`<div class="village-banner-dash" onclick="document.getElementById('dashBannerImageInput').click()"><b>🌟 ${this.esc(display)} डिजिटल डैशबोर्ड</b><img src="${bannerImg}"></div>`;
}

let html="";
if(this.state.view==="home"){
html=`<div class="menu-card-small" onclick="app.changeView('allVillageMarket')">${this.t('allMarket')}</div>
<div class="menu-card bg-1" onclick="app.changeView('list')">${this.t('menu1')}</div>
<div class="menu-card bg-2" onclick="app.changeView('announcements')">${this.t('menu2')}</div>
<div class="menu-card bg-3" onclick="app.changeView('greetings')">${this.t('menu3')}</div>
<div class="menu-card bg-4" onclick="app.changeView('market')">${this.t('menu4')}</div>
<div class="menu-card bg-5" onclick="app.changeView('khelkud')">${this.t('menu5')}</div>
<div class="menu-card bg-8" onclick="app.changeView('sarpanch')">${this.t('menu6')}</div>
<div class="menu-card bg-6" onclick="app.changeView('historyGallery')">${this.t('menu7')}</div>
<div class="menu-card bg-5" onclick="app.changeView('chaupal')">${this.t('menu8')}</div>
<div class="menu-card bg-7" onclick="app.changeView('jokes')">${this.t('menu9')}</div>`;
}else if(this.state.view==="list"){html=this.renderForm({title:"🛒 दुकान और सेवा बाजार",type:"shop"});
}else if(this.state.view==="announcements"){html=this.renderForm({title:"📢 मुनादी व जरूरी खबरें",type:"announcement"});
}else if(this.state.view==="greetings"){html=this.renderForm({title:"🎉 त्यौहार व बधाई संदेश",type:"greeting"});
}else if(this.state.view==="market"){html=this.renderForm({title:"🚜 खरीद-बिक्री बाज़ार",type:"market"});
}else if(this.state.view==="khelkud"){html=this.renderForm({title:"🏆 खेल-कूद (कबड्डी / कुश्ती)",type:"khelkud"});
}else if(this.state.view==="historyGallery"){html=this.renderForm({title:"📸 गाँव का इतिहास और गैलरी",type:"history"});
}else if(this.state.view==="sarpanch"){html=this.renderForm({title:"🏛️ सरपंच, वार्ड व आबादी विवरण",type:"sarpanch"});
}else if(this.state.view==="allVillageMarket"){html=this.renderAllVillageMarket();
}else if(this.state.view==="jokes"){
html=`<button class="back-btn" onclick="app.changeView('home')">${this.t('back')}</button><div class="card"><div class="card-title">😂 चुटकुला ऑफ़ द डे</div><div class="service-item" style="background:#fefce8;border:1px solid #facc15"><p style="font-size:14px;font-weight:600">${this.esc(jokesList[Math.floor(Date.now()/(1000*60*60*24))%jokesList.length])}</p></div></div>`;
}else if(this.state.view==="chaupal"){
let msgs=this.state.chaupalMessages.filter(x=>x.districtId===this.state.selectedDistrict&&x.villageHi===this.state.searchVillage).map(x=>`<div class="service-item"><b style="color:#047857">${this.esc(x.name)}</b><div style="white-space:pre-wrap;margin-top:4px">${this.esc(x.message)}</div></div>`).join("");
html=`<button class="back-btn" onclick="app.changeView('home')">${this.t('back')}</button><div class="card"><div class="card-title">💬 Admin Chat Room</div><div class="live-upload-box"><input class="form-control" id="cName" placeholder="नाम..." style="margin-bottom:8px"><textarea class="form-control" id="cText" placeholder="संदेश..." style="margin-bottom:8px;height:70px"></textarea><button class="btn-submit" onclick="let n=document.getElementById('cName').value,m=document.getElementById('cText').value;if(n&&m)window.firebaseDb.push(window.firebaseDb.ref(window.firebaseDb.db,'chaupalMessages'),{name:n,message:m,districtId:app.state.selectedDistrict,villageHi:app.state.searchVillage,timestamp:Date.now()}).then(()=>app.render())">💬 भेजें</button></div>${msgs||`<div class="empty-state">कोई संदेश नहीं।</div>`}</div>`;
}else if(this.state.view==="feedback"){
html=`<button class="back-btn" onclick="app.changeView('home')">${this.t('back')}</button><div class="card"><div class="card-title">✍️ Feedback / शिकायत</div><div class="live-upload-box"><input class="form-control" id="fbName" placeholder="नाम..." style="margin-bottom:8px"><textarea class="form-control" id="fbMsg" placeholder="शिकायत..." style="margin-bottom:8px"></textarea><button class="btn-submit" onclick="window.firebaseDb.push(window.firebaseDb.ref(window.firebaseDb.db,'feedbacks'),{name:document.getElementById('fbName').value,message:document.getElementById('fbMsg').value,districtId:app.state.selectedDistrict,villageHi:app.state.searchVillage,timestamp:Date.now(),status:'approved'}).then(()=>{alert('भेज दिया गया!');app.changeView('home');})">📤 भेजें</button></div></div>`;
}else if(this.state.view==="policy"){
html=`<button class="back-btn" onclick="app.changeView('home')">${this.t('back')}</button><div class="card"><div class="card-title">📜 Privacy Policy & Disclaimer</div><p style="font-size:13px;line-height:1.6">MeraGaov एक सार्वजनिक मंच है। पोस्ट की जिम्मेदारी केवल यूजर की है। एडमिन के पास किसी भी पोस्ट को हटाने का पूरा अधिकार है।</p></div>`;
}else if(this.state.view==="about"){
html=`<button class="back-btn" onclick="app.changeView('home')">${this.t('back')}</button><div class="card"><div class="card-title">ℹ️ About Us</div><p style="font-size:13px;line-height:1.6"><b>MeraGaov - मेरी पहचान</b><br>संचालक: Kusum w/o Rajesh Yadav</p></div>`;
}else if(this.state.view==="admin"){html=this.renderAdmin();}
document.getElementById("mainContent").innerHTML=html;
}
}
let app;try{app=new VillageApp();}catch(e){console.error(e);}
</script>
</body>
</html>
