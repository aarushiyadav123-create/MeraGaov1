<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>हरियाणा ग्रामीण सेवा निर्देशिका</title>

<!-- React & React DOM -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600;700&display=swap');

* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Hind', sans-serif; }
body { background-color: #f1f5f9; color: #0f172a; padding: 10px; }
.container { max-width: 450px; margin: 0 auto; background: #ffffff; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }

.top-bar { background: #064e3b; color: #ffffff; padding: 8px 12px; font-size: 11px; display: flex; justify-content: space-between; align-items: center; }
.top-bar-right { display: flex; gap: 8px; align-items: center; }
.lang-btn { background: #fbbf24; color: #0f172a; border: none; padding: 3px 8px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 11px; }

.header { background: #065f46; color: white; padding: 16px; }
.header-content { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.logo { background: #fbbf24; color: #0f172a; width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 20px; }
.title { font-size: 18px; font-weight: 700; line-height: 1.2; }
.badge { background: #047857; color: #a7f3d0; font-size: 10px; padding: 2px 8px; border-radius: 10px; font-weight: bold; }
.subtitle { font-size: 11px; color: #a7f3d0; margin-top: 4px; }

.btn-group { display: flex; gap: 8px; margin-top: 12px; }
.btn-mode { flex: 1; padding: 10px; border-radius: 8px; font-weight: bold; font-size: 12px; border: none; cursor: pointer; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
.btn-admin { background: #fbbf24; color: #0f172a; }
.btn-user { background: #ffffff; color: #065f46; }

.content { padding: 16px; }

.card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 14px; margin-bottom: 14px; position: relative; }
.card-title { font-size: 13px; font-weight: 700; color: #065f46; border-bottom: 1px solid #e2e8f0; padding-bottom: 6px; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }

.form-group { margin-bottom: 10px; position: relative; }
.form-group label { display: block; font-size: 11px; font-weight: 700; color: #475569; margin-bottom: 4px; }
.form-control { width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 12px; background: #f8fafc; outline: none; }
.btn-submit { width: 100%; background: #047857; color: white; border: none; padding: 10px; border-radius: 8px; font-weight: bold; font-size: 13px; cursor: pointer; margin-top: 6px; }

.suggestions-list {
position: absolute;
top: 100%;
left: 0;
right: 0;
background: #ffffff;
border: 2px solid #047857;
border-radius: 8px;
max-height: 220px;
overflow-y: auto;
z-index: 1000;
box-shadow: 0 10px 25px rgba(0,0,0,0.15);
}
.suggestion-item { padding: 10px 12px; font-size: 13px; border-bottom: 1px solid #f1f5f9; cursor: pointer; color: #0f172a; display: flex; justify-content: space-between; align-items: center; }
.suggestion-item:hover, .suggestion-item:active { background: #ecfdf5; color: #047857; font-weight: bold; }

.village-card { background: #ecfdf5; border: 1px solid #a7f3d0; border-radius: 12px; padding: 12px; display: flex; gap: 12px; align-items: center; margin-bottom: 14px; }
.v-icon { background: #047857; color: white; width: 38px; height: 38px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 16px; flex-shrink: 0; }

.pills { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 14px; }
.pill { padding: 6px 12px; border-radius: 8px; font-size: 11px; font-weight: bold; border: 1px solid #cbd5e1; background: white; white-space: nowrap; cursor: pointer; }
.pill.active { background: #065f46; color: white; border-color: #065f46; }

.service-item { background: white; border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px; margin-bottom: 10px; }
.service-tag { background: #d1fae5; color: #065f46; font-size: 9px; font-weight: bold; padding: 2px 6px; border-radius: 4px; }
.service-name { font-size: 13px; font-weight: 700; color: #0f172a; margin: 4px 0; }
.btn-call { display: block; width: 100%; background: #059669; color: white; text-align: center; text-decoration: none; padding: 8px; border-radius: 8px; font-weight: bold; font-size: 12px; margin-top: 8px; }

.quick-btn { background: #fef3c7; border: 1px solid #fde047; color: #78350f; font-size: 10px; font-weight: bold; padding: 4px 8px; border-radius: 6px; cursor: pointer; margin-right: 4px; margin-top: 4px; display: inline-block; }

.empty-state { text-align: center; padding: 30px 15px; background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 12px; color: #64748b; font-size: 13px; }
</style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
const { useState, useMemo } = React;

const MASTER_DISTRICT_VILLAGES = {
'rohtak': {
name: { hi: 'रोहतक (Rohtak)', en: 'Rohtak' },
villages: [
{ hi: 'बलम / बलंभा', en: 'Balham' },
{ hi: 'बालंद', en: 'Baland' },
{ hi: 'सांपला', en: 'Sampla' },
{ hi: 'महम', en: 'Meham' },
{ hi: 'कलानौर', en: 'Kalanaur' },
{ hi: 'बोहर', en: 'Bohar' },
{ hi: 'लाखन माजरा', en: 'Lakhan Majra' }
]
},
'charkhi-dadri': {
name: { hi: 'चरखी दादरी (Charkhi Dadri)', en: 'Charkhi Dadri' },
villages: [
{ hi: 'मालकोश', en: 'Malkosh' },
{ hi: 'बौंद कलां', en: 'Bond Kalan' },
{ hi: 'बौंद खुर्द', en: 'Bond Khurd' },
{ hi: 'सांवर', en: 'Sanwar' },
{ hi: 'झुज्झू', en: 'Jhajhu' }
]
},
'bhiwani': {
name: { hi: 'भिवानी (Bhiwani)', en: 'Bhiwani' },
villages: [
{ hi: 'बावनी खेड़ा', en: 'Bawani Khera' },
{ hi: 'तोशाम', en: 'Tosham' },
{ hi: 'सिवानी', en: 'Siwani' }
]
}
};

const INITIAL_DATA = [
{ id: 1, titleHi: 'मालकोश जन सेवा एवं सीएससी केंद्र', phone: '9812000111', category: 'CSC', districtId: 'charkhi-dadri', villageHi: 'मालकोश', personName: 'रामनिवास मलिक' },
{ id: 2, titleHi: 'मालकोश बाबा रामदेव किराना स्टोर', phone: '9991000444', category: 'Kiryana', districtId: 'charkhi-dadri', villageHi: 'मालकोश', personName: 'राजेश यादव' }
];

function App() {
const [lang, setLang] = useState("hi");
const [view, setView] = useState("user");
const [selectedDistrict, setSelectedDistrict] = useState("charkhi-dadri");
const [searchVillage, setSearchVillage] = useState("मालकोश");
const [activeCategory, setActiveCategory] = useState("all");
const [showDropdown, setShowDropdown] = useState(false);

const [services, setServices] = useState(() => {
try {
const saved = localStorage.getItem("haryana_gramin_v15");
return saved ? JSON.parse(saved) : INITIAL_DATA;
} catch (e) { return INITIAL_DATA; }
});

const [title, setTitle] = useState("");
const [phone, setPhone] = useState("");
const [category, setCategory] = useState("Mistri");
const [personName, setPersonName] = useState("");
const [adminDistrict, setAdminDistrict] = useState("charkhi-dadri");
const [adminVillage, setAdminVillage] = useState("मालकोश");

const currentDistrictVillages = MASTER_DISTRICT_VILLAGES[selectedDistrict].villages;

const suggestedVillages = useMemo(() => {
const query = searchVillage.trim().toLowerCase();
if (!query) return currentDistrictVillages;
return currentDistrictVillages.filter(v =>
v.hi.toLowerCase().includes(query) || v.en.toLowerCase().includes(query)
);
}, [searchVillage, currentDistrictVillages]);

const selectVillageName = (vName) => {
setSearchVillage(vName);
setShowDropdown(false);
};

const handleDistrictChange = (dId) => {
setSelectedDistrict(dId);
const firstV = MASTER_DISTRICT_VILLAGES[dId].villages[0].hi;
setSearchVillage(firstV);
setShowDropdown(false);
};

// डेटा सेव करने पर ऑटोमैटिकली उसी गाँव और डिस्ट्रिक्ट को होम स्क्रीन पर सेट करना
const handleAdd = (e) => {
e.preventDefault();
if (!title || !phone || !adminVillage) return alert(lang === 'hi' ? "कृपया सभी जानकारी भरें!" : "Please fill all details!");

const trimmedVillage = adminVillage.trim();
const newSrv = {
id: Date.now(),
titleHi: title,
phone: phone,
category: category,
districtId: adminDistrict,
villageHi: trimmedVillage,
personName: personName || (lang === 'hi' ? "सत्यापित" : "Verified")
};

const updated = [newSrv, ...services];
setServices(updated);
localStorage.setItem("haryana_gramin_v15", JSON.stringify(updated));

// सीधे उसी गाँव का डेटा देखने के लिए स्टेट अपडेट करना
setSelectedDistrict(adminDistrict);
setSearchVillage(trimmedVillage);
setView("user"); // ऑटोमैटिकली होम स्क्रीन पर भेजना

setTitle("");
setPhone("");
setPersonName("");
alert(lang === 'hi' ? `गाँव "${trimmedVillage}" में नई सेवा सफलतापूर्वक जोड़ दी गई!` : `New service added to village "${trimmedVillage}"!`);
};

const handleDelete = (id) => {
const updated = services.filter(s => s.id !== id);
setServices(updated);
localStorage.setItem("haryana_gramin_v15", JSON.stringify(updated));
};

const displayServices = useMemo(() => {
const query = searchVillage.trim().toLowerCase();
return services.filter(s => {
const matchDist = s.districtId === selectedDistrict;
const villageNameLower = s.villageHi.toLowerCase();
const matchVill = !query || villageNameLower === query || villageNameLower.includes(query);
const matchCat = activeCategory === "all" || s.category === activeCategory;
return matchDist && matchVill && matchCat;
});
}, [services, selectedDistrict, searchVillage, activeCategory]);

return (
<div className="container">

<div className="top-bar">
<span>💡 {lang === 'hi' ? 'संस्थापक: राजेश यादव' : 'Founder: Rajesh Yadav'}</span>
<button className="lang-btn" onClick={() => setLang(lang === 'hi' ? 'en' : 'hi')}>
🌐 {lang === 'hi' ? 'English' : 'हिंदी'}
</button>
</div>

<div className="header">
<div className="header-content">
<div className="logo">हग</div>
<div>
<div className="title">{lang === 'hi' ? 'हरियाणा ग्रामीण सेवा' : 'Haryana Gramin Seva'}</div>
<span className="badge">{lang === 'hi' ? 'मेरागाँव - मेरी पहचान' : 'Mera Gaov - Meri Pehchan'}</span>
</div>
</div>
<p className="subtitle">{lang === 'hi' ? 'डिजिटल निर्देशिका पोर्टल' : 'Digital Directory Portal'}</p>

<div className="btn-group">
<button onClick={() => setView("admin")} className="btn-mode btn-admin">⚙️ {lang === 'hi' ? 'डेटा जोड़ें / एडमिन' : 'Add Data / Admin'}</button>
<button onClick={() => setView("user")} className="btn-mode btn-user">🏠 {lang === 'hi' ? 'होम स्क्रीन' : 'Home Screen'}</button>
</div>
</div>

<div className="content">

{view === "admin" && (
<div>
<div className="card">
<div className="card-title">⚙️ {lang === 'hi' ? 'नई दुकान या सेवा दर्ज करें' : 'Add New Service'}</div>
<form onSubmit={handleAdd}>

<div className="form-group">
<label>1. {lang === 'hi' ? 'जिला चुनें:' : 'Select District:'}</label>
<select className="form-control" value={adminDistrict} onChange={e => { setAdminDistrict(e.target.value); setAdminVillage(MASTER_DISTRICT_VILLAGES[e.target.value].villages[0].hi); }}>
{Object.keys(MASTER_DISTRICT_VILLAGES).map(key => (
<option key={key} value={key}>{MASTER_DISTRICT_VILLAGES[key].name[lang] || MASTER_DISTRICT_VILLAGES[key].name.hi}</option>
))}
</select>
</div>

<div className="form-group">
<label>2. {lang === 'hi' ? 'गाँव का नाम:' : 'Village Name:'}</label>
<input className="form-control" type="text" value={adminVillage} onChange={e => setAdminVillage(e.target.value)} placeholder="उदा: मालकोश / बलम" required />
</div>

<div className="form-group">
<label>3. {lang === 'hi' ? 'दुकान/सेवा का नाम:' : 'Shop/Service Name:'}</label>
<input className="form-control" type="text" placeholder="उदा: यादव किराना स्टोर" value={title} onChange={e => setTitle(e.target.value)} required />
</div>

<div className="form-group">
<label>4. {lang === 'hi' ? 'मोबाइल नंबर:' : 'Mobile Number:'}</label>
<input className="form-control" type="tel" placeholder="उदा: 9812345678" value={phone} onChange={e => setPhone(e.target.value)} required />
</div>

<div className="form-group">
<label>5. {lang === 'hi' ? 'संचालक का नाम:' : 'Owner Name:'}</label>
<input className="form-control" type="text" placeholder="उदा: विकास यादव" value={personName} onChange={e => setPersonName(e.target.value)} />
</div>

<div className="form-group">
<label>6. {lang === 'hi' ? 'श्रेणी:' : 'Category:'}</label>
<select className="form-control" value={category} onChange={e => setCategory(e.target.value)}>
<option value="Mistri">🔨 मिस्त्री / कारीगर</option>
<option value="CSC">🏥 दुकान / सीएससी केंद्र</option>
<option value="Kiryana">🛒 किराना / जनरल स्टोर</option>
<option value="Agriculture">🌾 कृषि व खाद-बीज</option>
<option value="Health">💊 स्वास्थ्य / मेडिकल</option>
</select>
</div>

<button type="submit" className="btn-submit">+ {lang === 'hi' ? 'सेव करें व गाँव देखें' : 'Save & View Village'}</button>
</form>
</div>

<div className="card">
<div className="card-title">{lang === 'hi' ? 'पंजीकृत दुकानें' : 'Registered Shops'} ({services.length})</div>
{services.map(s => (
<div key={s.id} style={{ display: 'flex', justifyContent: 'space-between', padding: '8px 0', borderBottom: '1px solid #f1f5f9', fontSize: '11px' }}>
<div>
<b>{s.titleHi}</b> ({s.villageHi})<br />
<span style={{ color: '#64748b' }}>📞 {s.phone}</span>
</div>
<button onClick={() => handleDelete(s.id)} style={{ color: 'red', border: 'none', background: 'none', cursor: 'pointer', fontWeight: 'bold' }}>{lang === 'hi' ? 'हटाएं' : 'Delete'}</button>
</div>
))}
</div>
</div>
)}

{view === "user" && (
<div>
<div className="card">
<div className="card-title">📍 {lang === 'hi' ? 'जिला व गाँव बदलें' : 'Change District & Village'}</div>

<div className="form-group">
<label>1. {lang === 'hi' ? 'जिला चुनें:' : 'Select District:'}</label>
<select className="form-control" value={selectedDistrict} onChange={e => handleDistrictChange(e.target.value)}>
{Object.keys(MASTER_DISTRICT_VILLAGES).map(key => (
<option key={key} value={key}>{MASTER_DISTRICT_VILLAGES[key].name[lang] || MASTER_DISTRICT_VILLAGES[key].name.hi}</option>
))}
</select>
</div>

<div className="form-group">
<label>2. {lang === 'hi' ? 'गाँव खोजें:' : 'Search Village:'}</label>
<input
className="form-control"
type="text"
value={searchVillage}
onFocus={() => setShowDropdown(true)}
onClick={() => setShowDropdown(true)}
onChange={e => { setSearchVillage(e.target.value); setShowDropdown(true); }}
placeholder={lang === 'hi' ? "गाँव का नाम लिखें..." : "Type village name..."}
/>

{showDropdown && (
<div className="suggestions-list">
{suggestedVillages.length > 0 ? (
suggestedVillages.map((v, index) => (
<div key={index} className="suggestion-item" onClick={() => selectVillageName(v.hi)}>
<span>📍 <b>{v.hi}</b></span>
<span style={{ fontSize: '11px', color: '#64748b' }}>{v.en}</span>
</div>
))
) : (
<div style={{ padding: '10px', fontSize: '12px', color: '#64748b' }}>
{lang === 'hi' ? 'कोई गाँव नहीं मिला' : 'No village found'}
</div>
)}
</div>
)}
</div>
</div>

<div className="village-card">
<div className="v-icon">{searchVillage ? searchVillage[0] : 'ग'}</div>
<div style={{ fontSize: '11px' }}>
<div style={{ fontSize: '14px', fontWeight: 'bold', color: '#064e3b' }}>
{lang === 'hi' ? 'सक्रिय गाँव' : 'Active Village'}: {searchVillage}
</div>
<div style={{ color: '#64748b' }}>
{MASTER_DISTRICT_VILLAGES[selectedDistrict].name[lang] || MASTER_DISTRICT_VILLAGES[selectedDistrict].name.hi}
</div>
</div>
</div>

<div className="pills">
{[
{ id: 'all', name: lang === 'hi' ? 'सभी सेवाएं' : 'All' },
{ id: 'Mistri', name: lang === 'hi' ? '🔨 मिस्त्री' : 'Mistri' },
{ id: 'CSC', name: lang === 'hi' ? '🏥 सीएससी' : 'CSC' },
{ id: 'Kiryana', name: lang === 'hi' ? '🛒 किराना' : 'Kiryana' },
{ id: 'Agriculture', name: lang === 'hi' ? '🌾 कृषि' : 'Agri' },
{ id: 'Health', name: lang === 'hi' ? '💊 स्वास्थ्य' : 'Health' }
].map(cat => (
<button
key={cat.id}
className={`pill ${activeCategory === cat.id ? 'active' : ''}`}
onClick={() => setActiveCategory(cat.id)}
>
{cat.name}
</button>
))}
</div>

<div>
<div style={{ fontSize: '12px', fontWeight: 'bold', color: '#475569', marginBottom: '8px' }}>
"{searchVillage}" {lang === 'hi' ? 'की पंजीकृत सेवाएं' : 'Services'} ({displayServices.length})
</div>

{displayServices.length > 0 ? (
displayServices.map(s => (
<div key={s.id} className="service-item">
<div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
<span className="service-tag">{s.category}</span>
<span style={{ fontSize: '10px', color: '#059669', fontWeight: 'bold' }}>✔ {lang === 'hi' ? 'सत्यापित' : 'Verified'}</span>
</div>
<div className="service-name">{s.titleHi}</div>
<div style={{ fontSize: '11px', color: '#64748b' }}>👤 {s.personName}</div>
<a href={`tel:${s.phone}`} className="btn-call">📞 {lang === 'hi' ? 'कॉल करें' : 'Call Now'} ({s.phone})</a>
</div>
))
) : (
<div className="empty-state">
🚫 <b>{searchVillage}</b> {lang === 'hi' ? 'गाँव में अभी कोई दुकान दर्ज नहीं है।' : 'No services listed.'}<br /><br />
<button onClick={() => setView("admin")} style={{ background: '#047857', color: 'white', border: 'none', padding: '6px 12px', borderRadius: '6px', fontSize: '11px', cursor: 'pointer', fontWeight: 'bold' }}>
+ {lang === 'hi' ? 'एडमिन से इस गाँव का डेटा जोड़ें' : 'Add Data'}
</button>
</div>
)}
</div>

</div>
)}

</div>
</div>
);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
