<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeraGaov - मेरी पहचान</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDKs (Compat Version) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800">

    <!-- गाँव चयन स्क्रीन (Modal / Overlay) -->
    <div id="village-setup-screen" class="fixed inset-0 bg-black bg-opacity-70 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-lg p-6 max-w-md w-full shadow-xl">
            <h2 class="text-2xl font-bold mb-4 text-green-700">अपना गाँव चुनें</h2>
            <p class="text-sm text-gray-600 mb-4">कृपया अपने गाँव का नाम दर्ज करें ताकि आपको सही जानकारी मिल सके।</p>
            <input type="text" id="input-village-name" placeholder="गाँव का नाम (जैसे: इसमाइला)" class="w-full border border-gray-300 rounded p-2 mb-4 focus:outline-none focus:ring-2 focus:ring-green-500">
            <button onclick="saveVillageAndProceed()" class="w-full bg-green-600 text-white font-bold py-2 rounded hover:bg-green-700 transition">शुरू करें</button>
        </div>
    </div>

    <!-- मुख्य ऐप कंटेनर -->
    <div id="main-app" class="hidden min-h-screen flex flex-col">
        <!-- Header -->
        <header class="bg-green-700 text-white p-4 shadow-md flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold">MeraGaov - मेरी पहचान</h1>
                <p class="text-xs text-green-200">गाँव: <span id="display-village-name" class="font-semibold"></span></p>
            </div>
            <button onclick="changeVillage()" class="bg-green-800 text-xs px-3 py-1 rounded hover:bg-green-900">गाँव बदलें</button>
        </header>

        <!-- Navigation Tabs (सभी फीचर्स के साथ) -->
        <nav class="bg-white shadow flex overflow-x-auto">
            <button onclick="switchTab('munadi')" id="btn-munadi" class="flex-1 py-3 px-3 text-center font-medium border-b-2 border-green-600 text-green-600 whitespace-nowrap text-sm">मुनादी</button>
            <button onclick="switchTab('bazar')" id="btn-bazar" class="flex-1 py-3 px-3 text-center font-medium border-b-2 border-transparent text-gray-600 whitespace-nowrap text-sm">बाज़ार</button>
            <button onclick="switchTab('badhai')" id="btn-badhai" class="flex-1 py-3 px-3 text-center font-medium border-b-2 border-transparent text-gray-600 whitespace-nowrap text-sm">बधाई</button>
            <button onclick="switchTab('history')" id="btn-history" class="flex-1 py-3 px-3 text-center font-medium border-b-2 border-transparent text-gray-600 whitespace-nowrap text-sm">इतिहास</button>
            <button onclick="switchTab('chat')" id="btn-chat" class="flex-1 py-3 px-3 text-center font-medium border-b-2 border-transparent text-gray-600 whitespace-nowrap text-sm">चैट रूम</button>
        </nav>

        <!-- Main Content Area -->
        <main class="flex-1 p-4 max-w-4xl w-full mx-auto">
            
            <!-- 1. मुनादी Tab -->
            <div id="tab-munadi" class="tab-content">
                <div class="bg-white p-4 rounded shadow mb-4">
                    <h3 class="font-bold text-lg mb-2 text-green-800">नई मुनादी जोड़ें</h3>
                    <input type="text" id="munadi-title" placeholder="शीर्षक" class="w-full border p-2 rounded mb-2">
                    <textarea id="munadi-desc" placeholder="सूचना यहाँ लिखें..." class="w-full border p-2 rounded mb-2"></textarea>
                    <button onclick="addMunadi()" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">पब्लिश करें</button>
                </div>
                <div id="munadi-list" class="space-y-3"></div>
            </div>

            <!-- 2. बाज़ार Tab -->
            <div id="tab-bazar" class="tab-content hidden">
                <div class="bg-white p-4 rounded shadow mb-4">
                    <h3 class="font-bold text-lg mb-2 text-green-800">खरीद-बिक्री के लिए डालें</h3>
                    <input type="text" id="bazar-item" placeholder="चीज़ का नाम (जैसे: साइकिल, गेहूँ)" class="w-full border p-2 rounded mb-2">
                    <input type="text" id="bazar-price" placeholder="कीमत / विवरण" class="w-full border p-2 rounded mb-2">
                    <button onclick="addBazarItem()" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">जोड़ें</button>
                </div>
                <div id="bazar-list" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>
            </div>

            <!-- 3. बधाई संदेश Tab -->
            <div id="tab-badhai" class="tab-content hidden">
                <div class="bg-white p-4 rounded shadow mb-4">
                    <h3 class="font-bold text-lg mb-2 text-green-800">बधाई संदेश भेजें</h3>
                    <input type="text" id="badhai-name" placeholder="किसको बधाई है?" class="w-full border p-2 rounded mb-2">
                    <textarea id="badhai-msg" placeholder="संदेश..." class="w-full border p-2 rounded mb-2"></textarea>
                    <button onclick="addBadhai()" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">भेजें</button>
                </div>
                <div id="badhai-list" class="space-y-3"></div>
            </div>

            <!-- 4. इतिहास Tab -->
            <div id="tab-history" class="tab-content hidden">
                <div class="bg-white p-4 rounded shadow mb-4">
                    <h3 class="font-bold text-lg mb-2 text-green-800">गाँव का इतिहास या जानकारी जोड़ें</h3>
                    <textarea id="history-desc" placeholder="गाँव के इतिहास के बारे में यहाँ लिखें..." class="w-full border p-2 rounded mb-2 h-32"></textarea>
                    <button onclick="saveHistory()" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">इतिहास सेव करें</button>
                </div>
                <div class="bg-white p-4 rounded shadow">
                    <h4 class="font-bold text-md mb-2 text-gray-700">हमारे गाँव का इतिहास:</h4>
                    <div id="history-display" class="text-gray-600 whitespace-pre-line">अभी इतिहास नहीं जोड़ा गया है।</div>
                </div>
            </div>

            <!-- 5. चैट रूम Tab -->
            <div id="tab-chat" class="tab-content hidden flex flex-col h-[65vh]">
                <div class="bg-white p-2 rounded-t shadow border-b text-sm font-semibold text-gray-600">गाँव का चैट रूम (लाइव)</div>
                <div id="chat-list" class="flex-1 bg-white p-4 shadow overflow-y-auto mb-2 space-y-2"></div>
                <div class="flex gap-2">
                    <input type="text" id="chat-input" placeholder="संदेश लिखें..." class="flex-1 border p-2 rounded" onkeypress="handleChatKeyPress(event)">
                    <button onclick="sendChat()" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">सेंड</button>
                </div>
            </div>

        </main>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // Firebase कॉन्फ़िगरेशन (अपनी असली डिटेल्स यहाँ भरें)
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            databaseURL: "YOUR_DATABASE_URL",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentVillage = "";

        // ऐप लोड होने पर चेक करें कि गाँव सेव है या नहीं
        window.onload = function() {
            const savedVillage = localStorage.getItem("meragaov_name");
            if (savedVillage) {
                currentVillage = savedVillage;
                document.getElementById("village-setup-screen").classList.add("hidden");
                document.getElementById("main-app").classList.remove("hidden");
                document.getElementById("display-village-name").innerText = currentVillage;
                loadLiveData();
            }
        };

        function saveVillageAndProceed() {
            const villageInput = document.getElementById("input-village-name").value.trim();
            if (villageInput === "") {
                alert("कृपया गाँव का नाम दर्ज करें!");
                return;
            }
            localStorage.setItem("meragaov_name", villageInput);
            currentVillage = villageInput;
            document.getElementById("village-setup-screen").classList.add("hidden");
            document.getElementById("main-app").classList.remove("hidden");
            document.getElementById("display-village-name").innerText = currentVillage;
            loadLiveData();
        }

        function changeVillage() {
            localStorage.removeItem("meragaov_name");
            location.reload();
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('nav button').forEach(el => {
                el.classList.remove('border-green-600', 'text-green-600');
                el.classList.add('border-transparent', 'text-gray-600');
            });

            document.getElementById('tab-' + tabName).classList.remove('hidden');
            const activeBtn = document.getElementById('btn-' + tabName);
            activeBtn.classList.add('border-green-600', 'text-green-600');
            activeBtn.classList.remove('border-transparent', 'text-gray-600');
        }

        // सभी फीचर्स के लिए लाइव डेटा लोड करना
        function loadLiveData() {
            let safeVillageKey = currentVillage.replace(/[.#$\/\[\]]/g, "_");

            // 1. मुनादी
            db.ref('villages/' + safeVillageKey + '/munadi').on('value', (snapshot) => {
                const list = document.getElementById('munadi-list');
                list.innerHTML = '';
                if (!snapshot.exists()) {
                    list.innerHTML = '<p class="text-gray-500 text-sm">अभी कोई मुनादी नहीं है।</p>';
                    return;
                }
                snapshot.forEach((child) => {
                    let d = child.val();
                    list.innerHTML += `<div class="bg-white p-4 rounded shadow"><h4 class="font-bold text-green-800">${escapeHtml(d.title)}</h4><p class="text-gray-700">${escapeHtml(d.desc)}</p></div>`;
                });
            });

            // 2. बाज़ार
            db.ref('villages/' + safeVillageKey + '/bazar').on('value', (snapshot) => {
                const list = document.getElementById('bazar-list');
                list.innerHTML = '';
                if (!snapshot.exists()) {
                    list.innerHTML = '<p class="text-gray-500 text-sm">बाज़ार में अभी कोई सामान नहीं है।</p>';
                    return;
                }
                snapshot.forEach((child) => {
                    let d = child.val();
                    list.innerHTML += `<div class="bg-white p-4 rounded shadow"><h4 class="font-bold">${escapeHtml(d.item)}</h4><p class="text-green-600 font-semibold">${escapeHtml(d.price)}</p></div>`;
                });
            });

            // 3. बधाई
            db.ref('villages/' + safeVillageKey + '/badhai').on('value', (snapshot) => {
                const list = document.getElementById('badhai-list');
                list.innerHTML = '';
                if (!snapshot.exists()) {
                    list.innerHTML = '<p class="text-gray-500 text-sm">अभी कोई बधाई संदेश नहीं है।</p>';
                    return;
                }
                snapshot.forEach((child) => {
                    let d = child.val();
                    list.innerHTML += `<div class="bg-white p-4 rounded shadow"><h4 class="font-bold text-pink-600">बधाई: ${escapeHtml(d.name)}</h4><p>${escapeHtml(d.msg)}</p></div>`;
                });
            });

            // 4. इतिहास
            db.ref('villages/' + safeVillageKey + '/history').on('value', (snapshot) => {
                const display = document.getElementById('history-display');
                if (snapshot.exists() && snapshot.val().text) {
                    display.innerText = snapshot.val().text;
                } else {
                    display.innerText = "अभी इतिहास नहीं जोड़ा गया है।";
                }
            });

            // 5. चैट रूम
            db.ref('villages/' + safeVillageKey + '/chat').on('value', (snapshot) => {
                const list = document.getElementById('chat-list');
                list.innerHTML = '';
                if (!snapshot.exists()) {
                    list.innerHTML = '<p class="text-gray-500 text-sm">चैट की शुरुआत करें...</p>';
                    return;
                }
                snapshot.forEach((child) => {
                    let d = child.val();
                    list.innerHTML += `<div class="bg-gray-50 p-2 rounded border"><p class="text-sm">${escapeHtml(d.text)}</p></div>`;
                });
                list.scrollTop = list.scrollHeight;
            });
        }

        // डेटा सबमिट करने के फंक्शन्स
        function addMunadi() {
            let safeKey = currentVillage.replace(/[.#$\/\[\]]/g, "_");
            let title = document.getElementById('munadi-title').value.trim();
            let desc = document.getElementById('munadi-desc').value.trim();
            if(title && desc) {
                db.ref('villages/' + safeKey + '/munadi').push({ title, desc });
                document.getElementById('munadi-title').value = '';
                document.getElementById('munadi-desc').value = '';
            } else { alert("कृपया दोनों फील्ड भरें!"); }
        }

        function addBazarItem() {
            let safeKey = currentVillage.replace(/[.#$\/\[\]]/g, "_");
            let item = document.getElementById('bazar-item').value.trim();
            let price = document.getElementById('bazar-price').value.trim();
            if(item && price) {
                db.ref('villages/' + safeKey + '/bazar').push({ item, price });
                document.getElementById('bazar-item').value = '';
                document.getElementById('bazar-price').value = '';
            } else { alert("कृपया दोनों फील्ड भरें!"); }
        }

        function addBadhai() {
            let safeKey = currentVillage.replace(/[.#$\/\[\]]/g, "_");
            let name = document.getElementById('badhai-name').value.trim();
            let msg = document.getElementById('badhai-msg').value.trim();
            if(name && msg) {
                db.ref('villages/' + safeKey + '/badhai').push({ name, msg });
                document.getElementById('badhai-name').value = '';
                document.getElementById('badhai-msg').value = '';
            } else { alert("कृपया दोनों फील्ड भरें!"); }
        }

        function saveHistory() {
            let safeKey = currentVillage.replace(/[.#$\/\[\]]/g, "_");
            let text = document.getElementById('history-desc').value.trim();
            if(text) {
                db.ref('villages/' + safeKey + '/history').set({ text });
                alert("इतिहास सफलताપूर्वक सेव हो गया!");
            } else { alert("कृपया कुछ तो लिखें!"); }
        }

        function sendChat() {
            let safeKey = currentVillage.replace(/[.#$\/\[\]]/g, "_");
            let text = document.getElementById('chat-input').value.trim();
            if(text) {
                db.ref('villages/' + safeKey + '/chat').push({ text });
                document.getElementById('chat-input').value = '';
            }
        }

        function handleChatKeyPress(event) {
            if (event.key === 'Enter') { sendChat(); }
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
