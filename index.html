<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeraGaov - मेरी पहचान</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body class="bg-emerald-950 font-sans text-gray-800 min-h-screen">

    <!-- गाँव चयन स्क्रीन (केवल पहली बार) -->
    <div id="village-setup-screen" class="fixed inset-0 bg-black bg-opacity-80 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-xl p-6 max-w-md w-full shadow-2xl">
            <h2 class="text-2xl font-bold mb-3 text-green-800">जिला और गाँव चुनें</h2>
            <p class="text-sm text-gray-600 mb-4">अपने जिला और गाँव का नाम चुनें ताकि सही जानकारी दिख सके।</p>
            
            <select id="input-district" class="w-full border border-gray-300 rounded-lg p-3 mb-3 text-sm bg-white">
                <option value="चरखी दादरी">चरखी दादरी</option>
                <option value="भिवानी">भिवानी</option>
                <option value="रोहतक">रोहतक</option>
                <option value="झज्जर">झज्जर</option>
            </select>

            <input type="text" id="input-village-name" placeholder="गाँव का नाम (जैसे: Malkosh)" class="w-full border border-gray-300 rounded-lg p-3 mb-4 focus:outline-none focus:ring-2 focus:ring-green-600 text-sm">
            
            <button onclick="saveVillageAndProceed()" class="w-full bg-green-700 text-white font-bold py-3 rounded-lg hover:bg-green-800 transition shadow">शुरू करें</button>
        </div>
    </div>

    <!-- मुख्य ऐप कंटेनर -->
    <div id="main-app" class="max-w-md mx-auto bg-emerald-900 min-h-screen flex flex-col shadow-2xl pb-10">
        
        <!-- टॉप हेडर -->
        <div class="bg-emerald-900 p-4 text-white flex justify-between items-center border-b border-emerald-800">
            <div class="flex items-center gap-2">
                <div class="w-10 h-10 rounded-full bg-amber-500 overflow-hidden border-2 border-white flex items-center justify-center font-bold text-lg text-emerald-950">गाँव</div>
                <div>
                    <h1 class="font-bold text-base leading-tight">MeraGaov - <span id="display-village-name">गाँव</span></h1>
                    <p class="text-[10px] text-emerald-200" id="display-district-name">जिला: -</p>
                </div>
            </div>
            <button onclick="switchView('home')" class="bg-amber-500 text-emerald-950 font-bold px-3 py-1 rounded-lg text-xs shadow">Menu</button>
        </div>

        <!-- लाइव बैनर / फोटो सेक्शन (Admin Approved) -->
        <div id="top-banner-box" class="w-full bg-emerald-800 text-white text-center py-2 px-4 shadow hidden">
            <img id="village-banner-img" src="" alt="गाँव का बैनर" class="w-full max-h-40 object-cover rounded-lg mb-1 hidden">
            <p id="village-banner-text" class="text-xs font-medium">स्वागत है आपका अपने डिजिटल गाँव में!</p>
        </div>

        <!-- मंडी भाव / टिकर पट्टी -->
        <div class="bg-emerald-950 text-amber-300 text-xs py-2 px-3 overflow-x-auto whitespace-nowrap border-b border-emerald-900 font-medium">
            🌾 सरसों: ₹5,400/क्विंटल | 🌽 बाजरा: ₹2,600/क्विंटल | 🌤️ मौसम: सामान्य
        </div>

        <!-- होम पेज व्यू (स्टायलिश मेनू बटन) -->
        <div id="view-home" class="p-4 space-y-3 flex-1">
            
            <!-- गाँव कार्ड और रीसेट बटन -->
            <div class="bg-white rounded-xl p-4 shadow-md text-center border border-gray-100">
                <h3 class="text-xl font-bold text-emerald-900 mb-1 flex items-center justify-center gap-1">🏠 <span id="card-village-name">गाँव</span></h3>
                <button onclick="requestVillageReset()" class="bg-red-600 text-white text-xs px-4 py-1.5 rounded-full font-semibold hover:bg-red-700 transition shadow mt-2">⚠️ गाँव रीसेट अनुरोध</button>
            </div>

            <!-- मेनू बटन्स -->
            <button onclick="openFeature('all_village')" class="w-full bg-amber-700 hover:bg-amber-800 text-white font-bold p-3.5 rounded-xl shadow-md flex justify-between items-center transition text-sm">
                <span>🌍 All Village (ओपन बाज़ार)</span> <span>→</span>
            </button>

            <button onclick="openFeature('dukan')" class="w-full bg-teal-700 hover:bg-teal-800 text-white font-bold p-3.5 rounded-xl shadow-md flex justify-between items-center transition text-sm">
                <span>🛒 1. दुकान और सेवा बाज़ार</span> <span>→</span>
            </button>

            <button onclick="openFeature('munadi')" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold p-3.5 rounded-xl shadow-md flex justify-between items-center transition text-sm">
                <span>📢 2. मुनादी व जरूरी खबरें</span> <span>→</span>
            </button>

            <button onclick="openFeature('badhai')" class="w-full bg-pink-600 hover:bg-pink-700 text-white font-bold p-3.5 rounded-xl shadow-md flex justify-between items-center transition text-sm">
                <span>🎉 3. त्यौहार व बधाई संदेश</span> <span>→</span>
            </button>

            <button onclick="openFeature('bazar')" class="w-full bg-blue-700 hover:bg-blue-800 text-white font-bold p-3.5 rounded-xl shadow-md flex justify-between items-center transition text-sm">
                <span>🚜 4. खरीद-बिक्री बाज़ार</span> <span>→</span>
            </button>

            <button onclick="openFeature('history')" class="w-full bg-cyan-800 hover:bg-cyan-900 text-white font-bold p-3.5 rounded-xl shadow-md flex justify-between items-center transition text-sm">
                <span>🏛️ 5. गाँव का इतिहास और गैलरी</span> <span>→</span>
            </button>

            <button onclick="openFeature('chat')" class="w-full bg-purple-700 hover:bg-purple-800 text-white font-bold p-3.5 rounded-xl shadow-md flex justify-between items-center transition text-sm">
                <span>💬 6. Admin Chat Room</span> <span class="bg-red-500 text-xs px-2 py-0.5 rounded-full text-white">लाइव</span> <span>→</span>
            </button>

            <!-- Admin Dashboard Button -->
            <button onclick="openFeature('admin')" class="w-full bg-slate-800 hover:bg-slate-900 text-amber-300 font-bold p-3.5 rounded-xl shadow-md flex justify-between items-center transition text-sm border border-amber-500/30">
                <span>⚙️ Main Admin Dashboard</span> <span>→</span>
            </button>
        </div>

        <!-- फीचर्स डिटेल व्यू -->
        <div id="view-content" class="p-4 hidden flex-1 bg-gray-50 text-gray-800">
            <button onclick="backToHome()" class="mb-4 bg-emerald-800 text-white px-3 py-1.5 rounded-lg text-xs font-bold shadow">← पीछे जाएं (Menu)</button>
            <div id="dynamic-content-area" class="space-y-4"></div>
        </div>

    </div>

    <!-- JavaScript Logic -->
    <script>
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            databaseURL: "YOUR_DATABASE_URL",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentVillage = "";
        let currentDistrict = "";

        window.onload = function() {
            const savedVillage = localStorage.getItem("meragaov_name");
            const savedDistrict = localStorage.getItem("meragaov_district");
            
            if (savedVillage && savedDistrict) {
                currentVillage = savedVillage;
                currentDistrict = savedDistrict;
                document.getElementById("village-setup-screen").classList.add("hidden");
                updateUIWithVillageData();
                loadLiveData();
            } else {
                document.getElementById("village-setup-screen").classList.remove("hidden");
            }
        };

        function saveVillageAndProceed() {
            const district = document.getElementById("input-district").value;
            const villageInput = document.getElementById("input-village-name").value.trim();
            
            if (villageInput === "") {
                alert("कृपया गाँव का नाम दर्ज करें!");
                return;
            }
            
            localStorage.setItem("meragaov_name", villageInput);
            localStorage.setItem("meragaov_district", district);
            
            currentVillage = villageInput;
            currentDistrict = district;
            
            document.getElementById("village-setup-screen").classList.add("hidden");
            updateUIWithVillageData();
            loadLiveData();
        }

        function updateUIWithVillageData() {
            document.getElementById("display-village-name").innerText = currentVillage;
            document.getElementById("display-district-name").innerText = "जिला: " + currentDistrict;
            document.getElementById("card-village-name").innerText = currentVillage;
        }

        function requestVillageReset() {
            let newVillage = prompt("नया गाँव दर्ज करें:");
            if(newVillage) {
                localStorage.setItem("meragaov_name", newVillage.trim());
                currentVillage = newVillage.trim();
                location.reload();
            }
        }

        function switchView(view) {
            if(view === 'home') {
                document.getElementById('view-home').classList.remove('hidden');
                document.getElementById('view-content').classList.add('hidden');
            } else {
                document.getElementById('view-home').classList.add('hidden');
                document.getElementById('view-content').classList.remove('hidden');
            }
        }

        function backToHome() {
            switchView('home');
        }

        function openFeature(featureKey) {
            switchView('content');
            const area = document.getElementById('dynamic-content-area');
            area.innerHTML = '';

            let safeKey = currentVillage.replace(/[.#$\/\[\]]/g, "_");

            if (featureKey === 'munadi') {
                area.innerHTML = `
                    <div class="bg-white p-4 rounded-xl shadow border">
                        <h3 class="font-bold text-lg mb-3 text-emerald-800">📢 मुनादी व जरूरी खबरें</h3>
                        <input type="text" id="m-title" placeholder="शीर्षक" class="w-full border p-2.5 rounded-lg mb-2 text-sm">
                        <textarea id="m-desc" placeholder="सूचना यहाँ विस्तार से लिखें..." class="w-full border p-2.5 rounded-lg mb-2 text-sm h-24"></textarea>
                        <button onclick="addMunadiData()" class="w-full bg-green-600 text-white font-bold py-2.5 rounded-lg text-sm shadow">पब्लिश करें</button>
                    </div>
                    <div id="list-munadi" class="space-y-3 mt-4"></div>
                `;
                loadMunadiList(safeKey);
            } 
            else if (featureKey === 'bazar') {
                area.innerHTML = `
                    <div class="bg-white p-4 rounded-xl shadow border">
                        <h3 class="font-bold text-lg mb-3 text-blue-800">🚜 खरीद-बिक्री बाज़ार</h3>
                        <input type="text" id="b-item" placeholder="चीज़ का नाम (जैसे: साइकिल, गेहूँ)" class="w-full border p-2.5 rounded-lg mb-2 text-sm">
                        <input type="text" id="b-price" placeholder="कीमत / विवरण" class="w-full border p-2.5 rounded-lg mb-2 text-sm">
                        <button onclick="addBazarData()" class="w-full bg-blue-600 text-white font-bold py-2.5 rounded-lg text-sm shadow">बाज़ार में डालें</button>
                    </div>
                    <div id="list-bazar" class="space-y-3 mt-4"></div>
                `;
                loadBazarList(safeKey);
            }
            else if (featureKey === 'badhai') {
                area.innerHTML = `
                    <div class="bg-white p-4 rounded-xl shadow border">
                        <h3 class="font-bold text-lg mb-3 text-pink-600">🎉 त्यौहार व बधाई संदेश</h3>
                        <input type="text" id="bd-name" placeholder="किसको बधाई है?" class="w-full border p-2.5 rounded-lg mb-2 text-sm">
                        <textarea id="bd-msg" placeholder="बधाई संदेश..." class="w-full border p-2.5 rounded-lg mb-2 text-sm"></textarea>
                        <button onclick="addBadhaiData()" class="w-full bg-pink-600 text-white font-bold py-2.5 rounded-lg text-sm shadow">संदेश भेजें</button>
                    </div>
                    <div id="list-badhai" class="space-y-3 mt-4"></div>
                `;
                loadBadhaiList(safeKey);
            }
            else if (featureKey === 'history') {
                area.innerHTML = `
                    <div class="bg-white p-4 rounded-xl shadow border">
                        <h3 class="font-bold text-lg mb-3 text-cyan-800">🏛️ गाँव का इतिहास और जानकारी</h3>
                        <textarea id="h-text" placeholder="गाँव के इतिहास के बारे में यहाँ लिखें..." class="w-full border p-2.5 rounded-lg mb-2 text-sm h-32"></textarea>
                        <button onclick="saveHistoryData()" class="w-full bg-cyan-700 text-white font-bold py-2.5 rounded-lg text-sm shadow">इतिहास सेव करें</button>
                    </div>
                    <div class="bg-white p-4 rounded-xl shadow border mt-4">
                        <h4 class="font-bold text-md mb-2 text-gray-700">गाँव का इतिहास:</h4>
                        <div id="display-history-text" class="text-gray-600 text-sm whitespace-pre-line">লোড हो रहा है...</div>
                    </div>
                `;
                loadHistoryData(safeKey);
            }
            else if (featureKey === 'chat') {
                area.innerHTML = `
                    <div class="bg-white rounded-xl shadow border flex flex-col h-[70vh]">
                        <div class="p-3 border-b bg-purple-50 font-bold text-purple-900 text-sm">💬 Admin Chat Room (लाइव)</div>
                        <div id="chat-messages" class="flex-1 p-3 overflow-y-auto space-y-2 text-sm"></div>
                        <div class="p-2 border-t flex gap-2 bg-gray-50">
                            <input type="text" id="chat-input" placeholder="संदेश लिखें..." class="flex-1 border p-2 rounded-lg text-sm" onkeypress="handleChatKey(event)">
                            <button onclick="sendChatMessage()" class="bg-purple-700 text-white px-4 py-2 rounded-lg text-sm font-bold">सेंड</button>
                        </div>
                    </div>
                `;
                loadChatMessages(safeKey);
            }
            else if (featureKey === 'admin') {
                area.innerHTML = `
                    <div class="bg-white p-4 rounded-xl shadow border space-y-4">
                        <h3 class="font-bold text-lg text-slate-800">⚙️ Main Admin Dashboard</h3>
                        <p class="text-xs text-gray-500">यहाँ से एडमिन बैनर इमेज लाइव कर सकते हैं और किसी भी पोस्ट को डिलीट कर सकते हैं।</p>
                        
                        <div>
                            <label class="block text-xs font-bold text-gray-700 mb-1">बैनर इमेज लिंक (URL)</label>
                            <input type="text" id="admin-banner-link" placeholder="https://..." class="w-full border p-2 rounded-lg text-sm mb-2">
                            <button onclick="updateBannerLive()" class="w-full bg-slate-800 text-white py-2 rounded-lg text-xs font-bold shadow">बैनर लाइव करें</button>
                        </div>

                        <hr>
                        <h4 class="font-bold text-sm text-red-600">🗑️ डेटा नियंत्रण और डिलीट पावर</h4>
                        <div id="admin-delete-list" class="space-y-2 text-xs mt-2"></div>
                    </div>
                `;
                loadAdminDataManagement(safeKey);
            }
            else {
                area.innerHTML = `<div class="bg-white p-4 rounded shadow text-center text-sm">यह फीचर जल्द आ रहा है!</div>`;
            }
        }

        function loadLiveData() {
            let safeKey = currentVillage.replace(/[.#$\/\[\]]/g, "_");
            db.ref('villages/' + safeKey + '/banner').on('value', (snapshot) => {
                const box = document.getElementById('top-banner-box');
                const img = document.getElementById('village-banner-img');
                if(snapshot.exists() && snapshot.val().url) {
                    img.src = snapshot.val().url;
                    img.classList.remove('hidden');
                    box.classList.remove('hidden');
                } else {
                    box.classList.add('hidden');
                }
            });
        }

        function updateBannerLive() {
            let safeKey = currentVillage.replace(/[.#$\/\[\]]/g, "_");
            let url = document.getElementById('admin-banner-link').value.trim();
            db.ref('villages/' + safeKey + '/banner').set({ url });
            alert("बैनर सफलताપूर्वक लाइव कर दिया गया है!");
        }

        function addMunadiData() {
            let safeKey = currentVillage.replace(/[.#$\/\[\]]/g, "_");
            let title = document.getElementById('m-title').value.trim();
            let desc = document.getElementById('m-desc').value.trim();
            if(title && desc) {
                db.ref('villages/' + safeKey + '/munadi').push({ title, desc });
                document.getElementById('m-title').value = '';
                document.getElementById('m-desc').value = '';
            } else { alert("कृपया दोनों फील्ड भरें!"); }
        }

        function loadMunadiList(safeKey) {
            db.ref('villages/' + safeKey + '/munadi').on('value', (snapshot) => {
                const list = document.getElementById('list-munadi');
                if(!list) return;
                list.innerHTML = '';
                if(!snapshot.exists()) { list.innerHTML = '<p class="text-xs text-gray-500">कोई मुनादी नहीं है।</p>'; return; }
                snapshot.forEach((child) => {
                    let d = child.val();
                    list.innerHTML += `<div class="bg-white p-3 rounded-lg shadow-sm border"><h4 class="font-bold text-green-800 text-sm">${escapeHtml(d.title)}</h4><p class="text-xs text-gray-600 mt-1">${escapeHtml(d.desc)}</p></div>`;
                });
            });
        }

        function addBazarData() {
            let safeKey = currentVillage.replace(/[.#$\/\[\]]/g, "_");
            let item = document.getElementById('b-item').value.trim();
            let price = document.getElementById('b-price').value.trim();
            if(item && price) {
                db.ref('villages/' + safeKey + '/bazar').push({ item, price });
                document.getElementById('b-item').value = '';
                document.getElementById('b-price').value = '';
            } else { alert("कृपया दोनों फील्ड भरें!"); }
        }

        function loadBazarList(safeKey) {
            db.ref('villages/' + safeKey + '/bazar').on('value', (snapshot) => {
                const list = document.getElementById('list-bazar');
                if(!list) return;
                list.innerHTML = '';
                if(!snapshot.exists()) { list.innerHTML = '<p class="text-xs text-gray-500">बाज़ार खाली है।</p>'; return; }
                snapshot.forEach((child) => {
                    let d = child.val();
                    list.innerHTML += `<div class="bg-white p-3 rounded-lg shadow-sm border flex justify-between items-center"><span class="font-bold text-sm">${escapeHtml(d.item)}</span><span class="text-blue-600 text-xs font-semibold">${escapeHtml(d.price)}</span></div>`;
                });
            });
        }

        function addBadhaiData() {
            let safeKey = currentVillage.replace(/[.#$\/\[\]]/g, "_");
            let name = document.getElementById('bd-name').value.trim();
            let msg = document.getElementById('bd-msg').value.trim();
            if(name && msg) {
                db.ref('villages/' + safeKey + '/badhai').push({ name, msg });
                document.getElementById('bd-name').value = '';
                document.getElementById('bd-msg').value = '';
            } else { alert("कृपया दोनों फील्ड भरें!"); }
        }

        function loadBadhaiList(safeKey) {
            db.ref('villages/' + safeKey + '/badhai').on('value', (snapshot) => {
                const list = document.getElementById('list-badhai');
                if(!list) return;
                list.innerHTML = '';
                if(!snapshot.exists()) { list.innerHTML = '<p class="text-xs text-gray-500">कोई बधाई संदेश नहीं है।</p>'; return; }
                snapshot.forEach((child) => {
                    let d = child.val();
                    list.innerHTML += `<div class="bg-white p-3 rounded-lg shadow-sm border"><h4 class="font-bold text-pink-600 text-sm">बधाई: ${escapeHtml(d.name)}</h4><p class="text-xs text-gray-600 mt-1">${escapeHtml(d.msg)}</p></div>`;
                });
            });
        }

        function saveHistoryData() {
            let safeKey = currentVillage.replace(/[.#$\/\[\]]/g, "_");
            let text = document.getElementById('h-text').value.trim();
            if(text) {
                db.ref('villages/' + safeKey + '/history').set({ text });
                alert("इतिहास सेव हो गया!");
            } else { alert("कृपया कुछ लिखें!"); }
        }

        function loadHistoryData(safeKey) {
            db.ref('villages/' + safeKey + '/history').on('value', (snapshot) => {
                const disp = document.getElementById('display-history-text');
                if(!disp) return;
                if(snapshot.exists() && snapshot.val().text) {
                    disp.innerText = snapshot.val().text;
                } else {
                    disp.innerText = "अभी इतिहास नहीं जोड़ा गया है।";
                }
            });
        }

        function sendChatMessage() {
            let safeKey = currentVillage.replace(/[.#$\/\[\]]/g, "_");
            let text = document.getElementById('chat-input').value.trim();
            if(text) {
                db.ref('villages/' + safeKey + '/chat').push({ text });
                document.getElementById('chat-input').value = '';
            }
        }

        function handleChatKey(e) { if(e.key === 'Enter') sendChatMessage(); }

        function loadChatMessages(safeKey) {
            db.ref('villages/' + safeKey + '/chat').on('value', (snapshot) => {
                const box = document.getElementById('chat-messages');
                if(!box) return;
                box.innerHTML = '';
                if(!snapshot.exists()) { box.innerHTML = '<p class="text-xs text-gray-400 text-center">चैट शुरू करें...</p>'; return; }
                snapshot.forEach((child) => {
                    let d = child.val();
                    box.innerHTML += `<div class="bg-gray-100 p-2 rounded text-xs">${escapeHtml(d.text)}</div>`;
                });
                box.scrollTop = box.scrollHeight;
            });
        }

        function loadAdminDataManagement(safeKey) {
            const adminList = document.getElementById('admin-delete-list');
            if(!adminList) return;
            adminList.innerHTML = '<p class="text-gray-500 text-xs">मुनादी लिस्ट:</p>';
            
            db.ref('villages/' + safeKey + '/munadi').on('value', (snapshot) => {
                if(snapshot.exists()) {
                    snapshot.forEach((child) => {
                        let k = child.key;
                        let val = child.val();
                        adminList.innerHTML += `<div class="flex justify-between items-center bg-gray-50 p-2 rounded border mt-1"><span>📢 ${escapeHtml(val.title)}</span><button onclick="deleteItem('munadi', '${k}')" class="bg-red-600 text-white px-2 py-1 rounded text-[10px]">डिलीट</button></div>`;
                    });
                }
            });
        }

        function deleteItem(type, id) {
            let safeKey = currentVillage.replace(/[.#$\/\[\]]/g, "_");
            if(confirm("क्या आप इसे डिलीट करना चाहते हैं?")) {
                db.ref('villages/' + safeKey + '/' + type + '/' + id).remove();
                alert("सफलतापूर्वक डिलीट हो गया!");
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
