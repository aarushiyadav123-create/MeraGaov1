<script type="text/babel">
const { useState, useEffect, useMemo } = React;

const MASTER_DISTRICT_VILLAGES = {
'rohtak': {
name: { hi: 'रोहतक (Rohtak)', en: 'Rohtak' },
villages: [
{ hi: 'बलम / बलंभा', en: 'Balham' },
{ hi: 'बालंद', en: 'Baland' },
{ hi: 'सांपला', en: 'Sampla' },
{ hi: 'महम', en: 'Meham' }
]
},
'charkhi-dadri': {
name: { hi: 'चरखी दादरी (Charkhi Dadri)', en: 'Charkhi Dadri' },
villages: [
{ hi: 'मालकोश', en: 'Malkosh' },
{ hi: 'बौंद कलां', en: 'Bond Kalan' },
{ hi: 'सांवर', en: 'Sanwar' }
]
},
'bhiwani': {
name: { hi: 'भिवानी (Bhiwani)', en: 'Bhiwani' },
villages: [
{ hi: 'बावनी खेड़ा', en: 'Bawani Khera' },
{ hi: 'तोशाम', en: 'Tosham' }
]
}
};

const INITIAL_DATA = [
{ id: 1, titleHi: 'मालकोश जन सेवा व सीएससी केंद्र', phone: '9812000111', category: 'CSC', districtId: 'charkhi-dadri', villageHi: 'मालकोश', personName: 'रामनिवास मलिक' },
{ id: 2, titleHi: 'मालकोश बाबा रामदेव किराना स्टोर', phone: '9991000444', category: 'Kiryana', districtId: 'charkhi-dadri', villageHi: 'मालकोश', personName: 'राजेश यादव' }
];

function App() {
const [lang, setLang] = useState("hi");
const [view, setView] = useState("home"); 
const [selectedDistrict, setSelectedDistrict] = useState("charkhi-dadri");
const [searchVillage, setSearchVillage] = useState("मालकोश");
const [activeCategory, setActiveCategory] = useState("all");
const [showDropdown, setShowDropdown] = useState(false);
const [showMenuPopup, setShowMenuPopup] = useState(false);

const [services, setServices] = useState(INITIAL_DATA);

// Firebase Realtime Database Sync
useEffect(() => {
if (window.firebaseDb) {
const { db, ref, onValue } = window.firebaseDb;
const servicesRef = ref(db, 'services');
onValue(servicesRef, (snapshot) => {
const data = snapshot.val();
if (data) {
const loadedServices = Object.keys(data).map(key => ({
id: key,
...data[key]
}));
setServices(loadedServices.reverse());
}
});
}
}, []);

const [title, setTitle] = useState("");
const [phone, setPhone] = useState("");
const [category, setCategory] = useState("Mistri");
const [personName, setPersonName] = useState("");
const [adminDistrict, setAdminDistrict] = useState("charkhi-dadri");
const [adminVillage, setAdminVillage] = useState("मालकोश");

const currentDistrictVillages = MASTER_DISTRICT_VILLAGES[selectedDistrict].villages;

const suggestedVillages = useMemo(() => {
const query = searchVillage.trim().toLowerCase();
if (!query) return currentDistrictVillages;
return currentDistrictVillages.filter(v =>
v.hi.toLowerCase().includes(query) || v.en.toLowerCase().includes(query)
);
}, [searchVillage, currentDistrictVillages]);

const selectVillageName = (vName) => {
setSearchVillage(vName);
setShowDropdown(false);
};

const handleDistrictChange = (dId) => {
setSelectedDistrict(dId);
const firstV = MASTER_DISTRICT_VILLAGES[dId].villages[0].hi;
setSearchVillage(firstV);
setShowDropdown(false);
};

const handleAdd = (e) => {
e.preventDefault();
if (!title || !phone || !adminVillage) return alert("कृपया सभी जानकारी भरें!");

const trimmedVillage = adminVillage.trim();
const newSrv = {
titleHi: title,
phone: phone,
category: category,
districtId: adminDistrict,
villageHi: trimmedVillage,
personName: personName || "सत्यापित"
};

if (window.firebaseDb) {
const { db, ref, push } = window.firebaseDb;
const servicesRef = ref(db, 'services');
push(servicesRef, newSrv)
.then(() => {
alert(`गाँव "${trimmedVillage}" में नई सेवा ऑनलाइन (Firebase) सफलतापर्वक जोड़ दी गई है!`);
setSelectedDistrict(adminDistrict);
setSearchVillage(trimmedVillage);
setView("home");
setTitle("");
setPhone("");
setPersonName("");
})
.catch((error) => {
alert("डेटा जोड़ने में त्रुटि: " + error.message);
});
} else {
alert("Firebase कनेक्ट नहीं है!");
}
};

const displayServices = useMemo(() => {
const query = searchVillage.trim().toLowerCase();
return services.filter(s => {
const matchDist = s.districtId === selectedDistrict;
const villageNameLower = s.villageHi ? s.villageHi.toLowerCase() : "";
const matchVill = !query || villageNameLower === query || villageNameLower.includes(query);
const matchCat = activeCategory === "all" || s.category === activeCategory;
return matchDist && matchVill && matchCat;
});
}, [services, selectedDistrict, searchVillage, activeCategory]);

return (
<div className="container" onClick={() => { if(showMenuPopup) setShowMenuPopup(false); }}>

{/* सिंगल साफ़ हेडर */}
<div className="header">
<div className="title-box">
<div className="title">MeraGaov - {searchVillage}</div>
<div className="subtitle">{lang === 'hi' ? 'मेरा गाँव - मेरी पहचान (Live)' : 'My Village - My Identity'}</div>
</div>

<div className="header-right" onClick={(e) => e.stopPropagation()}>
<button className="menu-dropdown-btn" onClick={() => setShowMenuPopup(!showMenuPopup)}>
☰ Menu
</button>
<button className="lang-btn" onClick={() => setLang(lang === 'hi' ? 'en' : 'hi')}>
🌐 {lang === 'hi' ? 'Eng' : 'हिंदी'}
</button>

{showMenuPopup && (
<div className="dropdown-menu">
<div className="dropdown-item" onClick={() => { setView('admin'); setShowMenuPopup(false); }}>⚙️ Admin</div>
<div className="dropdown-item" onClick={() => { setView('subadmin'); setShowMenuPopup(false); }}>🛡️ Sub-Admin</div>
<div className="dropdown-item" onClick={() => { setView('about'); setShowMenuPopup(false); }}>ℹ️ About</div>
<div className="dropdown-item" onClick={() => { setView('policy'); setShowMenuPopup(false); }}>📄 Policy</div>
</div>
)}
</div>
</div>

<div className="ticker">
<span>🌾 सरसों: ₹5,400/क्विंटल</span>
<span>|</span>
<span>🌤️ लाइव मौसम: Haryana - तापमान सामान्य</span>
</div>

<div className="content">

{view === "admin" && (
<div>
<button onClick={() => setView("home")} style={{ background: '#065f46', color: 'white', border: 'none', padding: '8px 14px', borderRadius: '8px', fontSize: '13px', fontWeight: 'bold', cursor: 'pointer', marginBottom: '14px' }}>
← होम पर जाएं
</button>
<div className="card">
<div className="card-title">⚙️ नई दुकान या सेवा दर्ज करें (Live)</div>
<form onSubmit={handleAdd}>
<div className="form-group">
<label>1. जिला चुनें:</label>
<select className="form-control" value={adminDistrict} onChange={e => { setAdminDistrict(e.target.value); setAdminVillage(MASTER_DISTRICT_VILLAGES[e.target.value].villages[0].hi); }}>
{Object.keys(MASTER_DISTRICT_VILLAGES).map(key => (
<option key={key} value={key}>{MASTER_DISTRICT_VILLAGES[key].name[lang] || MASTER_DISTRICT_VILLAGES[key].name.hi}</option>
))}
</select>
</div>

<div className="form-group">
<label>2. गाँव का नाम:</label>
<input className="form-control" type="text" value={adminVillage} onChange={e => setAdminVillage(e.target.value)} required />
</div>

<div className="form-group">
<label>3. दुकान/सेवा का नाम:</label>
<input className="form-control" type="text" placeholder="उदा: यादव किराना स्टोर" value={title} onChange={e => setTitle(e.target.value)} required />
</div>

<div className="form-group">
<label>4. मोबाइल नंबर:</label>
<input className="form-control" type="tel" placeholder="उदा: 9812345678" value={phone} onChange={e => setPhone(e.target.value)} required />
</div>

<div className="form-group">
<label>5. संचालक का नाम:</label>
<input className="form-control" type="text" placeholder="उदा: विकास यादव" value={personName} onChange={e => setPersonName(e.target.value)} />
</div>

<div className="form-group">
<label>6. श्रेणी:</label>
<select className="form-control" value={category} onChange={e => setCategory(e.target.value)}>
<option value="Mistri">🔨 मिस्त्री / कारीगर</option>
<option value="CSC">🏥 दुकान / सीएससी केंद्र</option>
<option value="Kiryana">🛒 किराना / जनरल स्टोर</option>
<option value="Agriculture">🌾 कृषि व खाद-बीज</option>
<option value="Health">💊 स्वास्थ्य / मेडिकल</option>
</select>
</div>

<button type="submit" className="btn-submit">ऑनलाइन सेव करें व लाइव देखें</button>
</form>
</div>
</div>
)}

{view === "subadmin" && (
<div>
<button onClick={() => setView("home")} style={{ background: '#065f46', color: 'white', border: 'none', padding: '8px 14px', borderRadius: '8px', fontSize: '13px', fontWeight: 'bold', cursor: 'pointer', marginBottom: '14px' }}>
← होम पर जाएं
</button>
<div className="card">
<div className="card-title">🛡️ Sub-Admin पैनल</div>
<p style={{ fontSize: '13px', color: '#475569' }}>यहाँ से सब-एडमिन अपने क्षेत्र की मुनादी और खबरों को वेरीफाई कर सकते हैं।</p>
</div>
</div>
)}

{view === "about" && (
<div>
<button onClick={() => setView("home")} style={{ background: '#065f46', color: 'white', border: 'none', padding: '8px 14px', borderRadius: '8px', fontSize: '13px', fontWeight: 'bold', cursor: 'pointer', marginBottom: '14px' }}>
← होम पर जाएं
</button>
<div className="card" style={{ textAlign: 'center', padding: '24px' }}>
<div className="card-title" style={{ justifyContent: 'center' }}>ℹ️ About / परिचय</div>
<p style={{ fontSize: '15px', fontWeight: 'bold', color: '#064e3b', marginBottom: '10px' }}>
Founder: Kusum w/o Rajesh
</p>
<p style={{ fontSize: '13px', color: '#334155', lineHeight: '1.6' }}>
यह पोर्टल हमारे गाँव को डिजिटल रूप से सशक्त बनाने और हर ग्रामीण सेवा को एक क्लिक पर उपलब्ध कराने के लिए समर्पित है।
</p>
</div>
</div>
)}

{view === "policy" && (
<div>
<button onClick={() => setView("home")} style={{ background: '#065f46', color: 'white', border: 'none', padding: '8px 14px', borderRadius: '8px', fontSize: '13px', fontWeight: 'bold', cursor: 'pointer', marginBottom: '14px' }}>
← होम पर जाएं
</button>
<div className="card">
<div className="card-title">📄 Privacy Policy & Terms</div>
<p style={{ fontSize: '13px', color: '#475569', lineHeight: '1.6' }}>
यह प्लेटफ़ॉर्म ग्रामीण डेटा की सुरक्षा और सही जानकारी प्रदान करने के लिए प्रतिबद्ध है। दर्ज की गई सभी सूचियाँ स्थानीय सत्यापन के आधार पर प्रदर्शित की जाती हैं।
</p>
</div>
</div>
)}

{view === "home" && (
<div>
<div className="card" style={{ background: '#ecfdf5', border: '1px solid #a7f3d0' }}>
<div className="card-title" style={{ color: '#064e3b' }}>📍 जिला व गाँव चुनें / बदलें</div>
<div className="form-group">
<label>जिला चुनें:</label>
<select className="form-control" value={selectedDistrict} onChange={e => handleDistrictChange(e.target.value)}>
{Object.keys(MASTER_DISTRICT_VILLAGES).map(key => (
<option key={key} value={key}>{MASTER_DISTRICT_VILLAGES[key].name[lang] || MASTER_DISTRICT_VILLAGES[key].name.hi}</option>
))}
</select>
</div>

<div className="form-group" style={{ marginBottom: 0 }}>
<label>गाँव खोजें:</label>
<input
className="form-control"
type="text"
value={searchVillage}
onFocus={() => setShowDropdown(true)}
onClick={() => setShowDropdown(true)}
onChange={e => { setSearchVillage(e.target.value); setShowDropdown(true); }}
placeholder="गाँव का नाम लिखें..."
/>
{showDropdown && (
<div className="suggestions-list">
{suggestedVillages.length > 0 ? (
suggestedVillages.map((v, index) => (
<div key={index} className="suggestion-item" onClick={() => selectVillageName(v.hi)}>
<span>📍 <b>{v.hi}</b></span>
<span style={{ color: '#64748b', fontSize: '11px' }}>{v.en}</span>
</div>
))
) : (
<div style={{ padding: '10px', fontSize: '12px', color: '#64748b' }}>कोई गाँव नहीं मिला</div>
)}
</div>
)}
</div>
</div>

<div style={{ fontSize: '13px', fontWeight: 'bold', color: '#334155', marginBottom: '10px' }}>
सक्रिय गाँव: <span style={{ color: '#059669' }}>{searchVillage}</span>
</div>

{/* कलरफुल बटन 1 से 8 */}
<div className="menu-card bg-1" onClick={() => { setActiveCategory('CSC'); setView('list'); }}>
<span>🏥 1. दुकान देखें व OTP से जोड़ें</span>
<span>→</span>
</div>

<div className="menu-card bg-2" onClick={() => { setActiveCategory('Mistri'); setView('list'); }}>
<span>🛠️ 1B. आवश्यक सेवाएं (मिस्त्री आदि) देखें व जोड़ें</span>

</div>

<div className="menu-card bg-5" onClick={() => alert("गाँव की गैलरी जल्द लाइव होगी!")}>

<div className="menu-card bg-6" onClick={() => alert("लाइव वीडियो प्रोग्राम जल्द शुरू होंगे!")}>

<span>→</span>

</div>

</div>

<div className="pills">

displayServices.map(s => (

<div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
