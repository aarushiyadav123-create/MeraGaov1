<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MeraGaov - मेरी पहचान</title>

<!-- React & React DOM -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600;700&display=swap');

* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Hind', sans-serif; }
body { background-color: #064e3b; color: #0f172a; padding: 10px; }
.container { max-width: 450px; margin: 0 auto; background: #ffffff; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }

.top-bar { background: #064e3b; color: #ffffff; padding: 10px 16px; font-size: 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #047857; }
.lang-btn { background: #10b981; color: white; border: none; padding: 4px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px; }

.header { background: #065f46; color: white; padding: 16px; }
.header-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
.title { font-size: 17px; font-weight: 700; line-height: 1.2; color: #ffffff; }
.subtitle { font-size: 12px; color: #a7f3d0; }

.ticker { background: #047857; color: #fbbf24; padding: 8px 12px; font-size: 12px; font-weight: bold; display: flex; gap: 12px; white-space: nowrap; overflow-x: auto; border-top: 1px solid #064e3b; }

.menu-card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 14px; margin-bottom: 12px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; font-weight: bold; font-size: 13px; color: #065f46; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
.menu-card:active { background: #f8fafc; transform: scale(0.98); }
.menu-card.orange { background: #ea580c; color: white; }

.btn-group { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
.btn-mode { padding: 6px 10px; border-radius: 6px; font-weight: bold; font-size: 11px; border: none; cursor: pointer; text-align: center; background: #fbbf24; color: #0f172a; }

.content { padding: 16px; background: #f8fafc; min-height: 400px; }

.card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 14px; margin-bottom: 14px; }
.card-title { font-size: 13px; font-weight: 700; color: #065f46; border-bottom: 1px solid #e2e8f0; padding-bottom: 6px; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }

.form-group { margin-bottom: 10px; position: relative; }
.form-group label { display: block; font-size: 11px; font-weight: 700; color: #475569; margin-bottom: 4px; }
.form-control { width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 12px; background: #f8fafc; outline: none; }
.btn-submit { width: 100%; background: #047857; color: white; border: none; padding: 10px; border-radius: 8px; font-weight: bold; font-size: 13px; cursor: pointer; margin-top: 6px; }

.suggestions-list { position: absolute; top: 100%; left: 0; right: 0; background: #ffffff; border: 2px solid #047857; border-radius: 8px; max-height: 200px; overflow-y: auto; z-index: 1000; box-shadow: 0 10px 25px rgba(0,0,0,0.15); }
.suggestion-item { padding: 10px 12px; font-size: 13px; border-bottom: 1px solid #f1f5f9; cursor: pointer; color: #0f172a; display: flex; justify-content: space-between; }
.suggestion-item:hover { background: #ecfdf5; color: #047857; font-weight: bold; }

.village-card { background: #ecfdf5; border: 1px solid #a7f3d0; border-radius: 12px; padding: 12px; display: flex; gap: 12px; align-items: center; margin-bottom: 14px; }
.v-icon { background: #047857; color: white; width: 38px; height: 38px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 16px; flex-shrink: 0; }

.pills { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 14px; }
.pill { padding: 6px 12px; border-radius: 8px; font-size: 11px; font-weight: bold; border: 1px solid #cbd5e1; background: white; white-space: nowrap; cursor: pointer; }
.pill.active { background: #065f46; color: white; border-color: #065f46; }

.service-item { background: white; border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px; margin-bottom: 10px; }
.service-tag { background: #d1fae5; color: #065f46; font-size: 9px; font-weight: bold; padding: 2px 6px; border-radius: 4px; }
.service-name { font-size: 13px; font-weight: 700; color: #0f172a; margin: 4px 0; }
.btn-call { display: block; width: 100%; background: #059669; color: white; text-align: center; text-decoration: none; padding: 8px; border-radius: 8px; font-weight: bold; font-size: 12px; margin-top: 8px; }
.empty-state { text-align: center; padding: 30px 15px; background: #ffffff; border: 1px dashed #cbd5e1; border-radius: 12px; color: #64748b; font-size: 13px; }
</style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
const { useState, useMemo } = React;

const MASTER_DISTRICT_VILLAGES = {
'rohtak': {
name: { hi: 'रोहतक (Rohtak)', en: 'Rohtak' },
villages: [
{ hi: 'बलम / बलंभा', en: 'Balham' },
{ hi: 'बालंद', en: 'Baland' },
{ hi: 'सांपला', en: 'Sampla' },
{ hi: 'महम', en: 'Meham' }
]
},
'charkhi-dadri': {
name: { hi: 'चरखी दादरी (Charkhi Dadri)', en: 'Charkhi Dadri' },
villages: [
{ hi: 'मालकोश', en: 'Malkosh' },
{ hi: 'बौंद कलां', en: 'Bond Kalan' },
{ hi: 'सांवर', en: 'Sanwar' }
]
},
'bhiwani': {
name: { hi: 'भिवानी (Bhiwani)', en: 'Bhiwani' },
villages: [
{ hi: 'बावनी खेड़ा', en: 'Bawani Khera' },
{ hi: 'तोशाम', en: 'Tosham' }
]
}
};

const INITIAL_DATA = [
{ id: 1, titleHi: 'मालकोश जन सेवा व सीएससी केंद्र', phone: '9812000111', category: 'CSC', districtId: 'charkhi-dadri', villageHi: 'मालकोश', personName: 'रामनिवास मलिक' },
{ id: 2, titleHi: 'मालकोश बाबा रामदेव किराना स्टोर', phone: '9991000444', category: 'Kiryana', districtId: 'charkhi-dadri', villageHi: 'मालकोश', personName: 'राजेश यादव' }
];

function App() {
const [lang, setLang] = useState("hi");
const [view, setView] = useState("home"); // home, admin, subadmin, about, policy, list
const [selectedDistrict, setSelectedDistrict] = useState("charkhi-dadri");
const [searchVillage, setSearchVillage] = useState("मालकोश");
const [activeCategory, setActiveCategory] = useState("all");
const [showDropdown, setShowDropdown] = useState(false);

const [services, setServices] = useState(() => {
try {
const saved = localStorage.getItem("haryana_gramin_v17");
return saved ? JSON.parse(saved) : INITIAL_DATA;
} catch (e) { return INITIAL_DATA; }
});

const [title, setTitle] = useState("");
const [phone, setPhone] = useState("");
const [category, setCategory] = useState("Mistri");
const [personName, setPersonName] = useState("");
const [adminDistrict, setAdminDistrict] = useState("charkhi-dadri");
const [adminVillage, setAdminVillage] = useState("मालकोश");

const currentDistrictVillages = MASTER_DISTRICT_VILLAGES[selectedDistrict].villages;

const suggestedVillages = useMemo(() => {
const query = searchVillage.trim().toLowerCase();
if (!query) return currentDistrictVillages;
return currentDistrictVillages.filter(v =>
v.hi.toLowerCase().includes(query) || v.en.toLowerCase().includes(query)
);
}, [searchVillage, currentDistrictVillages]);

const selectVillageName = (vName) => {
setSearchVillage(vName);
setShowDropdown(false);
};

const handleDistrictChange = (dId) => {
setSelectedDistrict(dId);
const firstV = MASTER_DISTRICT_VILLAGES[dId].villages[0].hi;
setSearchVillage(firstV);
setShowDropdown(false);
};

const handleAdd = (e) => {
e.preventDefault();
if (!title || !phone || !adminVillage) return alert("कृपया सभी जानकारी भरें!");

const trimmedVillage = adminVillage.trim();
const newSrv = {
id: Date.now(),
titleHi: title,
phone: phone,
category: category,
districtId: adminDistrict,
villageHi: trimmedVillage,
personName: personName || "सत्यापित"
};

const updated = [newSrv, ...services];
setServices(updated);
localStorage.setItem("haryana_gramin_v17", JSON.stringify(updated));

setSelectedDistrict(adminDistrict);
setSearchVillage(trimmedVillage);
setView("home");

setTitle("");
setPhone("");
setPersonName("");
alert(`गाँव "${trimmedVillage}" में नई सेवा सफलतापूर्वक जोड़ दी गई है!`);
};

const displayServices = useMemo(() => {
const query = searchVillage.trim().toLowerCase();
return services.filter(s => {
const matchDist = s.districtId === selectedDistrict;
const villageNameLower = s.villageHi.toLowerCase();
const matchVill = !query || villageNameLower === query || villageNameLower.includes(query);
const matchCat = activeCategory === "all" || s.category === activeCategory;
return matchDist && matchVill && matchCat;
});
}, [services, selectedDistrict, searchVillage, activeCategory]);

return (
<div className="container">

<div className="top-bar">
<span><b>MeraGaov</b> - {searchVillage}</span>
<button className="lang-btn" onClick={() => setLang(lang === 'hi' ? 'en' : 'hi')}>
🌐 {lang === 'hi' ? 'Eng' : 'हिंदी'}
</button>
</div>

<div className="header">
<div className="header-top">
<div>
<div className="title">MeraGaov - {searchVillage}</div>
<div className="subtitle">{lang === 'hi' ? 'मेरा गाँव - मेरी पहचान' : 'My Village - My Identity'}</div>
</div>
</div>

<div className="btn-group">
<button onClick={() => setView("admin")} className="btn-mode">⚙️ Admin</button>
<button onClick={() => setView("subadmin")} className="btn-mode">🛡️ Sub-Admin</button>
<button onClick={() => setView("about")} className="btn-mode">ℹ️ About</button>
<button onClick={() => setView("policy")} className="btn-mode">📄 Policy</button>
</div>
</div>

<div className="ticker">
<span>🌾 सरसों: ₹5,400/क्विंटल</span>
<span>|</span>
<span>🌤️ लाइव मौसम: Haryana - तापमान सामान्य</span>
</div>

<div className="content">

{view === "admin" && (
<div>
<button onClick={() => setView("home")} style={{ background: '#065f46', color: 'white', border: 'none', padding: '6px 12px', borderRadius: '6px', fontSize: '12px', fontWeight: 'bold', cursor: 'pointer', marginBottom: '12px' }}>
← होम पर जाएं
</button>
<div className="card">
<div className="card-title">⚙️ नई दुकान या सेवा दर्ज करें</div>
<form onSubmit={handleAdd}>
<div className="form-group">
<label>1. जिला चुनें:</label>
<select className="form-control" value={adminDistrict} onChange={e => { setAdminDistrict(e.target.value); setAdminVillage(MASTER_DISTRICT_VILLAGES[e.target.value].villages[0].hi); }}>
{Object.keys(MASTER_DISTRICT_VILLAGES).map(key => (
<option key={key} value={key}>{MASTER_DISTRICT_VILLAGES[key].name[lang] || MASTER_DISTRICT_VILLAGES[key].name.hi}</option>
))}
</select>
</div>

<div className="form-group">
<label>2. गाँव का नाम:</label>
<input className="form-control" type="text" value={adminVillage} onChange={e => setAdminVillage(e.target.value)} required />
</div>

<div className="form-group">
<label>3. दुकान/सेवा का नाम:</label>
<input className="form-control" type="text" placeholder="उदा: यादव किराना स्टोर" value={title} onChange={e => setTitle(e.target.value)} required />
</div>

<div className="form-group">
<label>4. मोबाइल नंबर:</label>
<input className="form-control" type="tel" placeholder="उदा: 9812345678" value={phone} onChange={e => setPhone(e.target.value)} required />
</div>

<div className="form-group">
<label>5. संचालक का नाम:</label>
<input className="form-control" type="text" placeholder="उदा: विकास यादव" value={personName} onChange={e => setPersonName(e.target.value)} />
</div>

<div className="form-group">
<label>6. श्रेणी:</label>
<select className="form-control" value={category} onChange={e => setCategory(e.target.value)}>
<option value="Mistri">🔨 मिस्त्री / कारीगर</option>
<option value="CSC">🏥 दुकान / सीएससी केंद्र</option>
<option value="Kiryana">🛒 किराना / जनरल स्टोर</option>
<option value="Agriculture">🌾 कृषि व खाद-बीज</option>
<option value="Health">💊 स्वास्थ्य / मेडिकल</option>
</select>
</div>

<button type="submit" className="btn-submit">सेव करें व गाँव देखें</button>
</form>
</div>
</div>
)}

{view === "subadmin" && (
<div>
<button onClick={() => setView("home")} style={{ background: '#065f46', color: 'white', border: 'none', padding: '6px 12px', borderRadius: '6px', fontSize: '12px', fontWeight: 'bold', cursor: 'pointer', marginBottom: '12px' }}>
← होम पर जाएं
</button>
<div className="card">
<div className="card-title">🛡️ Sub-Admin पैनल</div>
<p style={{ fontSize: '12px', color: '#475569' }}>यहाँ से सब-एडमिन अपने क्षेत्र की मुनादी और खबरों को वेरीफाई कर सकते हैं।</p>
</div>
</div>
)}

{view === "about" && (
<div>
<button onClick={() => setView("home")} style={{ background: '#065f46', color: 'white', border: 'none', padding: '6px 12px', borderRadius: '6px', fontSize: '12px', fontWeight: 'bold', cursor: 'pointer', marginBottom: '12px' }}>
← होम पर जाएं
</button>
<div className="card" style={{ textAlign: 'center', padding: '20px' }}>
<div className="card-title" style={{ justifyContent: 'center' }}>ℹ️ About / परिचय</div>
<p style={{ fontSize: '14px', fontWeight: 'bold', color: '#064e3b', marginBottom: '10px' }}>
Founder: Kusum w/o Rajesh
</p>
<p style={{ fontSize: '13px', color: '#334155' }}>
यह पोर्टल हमारे गाँव को डिजिटल रूप से सशक्त बनाने और हर ग्रामीण सेवा को एक क्लिक पर उपलब्ध कराने के लिए समर्पित है।
</p>
</div>
</div>
)}

{view === "policy" && (
<div>
<button onClick={() => setView("home")} style={{ background: '#065f46', color: 'white', border: 'none', padding: '6px 12px', borderRadius: '6px', fontSize: '12px', fontWeight: 'bold', cursor: 'pointer', marginBottom: '12px' }}>
← होम पर जाएं
</button>
<div className="card">
<div className="card-title">📄 Privacy Policy & Terms</div>
<p style={{ fontSize: '12px', color: '#475569', lineHeight: '1.5' }}>
यह प्लेटफ़ॉर्म ग्रामीण डेटा की सुरक्षा और सही जानकारी प्रदान करने के लिए प्रतिबद्ध है। दर्ज की गई सभी सूचियाँ स्थानीय सत्यापन के आधार पर प्रदर्शित की जाती हैं।
</p>
</div>
</div>
)}

{view === "home" && (
<div>
<div className="card" style={{ background: '#ecfdf5', border: '1px solid #a7f3d0' }}>
<div className="card-title" style={{ color: '#064e3b' }}>📍 जिला व गाँव चुनें / बदलें</div>
<div className="form-group">
<label>जिला चुनें:</label>
<select className="form-control" value={selectedDistrict} onChange={e => handleDistrictChange(e.target.value)}>
{Object.keys(MASTER_DISTRICT_VILLAGES).map(key => (
<option key={key} value={key}>{MASTER_DISTRICT_VILLAGES[key].name[lang] || MASTER_DISTRICT_VILLAGES[key].name.hi}</option>
))}
</select>
</div>

<div className="form-group" style={{ marginBottom: 0 }}>
<label>गाँव खोजें:</label>
<input
className="form-control"
type="text"
value={searchVillage}
onFocus={() => setShowDropdown(true)}
onClick={() => setShowDropdown(true)}
onChange={e => { setSearchVillage(e.target.value); setShowDropdown(true); }}
placeholder="गाँव का नाम लिखें..."
/>
{showDropdown && (
<div className="suggestions-list">
{suggestedVillages.length > 0 ? (
suggestedVillages.map((v, index) => (
<div key={index} className="suggestion-item" onClick={() => selectVillageName(v.hi)}>
<span>📍 <b>{v.hi}</b></span>
<span style={{ color: '#64748b', fontSize: '11px' }}>{v.en}</span>
</div>
))
) : (
<div style={{ padding: '10px', fontSize: '12px', color: '#64748b' }}>कोई गाँव नहीं मिला</div>
)}
</div>
)}
</div>
</div>

<div style={{ fontSize: '12px', fontWeight: 'bold', color: '#334155', marginBottom: '8px' }}>
सक्रिय गाँव: <span style={{ color: '#059669' }}>{searchVillage}</span>
</div>

<div className="menu-card" onClick={() => { setActiveCategory('CSC'); setView('list'); }}>
<span>🏥 1. दुकान देखें व OTP से जोड़ें →</span>
</div>

<div className="menu-card" onClick={() => { setActiveCategory('Mistri'); setView('list'); }}>
<span>🛠️ 1B. आवश्यक सेवाएं (मिस्त्री आदि) देखें व जोड़ें →</span>
</div>

<div className="menu-card orange" onClick={() => alert("मुनादी व खबरें सेक्शन जल्द सक्रिय होगा!")}>
<span>📢 2. मुनादी, मेला व खबरें (Sub-Admin Verified) →</span>
</div>

<div className="menu-card" onClick={() => { setActiveCategory('Agriculture'); setView('list'); }}>
<span>🌾 3. पशु, गेहूँ, चारा खरीद-बेच →</span>
</div>

<div className="menu-card" onClick={() => alert("गाँव की गैलरी जल्द लाइव होगी!")}>
<span>📸 4. गाँव की गैलरी (लाइव फोटो) →</span>
</div>

<div className="menu-card" onClick={() => alert("लाइव वीडियो प्रोग्राम जल्द शुरू होंगे!")}>
<span>🎵 5. वीडियो और लाइव प्रोग्राम (Live & Camera) →</span>
</div>

</div>
)}

{view === "list" && (
<div>
<button onClick={() => setView("home")} style={{ background: '#065f46', color: 'white', border: 'none', padding: '6px 12px', borderRadius: '6px', fontSize: '12px', fontWeight: 'bold', cursor: 'pointer', marginBottom: '12px' }}>
← मुख्य मेनू पर वापस जाएं
</button>

<div className="village-card">
<div className="v-icon">{searchVillage[0]}</div>
<div style={{ fontSize: '12px' }}>
<div style={{ fontSize: '14px', fontWeight: 'bold', color: '#064e3b' }}>गाँव: {searchVillage}</div>
<div style={{ color: '#64748b' }}>केवल सत्यापित और ओरिजिनल लिस्टिंग</div>
</div>
</div>

<div className="pills">
{[
{ id: 'all', name: 'सभी सेवाएं' },
{ id: 'Mistri', name: '🔨 मिस्त्री' },
{ id: 'CSC', name: '🏥 सीएससी' },
{ id: 'Kiryana', name: '🛒 किराना' },
{ id: 'Agriculture', name: '🌾 कृषि' }
].map(cat => (
<button
key={cat.id}
className={`pill ${activeCategory === cat.id ? 'active' : ''}`}
onClick={() => setActiveCategory(cat.id)}
>
{cat.name}
</button>
))}
</div>

<div>
<div style={{ fontSize: '12px', fontWeight: 'bold', color: '#475569', marginBottom: '8px' }}>
"{searchVillage}" की सेवाएं ({displayServices.length})
</div>

{displayServices.length > 0 ? (
displayServices.map(s => (
<div key={s.id} className="service-item">
<div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
<span className="service-tag">{s.category}</span>
<span style={{ fontSize: '10px', color: '#059669', fontWeight: 'bold' }}>✔ सत्यापित</span>
</div>
<div className="service-name">{s.titleHi}</div>
<div style={{ fontSize: '11px', color: '#64748b' }}>👤 संचालक: {s.personName}</div>
<a href={`tel:${s.phone}`} className="btn-call">📞 कॉल करें ({s.phone})</a>
</div>
))
) : (
<div className="empty-state">
🚫 <b>{searchVillage}</b> गाँव में इस श्रेणी में अभी कोई दुकान दर्ज नहीं है।<br /><br />
<button onClick={() => setView("admin")} style={{ background: '#047857', color: 'white', border: 'none', padding: '8px 14px', borderRadius: '6px', fontSize: '12px', cursor: 'pointer', fontWeight: 'bold' }}>
