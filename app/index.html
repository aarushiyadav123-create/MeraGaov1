<div className="live-upload-box">
<input className="form-control" placeholder="सरपंच का नाम / इतिहास शीर्षक..." value={uploadText} onChange={e => setUploadText(e.target.value)} style={{marginBottom:'8px'}} />
<input className="form-control" placeholder="कार्यकाल (जैसे: 2015 से 2020)..." value={extraInput} onChange={e => setExtraInput(e.target.value)} style={{marginBottom:'8px'}} />
<input type="file" accept="image/*" capture="environment" onChange={e => handleImageCapture(e, setUploadMedia)} style={{fontSize:'12px', marginBottom:'8px'}} />
{uploadMedia && <img src={uploadMedia} style={{width:'100%', height:'120px', objectFit:'cover', borderRadius:'8px', marginBottom:'8px'}} />}
<button className="btn-submit" onClick={() => { if(!uploadText) return alert("विवरण लिखें!"); saveDynamicData('history', { name: uploadText, tenure: extraInput, image: uploadMedia }, "इतिहास/सरपंच की जानकारी लाइव जोड़ दी गई!"); }}>📸 लाइव जोड़ें (Admin Verified)</button>
</div>
<div className="media-grid">
{historyItems.filter(h => h.villageHi === searchVillage).map(item => (
<div key={item.id} className="media-card">
<p style={{fontSize:'13px', fontWeight:'bold'}}>👤 {item.name}</p>
<p style={{fontSize:'12px', color:'#047857'}}>📅 कार्यकाल: {item.tenure}</p>
{item.image && <img src={item.image} />}
{(isAdminLoggedIn || isSubAdminLoggedIn) && <button className="delete-btn" onClick={() => deleteItem('history', item.id)}>🗑️ डिलीट</button>}
</div>
))}
</div>
</div>
</div>
)}

{view === "home" && (
<div>
<div className="card" style={{ background: '#ecfdf5', border: '1px solid #a7f3d0' }}>
<div className="card-title" style={{ color: '#064e3b' }}>{t.selectDistVill}</div>
<div className="form-group"><label>{t.selectDistrict}</label>
<select className="form-control" value={selectedDistrict} onChange={e => { setSelectedDistrict(e.target.value); setSearchVillage(MASTER_DISTRICT_VILLAGES[e.target.value].villages[0].hi); }}>
{Object.keys(MASTER_DISTRICT_VILLAGES).map(key => <option key={key} value={key}>{MASTER_DISTRICT_VILLAGES[key].name[lang]}</option>)}
</select></div>
<div className="form-group" style={{ marginBottom: 0 }}><label>{t.searchVillageLabel}</label>
<input className="form-control" type="text" value={searchVillage} onFocus={() => setShowDropdown(true)} onClick={() => setShowDropdown(true)} onChange={e => { setSearchVillage(e.target.value); setShowDropdown(true); }} />
{showDropdown && (
<div className="suggestions-list">
{suggestedVillages.map((v, i) => <div key={i} className="suggestion-item" onClick={() => { setSearchVillage(v.hi); setShowDropdown(false); }}><span>📍 <b>{v.hi}</b></span></div>)}
</div>
)}
</div>
</div>

<div style={{ fontSize: '13px', fontWeight: 'bold', color: '#334155', marginBottom: '10px' }}>{t.activeVillage} <span style={{ color: '#059669' }}>{searchVillage}</span></div>

<div className="menu-card bg-1" onClick={() => { setActiveCategory('CSC'); setView('list'); }}><span>{t.menu1}</span><span>→</span></div>
<div className="menu-card bg-2" onClick={() => { setActiveCategory('Mistri'); setView('list'); }}><span>{t.menu2}</span><span>→</span></div>
<div className="menu-card bg-3" onClick={() => setView('announcements')}><span>{t.menu3}</span><span>→</span></div>
<div className="menu-card bg-4" onClick={() => setView('market')}><span>{t.menu4}</span><span>→</span></div>
<div className="menu-card bg-5" onClick={() => setView('gallery')}><span>{t.menu5}</span><span>→</span></div>
<div className="menu-card bg-6" onClick={() => setView('videos')}><span>{t.menu6}</span><span>→</span></div>
<div className="menu-card bg-7" onClick={() => setView('education')}><span>{t.menu7}</span><span>→</span></div>
<div className="menu-card bg-8" onClick={() => setView('animals')}><span>{t.menu8}</span><span>→</span></div>
<div className="menu-card bg-1" onClick={() => setView('weather_mandi')}><span>{t.menu9}</span><span>→</span></div>
<div className="menu-card bg-2" onClick={() => setView('schemes')}><span>{t.menu10}</span><span>→</span></div>
<div className="menu-card bg-3" onClick={() => setView('history')}><span>{t.menu11}</span><span>→</span></div>
</div>
)}

{view === "list" && (
<div>
<div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'14px'}}>
<button className="back-btn" onClick={() => setView("home")} style={{margin:0}}>← वापस</button>
<button onClick={() => setView("add_service")} style={{background:'#047857', color:'white', border:'none', padding:'8px 12px', borderRadius:'8px', fontSize:'12px', fontWeight:'bold', cursor:'pointer'}}>+ दुकान/सेवा जोड़ें</button>
</div>

<div className="village-card">
<div className="v-icon">{searchVillage[0]}</div>
<div><b>गाँव:</b> {searchVillage}</div>
</div>

<div className="pills">
{[
{id:'all', name:'सभी'},
{id:'Mistri', name:'🔨 मिस्त्री'},
{id:'CSC', name:'🏥 सीएससी'},
{id:'Kiryana', name:'🛒 किराना'},
{id:'Agriculture', name:'🌾 कृषि'},
{id:'Health', name:'💊 स्वास्थ्य'}
].map(c => (
<button key={c.id} className={`pill ${activeCategory === c.id ? 'active' : ''}`} onClick={() => setActiveCategory(c.id)}>{c.name}</button>
))}
</div>

{displayServices.length > 0 ? displayServices.map(s => (
<div key={s.id} className="service-item">
<span className="service-tag">{s.category}</span>
<div className="service-name">{s.titleHi}</div>
<div style={{ fontSize: '12px', color: '#64748b' }}>👤 संचालक: {s.personName}</div>
<a href={`tel:${s.phone}`} className="btn-call">📞 कॉल करें ({s.phone})</a>
{(isAdminLoggedIn || isSubAdminLoggedIn) && <button className="delete-btn" onClick={() => deleteItem('services', s.id)}>🗑️ डिलीट करें</button>}
</div>
)) : (
<div className="empty-state">
कोई दुकान या सेवा दर्ज नहीं है।<br/><br/>
<button onClick={() => setView("add_service")} style={{background:'#047857', color:'white', border:'none', padding:'8px 14px', borderRadius:'8px', fontSize:'12px', cursor:'pointer', fontWeight:'bold'}}>+ इस गाँव में नया जोड़ें</button>
</div>
)}
</div>
)}

{view === "add_service" && (
<div>
<button className="back-btn" onClick={() => setView("list")}>← वापस</button>
<div className="card">
<div className="card-title">⚙️ नई दुकान या सेवा दर्ज करें ({searchVillage})</div>
<form onSubmit={(e) => {
e.preventDefault();
if(!title || !phone) return alert("कृपया जानकारी भरें!");
saveDynamicData('services', { titleHi: title, phone, category, personName: personName || "सत्यापित" }, "सेवा सफलतापूर्वक जोड़ दी गई!");
setView("list");
}}>
<div className="form-group"><label>नाम (दुकान/व्यक्ति):</label><input className="form-control" value={title} onChange={e => setTitle(e.target.value)} required /></div>
<div className="form-group"><label>संचालक का नाम:</label><input className="form-control" value={personName} onChange={e => setPersonName(e.target.value)} /></div>
<div className="form-group"><label>मोबाइल:</label><input className="form-control" value={phone} onChange={e => setPhone(e.target.value)} required /></div>
<div className="form-group"><label>श्रेणी:</label>
<select className="form-control" value={category} onChange={e => setCategory(e.target.value)}>
<option value="Mistri">🔨 मिस्त्री / कारीगर</option>
<option value="CSC">🏥 दुकान / सीएससी</option>
<option value="Kiryana">🛒 किराना स्टोर</option>
<option value="Agriculture">🌾 कृषि व खाद-बीज</option>
<option value="Health">💊 स्वास्थ्य / मेडिकल</option>
</select></div>
<button type="submit" className="btn-submit">ऑनलाइन सेव करें व लाइव देखें</button>
</form>
</div>
</div>
)}

</div>
</div>
);
}

document.getElementById('root') ? ReactDOM.createRoot(document.getElementById('root')).render(<App />) : null;
</script>
</body>
</html>
